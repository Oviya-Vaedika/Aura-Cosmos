function skyDeg2rad(d){return d*Math.PI/180;}
function skyRad2deg(r){return r*180/Math.PI;}
function skyNorm360(x){x=x%360; if(x<0)x+=360; return x;}
function skyEval(elem,d){ return Array.isArray(elem) ? elem[0]+elem[1]*d : elem; }

function skyDayNumber(date){
  const Y=date.getUTCFullYear(), Mo=date.getUTCMonth()+1, D=date.getUTCDate();
  const UT=date.getUTCHours()+date.getUTCMinutes()/60+date.getUTCSeconds()/3600;
  return 367*Y - Math.floor(7*(Y+Math.floor((Mo+9)/12))/4) + Math.floor(275*Mo/9) + D - 730530 + UT/24;
}
function skySolveKepler(Mdeg,e){
  const M=skyDeg2rad(Mdeg);
  let E=M+e*Math.sin(M)*(1+e*Math.cos(M));
  for(let i=0;i<8;i++){ E -= (E-e*Math.sin(E)-M)/(1-e*Math.cos(E)); }
  return E;
}
function skyComputeSun(d){
  const w=skyNorm360(skyEval([282.9404,4.70935e-5],d));
  const e=skyEval([0.016709,-1.151e-9],d);
  const M=skyNorm360(skyEval([356.0470,0.9856002585],d));
  const E=skySolveKepler(M,e);
  const xv=Math.cos(E)-e, yv=Math.sqrt(1-e*e)*Math.sin(E);
  const r=Math.sqrt(xv*xv+yv*yv);
  const v=skyNorm360(skyRad2deg(Math.atan2(yv,xv)));
  const lon=skyNorm360(v+w);
  return {lon, r, M, w, e, xs:r*Math.cos(skyDeg2rad(lon)), ys:r*Math.sin(skyDeg2rad(lon))};
}
function skyComputeHelio(elem,d){
  const N=skyNorm360(skyEval(elem.N,d)), i=skyEval(elem.i,d), w=skyNorm360(skyEval(elem.w,d));
  const a=skyEval(elem.a,d), e=skyEval(elem.e,d), M=skyNorm360(skyEval(elem.M,d));
  const E=skySolveKepler(M,e);
  const xv=a*(Math.cos(E)-e), yv=a*(Math.sqrt(1-e*e)*Math.sin(E));
  const r=Math.sqrt(xv*xv+yv*yv);
  const v=skyNorm360(skyRad2deg(Math.atan2(yv,xv)));
  const Nr=skyDeg2rad(N), ir=skyDeg2rad(i), vwr=skyDeg2rad(v+w);
  const xh=r*(Math.cos(Nr)*Math.cos(vwr)-Math.sin(Nr)*Math.sin(vwr)*Math.cos(ir));
  const yh=r*(Math.sin(Nr)*Math.cos(vwr)+Math.cos(Nr)*Math.sin(vwr)*Math.cos(ir));
  const zh=r*(Math.sin(vwr)*Math.sin(ir));
  return {xh,yh,zh,r};
}
function skyEclipticToEquatorial(xg,yg,zg,d){
  const obl=skyDeg2rad(23.4393-3.563e-7*d);
  const xe=xg, ye=yg*Math.cos(obl)-zg*Math.sin(obl), ze=yg*Math.sin(obl)+zg*Math.cos(obl);
  const ra=skyNorm360(skyRad2deg(Math.atan2(ye,xe)))/15;
  const dec=skyRad2deg(Math.atan2(ze,Math.sqrt(xe*xe+ye*ye)));
  return {ra,dec};
}
function skyComputePlanet(key,d,sun){
  const h=skyComputeHelio(SKY_PLANET_ELEMENTS[key],d);
  const xg=h.xh+sun.xs, yg=h.yh+sun.ys, zg=h.zh;
  const eq=skyEclipticToEquatorial(xg,yg,zg,d);
  const dist=Math.sqrt(xg*xg+yg*yg+zg*zg);
  return {ra:eq.ra, dec:eq.dec, dist};
}
function skyComputeMoon(d,sun){
  const N=skyNorm360(skyEval(SKY_MOON_ELEMENTS.N,d)), i=SKY_MOON_ELEMENTS.i, w=skyNorm360(skyEval(SKY_MOON_ELEMENTS.w,d));
  const a=SKY_MOON_ELEMENTS.a, e=SKY_MOON_ELEMENTS.e, M=skyNorm360(skyEval(SKY_MOON_ELEMENTS.M,d));
  const E=skySolveKepler(M,e);
  const xv=a*(Math.cos(E)-e), yv=a*(Math.sqrt(1-e*e)*Math.sin(E));
  const r0=Math.sqrt(xv*xv+yv*yv);
  const v=skyNorm360(skyRad2deg(Math.atan2(yv,xv)));
  const Nr=skyDeg2rad(N), ir=skyDeg2rad(i), vwr=skyDeg2rad(v+w);
  let xh=r0*(Math.cos(Nr)*Math.cos(vwr)-Math.sin(Nr)*Math.sin(vwr)*Math.cos(ir));
  let yh=r0*(Math.sin(Nr)*Math.cos(vwr)+Math.cos(Nr)*Math.sin(vwr)*Math.cos(ir));
  let zh=r0*(Math.sin(vwr)*Math.sin(ir));
  let lon=skyNorm360(skyRad2deg(Math.atan2(yh,xh)));
  let lat=skyRad2deg(Math.atan2(zh,Math.sqrt(xh*xh+yh*yh)));
  let dist=Math.sqrt(xh*xh+yh*yh+zh*zh);
  // perturbation terms (Schlyter)
  const Ms=skyDeg2rad(sun.M), Mm=skyDeg2rad(M), Nm=skyDeg2rad(N), ws=skyDeg2rad(sun.w), wm=skyDeg2rad(w);
  const Lm=Nm+wm+Mm, Ls=ws+Ms, D=Lm-Ls, F=Lm-Nm;
  const lonPert = -1.274*Math.sin(Mm-2*D) +0.658*Math.sin(2*D) -0.186*Math.sin(Ms) -0.059*Math.sin(2*Mm-2*D)
    -0.057*Math.sin(Mm-2*D+Ms) +0.053*Math.sin(Mm+2*D) +0.046*Math.sin(2*D-Ms) +0.041*Math.sin(Mm-Ms)
    -0.035*Math.sin(D) -0.031*Math.sin(Mm+Ms) -0.015*Math.sin(2*F-2*D) +0.011*Math.sin(Mm-4*D);
  const latPert = -0.173*Math.sin(F-2*D) -0.055*Math.sin(Mm-F-2*D) -0.046*Math.sin(Mm+F-2*D) +0.033*Math.sin(F+2*D) +0.017*Math.sin(2*Mm+F);

  lon=skyNorm360(lon+lonPert); lat+=latPert; dist+=distPert;
  const lr=skyDeg2rad(lon), lt=skyDeg2rad(lat);
  xh=dist*Math.cos(lr)*Math.cos(lt); yh=dist*Math.sin(lr)*Math.cos(lt); zh=dist*Math.sin(lt);
  const eq=skyEclipticToEquatorial(xh,yh,zh,d);
  return {ra:eq.ra, dec:eq.dec, dist, xh, yh, zh, eclipticLon:lon};
}
function skyMoonPhase(moon,sun){
  const sv={x:sun.xs,y:sun.ys,z:0}, mv={x:moon.xh,y:moon.yh,z:moon.zh};
  const dot=sv.x*mv.x+sv.y*mv.y+sv.z*mv.z;
  const magS=Math.sqrt(sv.x*sv.x+sv.y*sv.y+sv.z*sv.z), magM=Math.sqrt(mv.x*mv.x+mv.y*mv.y+mv.z*mv.z);
  const cosElong=dot/(magS*magM);
  const illum=(1-cosElong)/2;
  const diff=skyNorm360(moon.eclipticLon-sun.lon);
  const waxing = diff < 180;
  let name;
  if(diff<22.5||diff>=337.5) name='New Moon';
  else if(diff<67.5) name='Waxing Crescent';
  else if(diff<112.5) name='First Quarter';
  else if(diff<157.5) name='Waxing Gibbous';
  else if(diff<202.5) name='Full Moon';
  else if(diff<247.5) name='Waning Gibbous';
  else if(diff<292.5) name='Last Quarter';
  else name='Waning Crescent';
  return {illum, waxing, name};
}
function skyLST(d,date,lonDeg,sun){
  const LsMean=skyNorm360(sun.M+sun.w);
  const GMST0=skyNorm360(LsMean+180);
  const UT=date.getUTCHours()+date.getUTCMinutes()/60+date.getUTCSeconds()/3600;
  const GMST=skyNorm360(GMST0+UT*15);
  return skyNorm360(GMST+lonDeg);
}
function skyAltAz(raHours,decDeg,latDeg,lstDeg){
  const HA=skyDeg2rad(skyNorm360(lstDeg-raHours*15));
  const lat=skyDeg2rad(latDeg), dec=skyDeg2rad(decDeg);
  const sinAlt=Math.sin(dec)*Math.sin(lat)+Math.cos(dec)*Math.cos(lat)*Math.cos(HA);
  const alt=Math.asin(Math.max(-1,Math.min(1,sinAlt)));
  const y=-Math.sin(HA)*Math.cos(dec);
  const x=Math.cos(lat)*Math.sin(dec)-Math.sin(lat)*Math.cos(dec)*Math.cos(HA);
  return {alt:skyRad2deg(alt), az:skyNorm360(skyRad2deg(Math.atan2(y,x)))};
}

function initSkyCanvas(){
  const wrap = document.getElementById('skyCanvasWrap');
  if(!wrap) return;
  const canvas = document.createElement('canvas');
  wrap.insertBefore(canvas, wrap.firstChild);
  const dpr = Math.min(window.devicePixelRatio,2);
  function resize(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    canvas.width = w*dpr; canvas.height = h*dpr;
  }
  resize();
  liveSky.canvas = canvas;
  liveSky.ctx = canvas.getContext('2d');
  liveSky.dpr = dpr;
  liveSky.wrap = wrap;
  liveSky.onResize = ()=>{ resize(); skyRecomputeAndDraw(); };
  window.addEventListener('resize', liveSky.onResize);

  liveSky.onTap = (e)=>{
    const rect = wrap.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    skyIdentifyTap(px, py, rect.width, rect.height);
  };
  wrap.addEventListener('pointerdown', liveSky.onTap);
}

function skyRecomputeAndDraw(){
  if(!liveSky || liveSky.lat===null) return;
  const effDate = new Date(Date.now() + liveSky.timeOffsetHours*3600*1000);
  const d = skyDayNumber(effDate);
  const sun = skyComputeSun(d);
  const lst = skyLST(d, effDate, liveSky.lon, sun);

  const sunEq = skyEclipticToEquatorial(sun.xs, sun.ys, 0, d);
  const sunAltAz = skyAltAz(sunEq.ra, sunEq.dec, liveSky.lat, lst);

  const moon = skyComputeMoon(d, sun);
  const moonAltAz = skyAltAz(moon.ra, moon.dec, liveSky.lat, lst);
  const phase = skyMoonPhase(moon, sun);

  const planetBodies = [];
  Object.keys(SKY_PLANET_ELEMENTS).forEach(key=>{
    const p = skyComputePlanet(key, d, sun);
    const altaz = skyAltAz(p.ra, p.dec, liveSky.lat, lst);
    planetBodies.push({key, label:SKY_PLANET_ELEMENTS[key].label, color:SKY_PLANET_ELEMENTS[key].color, dist:p.dist, alt:altaz.alt, az:altaz.az});
  });

  const starBodies = SKY_STARS.map(s=>{
    const altaz = skyAltAz(s.ra, s.de, liveSky.lat, lst);
    return {n:s.n, c:s.c, m:s.m, alt:altaz.alt, az:altaz.az};
  });

  liveSky.frame = {
    sunAlt: sunAltAz.alt, sunAz: sunAltAz.az,
    moonAlt: moonAltAz.alt, moonAz: moonAltAz.az, moonPhase: phase, moonDist: moon.dist,
    planets: planetBodies, stars: starBodies, effDate
  };

  const timeChip = document.getElementById('skyTimeChip');
  const locChip = document.getElementById('skyLocChip');
  if(timeChip) timeChip.textContent = effDate.toLocaleString(undefined, {hour:'2-digit', minute:'2-digit', month:'short', day:'numeric'});
  if(locChip) locChip.textContent = `${liveSky.lat.toFixed(1)}°, ${liveSky.lon.toFixed(1)}°`;

  skyDrawFrame();
}

function skyProject(alt, az, cx, cy, R){
  const rFrac = (90-alt)/90 * R;
  const azRad = skyDeg2rad(az);
  return { x: cx - rFrac*Math.sin(azRad), y: cy - rFrac*Math.cos(azRad), rFrac };
}

function skyDrawFrame(){
  if(!liveSky || !liveSky.frame) return;
  const {ctx, canvas, dpr} = liveSky;
  const w = canvas.width/dpr, h = canvas.height/dpr;
  const cx = w/2, cy = h/2;
  const R = Math.min(w,h)/2 - 14;
  ctx.save(); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);

  const f = liveSky.frame;
  const sunAlt = f.sunAlt;
  let skyTop, skyBottom;
  if(sunAlt > 6){ skyTop='#3a6ea8'; skyBottom='#8fb8dd'; }
  else if(sunAlt > -6){ skyTop='#1c2440'; skyBottom='#c9713f'; }
  else if(sunAlt > -12){ skyTop='#0a0a1c'; skyBottom='#2a2050'; }
  else { skyTop='#03030a'; skyBottom='#0a0a1c'; }
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  grad.addColorStop(0, skyBottom); grad.addColorStop(1, skyTop);
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();

  // horizon ring + cardinal labels
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.font = '11px "JetBrains Mono", monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('N', cx, cy-R-10);
  ctx.fillText('S', cx, cy+R+10);
  ctx.fillText('E', cx-R-10, cy);
  ctx.fillText('W', cx+R+10, cy);

  liveSky._plotted = [];

  if(sunAlt < 8){
    // constellation lines
    Object.keys(SKY_CONSTELLATION_LINES).forEach(con=>{
      SKY_CONSTELLATION_LINES[con].forEach(([n1,n2])=>{
        const s1 = f.stars.find(s=>s.n===n1), s2 = f.stars.find(s=>s.n===n2);
        if(!s1||!s2||s1.alt<0||s2.alt<0) return;
        const p1 = skyProject(s1.alt,s1.az,cx,cy,R), p2 = skyProject(s2.alt,s2.az,cx,cy,R);
        ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
        ctx.strokeStyle='rgba(139,92,246,0.32)'; ctx.lineWidth=1; ctx.stroke();
      });
    });
    // stars
    f.stars.forEach(s=>{
      if(s.alt<0) return;
      const p = skyProject(s.alt,s.az,cx,cy,R);
      const rad = Math.max(0.6, 3.1 - s.m*0.55);
      ctx.beginPath(); ctx.arc(p.x,p.y,rad,0,Math.PI*2);
      ctx.fillStyle = '#fff';
      if(s.m < 1.2){ ctx.shadowColor='rgba(255,255,255,0.8)'; ctx.shadowBlur=4; }
      ctx.fill(); ctx.shadowBlur=0;
      liveSky._plotted.push({type:'star', name:s.n, meta:SKY_CONSTELLATION_NAMES[s.c]||s.c, x:p.x, y:p.y, mag:s.m});
    });
  }

  // planets
  f.planets.forEach(p=>{
    if(p.alt<0) return;
    const pos = skyProject(p.alt,p.az,cx,cy,R);
    const rad = (p.key==='venus'||p.key==='jupiter') ? 4 : 3;
    ctx.beginPath(); ctx.arc(pos.x,pos.y,rad,0,Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 6;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.font = '9.5px "Space Grotesk", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(p.label, pos.x+7, pos.y);
    liveSky._plotted.push({type:'planet', name:p.label, meta:`${p.dist.toFixed(2)} AU away`, x:pos.x, y:pos.y, key:p.key});
  });

  // Moon
  if(f.moonAlt > 0){
    const pos = skyProject(f.moonAlt, f.moonAz, cx, cy, R);
    skyDrawMoonPhase(ctx, pos.x, pos.y, 8, f.moonPhase.illum, f.moonPhase.waxing);
    ctx.font = '9.5px "Space Grotesk", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('Moon', pos.x+11, pos.y);
    liveSky._plotted.push({type:'moon', name:'The Moon', meta:`${Math.round(f.moonPhase.illum*100)}% illuminated · ${f.moonPhase.name}`, x:pos.x, y:pos.y});
  }

  // Sun (only if above horizon, shown as a soft glow)
  if(sunAlt > 0){
    const pos = skyProject(sunAlt, f.sunAz, cx, cy, R);
    const g = ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,14);
    g.addColorStop(0,'rgba(255,244,214,0.95)'); g.addColorStop(1,'rgba(255,244,214,0)');
    ctx.beginPath(); ctx.arc(pos.x,pos.y,14,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    liveSky._plotted.push({type:'sun', name:'The Sun', meta:'Daytime — stars are washed out by sunlight', x:pos.x, y:pos.y});
  }

  ctx.restore();
}

function skyDrawMoonPhase(ctx, cx, cy, r, illum, waxing){
  const dir = waxing ? 1 : -1;
  ctx.save(); ctx.translate(cx,cy);
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle='#20203a'; ctx.fill();
  ctx.beginPath();
  ctx.arc(0,0,r,-Math.PI/2,Math.PI/2, dir<0);
  const rt = r*Math.abs(1-2*illum);
  const sweep = illum<0.5 ? dir>0 : dir<0;
  ctx.ellipse(0,0,rt,r,0,Math.PI/2,-Math.PI/2, sweep);
  ctx.closePath();
  ctx.fillStyle = '#f5f0dc'; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=0.6; ctx.stroke();
  ctx.restore();
}

function skyIdentifyTap(px,py,dispW,dispH){
  if(!liveSky || !liveSky._plotted) return;
  const canvas = liveSky.canvas;
  const scaleX = (canvas.width/liveSky.dpr) / dispW, scaleY = (canvas.height/liveSky.dpr) / dispH;
  const x = px*scaleX, y = py*scaleY;
  let best = null, bestDist = 20;
  liveSky._plotted.forEach(obj=>{
    const dist = Math.hypot(obj.x-x, obj.y-y);
    if(dist < bestDist){ bestDist = dist; best = obj; }
  });
  const panel = document.getElementById('skyInfoPanel');
  if(!panel) return;
  if(!best){ panel.classList.remove('show'); return; }
  const icon = best.type==='star' ? '✦' : best.type==='planet' ? '●' : best.type==='moon' ? '🌙' : '☀️';
  panel.innerHTML = `<div class="name">${icon} ${best.name}</div><div class="meta">${best.meta}</div>`;
  panel.classList.add('show');
}

function openBlackHole(){
  openModal(`

      <label>Mass (solar masses) <span id="massVal">10</span>☉<input type="range" id="massSlider" min="1" max="1000" value="10" oninput="updateBH()"></label>
      <label>Observer distance (× Schwarzschild radius) <span id="distVal">3.0</span>×<input type="range" id="distSlider" min="11" max="500" value="30" oninput="updateBH()"></label>
    </div>
    <div class="sim-readout">
      <div class="r-box"><div class="k">EVENT HORIZON (Rs)</div><div class="v" id="rsOut">—</div></div>
      <div class="r-box"><div class="k">ESCAPE VELOCITY</div><div class="v" id="veOut">—</div></div>
      <div class="r-box"><div class="k">TIME DILATION FACTOR</div><div class="v" id="tdOut">—</div></div>
      <div class="r-box"><div class="k">STATUS</div><div class="v" id="statusOut">—</div></div>
    </div>
  `);
  initBH3D();
  updateBH();
  completeBlackHole();

function updateBH(){
  const M = parseFloat(document.getElementById('massSlider').value); // solar masses
  const distMult = parseFloat(document.getElementById('distSlider').value)/10; // ×Rs
  document.getElementById('massVal').textContent = M;
  document.getElementById('distVal').textContent = distMult.toFixed(1);

  const G = 6.674e-11, c = 3e8, Msun = 1.989e30;
  const Mkg = M*Msun;
  const Rs = 2*G*Mkg/(c*c); // meters
  const r = Rs*distMult;
  const ve = Math.sqrt(2*G*Mkg/r); // m/s
  const veFrac = ve/c;
  let dilation = distMult>1 ? 1/Math.sqrt(1-1/distMult) : Infinity;

  document.getElementById('rsOut').textContent = Rs>1000 ? (Rs/1000).toFixed(1)+' km' : Rs.toFixed(0)+' m';
  document.getElementById('veOut').textContent = (veFrac*100).toFixed(1)+'% of c';
  document.getElementById('tdOut').textContent = isFinite(dilation) ? dilation.toFixed(2)+'×' : '∞';
  document.getElementById('statusOut').textContent = distMult<=1 ? 'BEYOND HORIZON' : (veFrac>0.9 ? 'EXTREME' : (veFrac>0.3 ? 'STRONG FIELD' : 'MODERATE'));

  updateBH3D(M, distMult, veFrac);
}

/* ---- Black Hole 3D scene (Three.js) ---- */
let bh3d = null;

function makeRadialTexture(stops, size){
  size = size || 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  stops.forEach(s=>g.addColorStop(s[0], s[1]));
  ctx.fillStyle = g;
  ctx.fillRect(0,0,size,size);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
function makeDiskTexture(){
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const cx = size/2, cy = size/2;
  const g = ctx.createRadialGradient(cx,cy,size*0.16,cx,cy,size*0.5);
  g.addColorStop(0,'rgba(255,244,214,0)');
  g.addColorStop(0.06,'rgba(255,226,150,0.95)');
  g.addColorStop(0.22,'rgba(251,191,36,0.85)');
  g.addColorStop(0.5,'rgba(232,121,249,0.55)');
  g.addColorStop(0.78,'rgba(139,92,246,0.28)');
  g.addColorStop(1,'rgba(34,211,238,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,size,size);
  // subtle angular streaks for turbulence
  ctx.globalCompositeOperation = 'overlay';
  for(let i=0;i<140;i++){
    const a = Math.random()*Math.PI*2;
    const r0 = size*0.18 + Math.random()*size*0.28;
    const len = 6+Math.random()*22;
    ctx.strokeStyle = `rgba(255,255,255,${Math.random()*0.15})`;
    ctx.lineWidth = 1+Math.random()*1.5;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0);
    ctx.lineTo(cx+Math.cos(a+0.15)*(r0+len), cy+Math.sin(a+0.15)*(r0+len));
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function cleanupBH3D(){
  if(!bh3d) return;
  cancelAnimationFrame(bh3d.raf);
  window.removeEventListener('resize', bh3d.onResize);
  const wrap = bh3d.wrap;
  if(wrap){
    wrap.removeEventListener('pointerdown', bh3d.onDown);
    window.removeEventListener('pointermove', bh3d.onMove);
    window.removeEventListener('pointerup', bh3d.onUp);
  }
  bh3d.renderer && bh3d.renderer.dispose();
  bh3d = null;
}

function initBH3D(){
  cleanupBH3D();
  const wrap = document.getElementById('bhSceneWrap');
  if(!wrap || typeof THREE === 'undefined') return;
  const w = wrap.clientWidth, h = wrap.clientHeight;

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, w/h, 0.1, 100);
  camera.position.set(0, 1.7, 5.6);
  camera.lookAt(0,0,0);

  const group = new THREE.Group();
  scene.add(group);

  // starfield
  const starGeo = new THREE.BufferGeometry();
  const starCount = 320;
  const pos = new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){
    const r = 10+Math.random()*14;
    const th = Math.random()*Math.PI*2, ph = Math.random()*Math.PI;
    pos[i*3] = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.sin(ph)*Math.sin(th)*0.6;
    pos[i*3+2] = r*Math.cos(ph);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff, size:0.045, transparent:true, opacity:0.75}));
  scene.add(stars);

  // outer soft halo (gravitational glow)
  const haloTex = makeRadialTexture([[0,'rgba(139,92,246,0.55)'],[0.4,'rgba(139,92,246,0.22)'],[1,'rgba(139,92,246,0)']]);
  const haloMat = new THREE.SpriteMaterial({map:haloTex, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false});
  const halo = new THREE.Sprite(haloMat);
  halo.scale.set(3.4,3.4,1);
  group.add(halo);

  // bright photon-ring rim
  const rimTex = makeRadialTexture([[0,'rgba(255,255,255,0.95)'],[0.35,'rgba(232,121,249,0.5)'],[1,'rgba(232,121,249,0)']]);
  const rim = new THREE.Sprite(new THREE.SpriteMaterial({map:rimTex, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false}));
  rim.scale.set(1.35,1.35,1);
  group.add(rim);

  // event horizon
  const horizonGeo = new THREE.SphereGeometry(0.5, 48, 48);
  const horizonMat = new THREE.MeshBasicMaterial({color:0x000000});
  const horizon = new THREE.Mesh(horizonGeo, horizonMat);
  group.add(horizon);

  // accretion disk
  const diskTex = makeDiskTexture();
  const diskGeo = new THREE.RingGeometry(0.62, 2.7, 96, 1);
  // remap UVs radially so the gradient texture maps outward correctly
  const uvAttr = diskGeo.attributes.uv;
  const posAttr = diskGeo.attributes.position;
  for(let i=0;i<posAttr.count;i++){
    const x = posAttr.getX(i), y = posAttr.getY(i);
    const rr = Math.sqrt(x*x+y*y)/2.7;
    const ang = Math.atan2(y,x);
    uvAttr.setXY(i, 0.5+Math.cos(ang)*rr*0.5, 0.5+Math.sin(ang)*rr*0.5);
  }
  const diskMat = new THREE.MeshBasicMaterial({map:diskTex, side:THREE.DoubleSide, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false});
  const disk = new THREE.Mesh(diskGeo, diskMat);

function updateBH3D(M, distMult, veFrac){
  if(!bh3d) return;
  // mass -> visual scale of horizon/disk/halo (log scale for readability across 1-1000 solar masses)
  const massScale = 0.75 + Math.min(1, Math.log10(M)/3) * 0.7;
  bh3d.group.scale.set(massScale, massScale, massScale);

  // observer distance -> orbit radius, log scale so the full slider range stays on-screen
  const t = Math.min(1, Math.log10(Math.max(distMult,1.01)) / Math.log10(50));
  bh3d.orbitRadius = 0.95 + t * 2.9;

  // escape velocity fraction -> marker color + halo intensity
  const cCyan = new THREE.Color(0x22d3ee), cGold = new THREE.Color(0xfbbf24), cRed = new THREE.Color(0xf87171);
  let col = cCyan.clone();
  if(veFrac>0.55) col = cCyan.clone().lerp(cRed, Math.min(1,(veFrac-0.55)/0.45));
  else col = cCyan.clone().lerp(cGold, veFrac/0.55);
  bh3d.markerMat.color.copy(col);

  const haloPulse = 3.0 + veFrac*1.4;
  bh3d.halo.scale.set(haloPulse, haloPulse, 1);
}

function exoParams(){
  const Rp = parseFloat(document.getElementById('exoRpSlider').value)/10; // Earth radii
  const Rs = parseFloat(document.getElementById('exoRsSlider').value)/10; // solar radii
  const dist = parseFloat(document.getElementById('exoDistSlider').value)/10; // AU
  return {Rp, Rs, dist};
}

function updateExo(){
  const {Rp, Rs, dist} = exoParams();
  document.getElementById('exoRpVal').textContent = Rp.toFixed(1);
  document.getElementById('exoRsVal').textContent = Rs.toFixed(1);
  document.getElementById('exoDistVal').textContent = dist.toFixed(1);

  const Rearth_km = 6371, Rsun_km = 696000, AU_km = 1.496e8;
  const RpKm = Rp*Rearth_km, RsKm = Rs*Rsun_km;
  const depthFrac = Math.pow(RpKm/RsKm, 2);
  const aKm = dist*AU_km;
  const Mstar = Rs; // rough main-sequence approximation
  const periodYears = Math.sqrt(Math.pow(dist,3)/Math.max(Mstar,0.05));
  const periodDays = periodYears*365.25;

  let cls = 'Rocky / Earth-like';
  if(Rp>=2 && Rp<6) cls='Neptune-like';
  else if(Rp>=6) cls='Gas Giant';
  else if(Rp>=1.25) cls='Super-Earth';

  const hzInner = 0.95*Rs, hzOuter = 1.4*Rs;
  const inHz = dist>=hzInner && dist<=hzOuter;

  document.getElementById('exoDepthOut').textContent = (depthFrac*100).toFixed(3)+'%';
  document.getElementById('exoPeriodOut').textContent = periodDays<1 ? (periodDays*24).toFixed(1)+' hrs' : periodDays.toFixed(1)+' days';
  document.getElementById('exoClassOut').textContent = cls;
  document.getElementById('exoHzOut').textContent = inHz ? 'IN ZONE ✓' : (dist<hzInner ? 'TOO HOT' : 'TOO COLD');

  if(exoChart){
    exoChart.depthFrac = depthFrac;
    exoChart.transitFraction = Math.min(0.28, Math.max(0.02, (2*RsKm)/(Math.PI*aKm)));
  }
  if(exo3d){
    const massScale = 0.6 + Math.min(1, Math.log10(Math.max(Rs,0.4)+1)) * 0.9;
    exo3d.star.scale.set(massScale, massScale, massScale);
    exo3d.halo.scale.set(2.6*massScale, 2.6*massScale, 1);
    const planetScale = 0.35 + Math.min(1.6, Math.log10(Rp+1)*1.1);
    exo3d.planet.scale.set(planetScale, planetScale, planetScale);
    const vis = planetVisual(cls);
    exo3d.planetMat.color.setHex(vis.color);
    exo3d.orbitRadius = 1.5 + Math.min(1, Math.log10(dist+1)/Math.log10(4)) * 2.2;
    exo3d.orbitRing.scale.set(exo3d.orbitRadius/1.8, exo3d.orbitRadius/1.8, 1);
    exo3d.tiltX = inHz ? 0.05 : 0.09;
  }
}

function drawExoChart(){
  if(!exoChart) return;
  const {ctx, canvas, dpr} = exoChart;
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.save();
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const depthFrac = exoChart.depthFrac || 0.01;
  const transitFraction = exoChart.transitFraction || 0.08;
  exoChart.phase = (exoChart.phase + 0.0032) % 1;
  const phase = exoChart.phase;

  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.beginPath(); ctx.moveTo(0, h*0.5); ctx.lineTo(w, h*0.5); ctx.stroke();

  const brightness = brightnessAtPhase(phase, transitFraction, depthFrac);
  exoChart.history.push(brightness);
  if(exoChart.history.length > 240) exoChart.history.shift();

  ctx.beginPath();
  const amp = h*0.34;
  exoChart.history.forEach((b,idx)=>{
    const x = w - (exoChart.history.length-idx)*(w/240);
    const y = h*0.5 - (b-1)*amp*40;
    if(idx===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = '#22d3ee';
  ctx.lineWidth = 1.6;
  ctx.shadowColor = '#22d3ee';
  ctx.shadowBlur = 6;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();
}
function brightnessAtPhase(phase, transitFraction, depthFrac){
  const centered = phase<0.5 ? phase : phase-1;
  const distFromCenter = Math.abs(centered);
  if(distFromCenter < transitFraction/2){
    const x = distFromCenter/(transitFraction/2);
    const dip = depthFrac*40*(0.5*(1+Math.cos(x*Math.PI)));
    return 1-Math.min(dip,0.9);
  }
  return 1;
}

}

function makeAsteroidGeometry(){
  const geo = new THREE.IcosahedronGeometry(1, 1);

  for(let i=0;i<posAttr.count;i++){
    const v = new THREE.Vector3(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
    const n = v.clone().normalize();
    const bump = 0.78 + Math.random()*0.32;
    v.copy(n.multiplyScalar(bump));
    posAttr.setXYZ(i, v.x, v.y, v.z);

  geo.computeVertexNormals();

}

  // impact marker (small ring on surface, becomes visible after impact)
  const markerGeo = new THREE.RingGeometry(0.08,0.14,24);
  const markerMat = new THREE.MeshBasicMaterial({color:0xf87171, transparent:true, opacity:0, side:THREE.DoubleSide});
  const marker = new THREE.Mesh(markerGeo, markerMat);
  marker.position.set(0.75, 0.55, 0.65);
  marker.lookAt(marker.position.clone().multiplyScalar(2));
  earthGroup.add(marker);

  // impact flash
  const flashTex = makeRadialTexture([[0,'rgba(255,244,214,1)'],[0.4,'rgba(251,191,36,0.7)'],[1,'rgba(251,191,36,0)']]);
  const flash = new THREE.Sprite(new THREE.SpriteMaterial({map:flashTex, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false, opacity:0}));
  flash.position.copy(marker.position);
  flash.scale.set(0.1,0.1,1);
  earthGroup.add(flash);

  // asteroid
  const asteroidGeo = makeAsteroidGeometry();
  const asteroidMat = new THREE.MeshStandardMaterial({color:AST_COLOR3D.rocky, roughness:0.95, metalness:0.15, flatShading:true});
  const asteroid = new THREE.Mesh(asteroidGeo, asteroidMat);
  group.add(asteroid);

  const startPos = new THREE.Vector3(3.6, 2.4, 1.6);
  const endPos = earthGroup.position.clone().add(marker.position.clone().multiplyScalar(1.02));

  ast3d = {
    renderer, scene, camera, group, earthGroup, earth, asteroid, asteroidMat, flash, marker, markerMat,
    startPos, endPos, wrap, t:0, speed:0.006, size:0.18,
    dragging:false, lastX:0, raf:null
  };

  ast3d.onResize = ()=>{
    const nw = wrap.clientWidth, nh = wrap.clientHeight;
    camera.aspect = nw/nh; camera.updateProjectionMatrix();
    renderer.setSize(nw,nh);
  };
  window.addEventListener('resize', ast3d.onResize);

  ast3d.onDown = (e)=>{ ast3d.dragging=true; ast3d.lastX=e.clientX; wrap.style.cursor='grabbing'; };
  ast3d.onMove = (e)=>{ if(!ast3d.dragging) return; const dx=e.clientX-ast3d.lastX; ast3d.lastX=e.clientX; group.rotation.y += dx*0.006; };
  ast3d.onUp = ()=>{ ast3d.dragging=false; wrap.style.cursor='grab'; };
  wrap.addEventListener('pointerdown', ast3d.onDown);
  window.addEventListener('pointermove', ast3d.onMove);
  window.addEventListener('pointerup', ast3d.onUp);

  function animate(){
    ast3d.raf = requestAnimationFrame(animate);
    earth.rotation.y += 0.0025;
    asteroid.rotation.x += 0.012;
    asteroid.rotation.y += 0.017;

    ast3d.t = (ast3d.t + ast3d.speed) % 1;
    const travel = Math.min(ast3d.t/0.78, 1);
    asteroid.position.lerpVectors(ast3d.startPos, ast3d.endPos, travel);
    asteroid.scale.setScalar(ast3d.size);

    if(ast3d.t < 0.78){
      asteroid.visible = true;
      ast3d.markerMat.opacity = 0;
      ast3d.flash.material.opacity = 0;
    } else {
      asteroid.visible = false;
      const fp = (ast3d.t-0.78)/0.22;
      ast3d.markerMat.opacity = Math.min(0.9, fp*2)*(1-fp*0.4);
      ast3d.flash.material.opacity = Math.max(0, 1-fp*2.2);
      ast3d.flash.scale.set(0.15+fp*1.6, 0.15+fp*1.6, 1);
    }

    if(!ast3d.dragging) group.rotation.y += 0.0016;
    renderer.render(scene, camera);
  }
  animate();
}

function updateAst(){
  const diam = parseFloat(document.getElementById('astDiamSlider').value); // meters
  const vel = parseFloat(document.getElementById('astVelSlider').value); // km/s
  const comp = document.getElementById('astCompSelect').value;
  document.getElementById('astDiamVal').textContent = diam;
  document.getElementById('astVelVal').textContent = vel;

  const density = {icy:1000, rocky:3000, iron:8000}[comp];
  const radius = diam/2;
  const volume = (4/3)*Math.PI*Math.pow(radius,3);
  const mass = density*volume; // kg
  const velMs = vel*1000;
  const energyJ = 0.5*mass*velMs*velMs;
  const energyMT = energyJ/4.184e15;
  const craterKm = 0.9*Math.pow(Math.max(energyMT,1e-6),0.3);

  let compareText, tier;
  if(energyMT < 0.001){ compareText='Small fireball, similar to a bright meteor'; tier='MINIMAL'; }
  else if(energyMT < 15/1000){ compareText='~Hiroshima-scale atomic bomb'; tier='LOCAL DAMAGE'; }
  else if(energyMT < 100){ compareText='~Tunguska-scale airburst (1908)'; tier='REGIONAL DEVASTATION'; }
  else if(energyMT < 1e5){ compareText='Far beyond any historical impact on record'; tier='CONTINENTAL CATASTROPHE'; }
  else { compareText='~Chicxulub impactor (dinosaur extinction event)'; tier='GLOBAL MASS EXTINCTION'; }

  document.getElementById('astEnergyOut').textContent = energyMT<0.001 ? (energyMT*1e6).toFixed(1)+' tons TNT' : (energyMT>=1000 ? energyMT.toExponential(2)+' MT' : energyMT.toFixed(2)+' MT');
  document.getElementById('astCraterOut').textContent = craterKm<1 ? Math.round(craterKm*1000)+' m' : craterKm.toFixed(1)+' km';
  document.getElementById('astCompareOut').textContent = compareText;
  document.getElementById('astTierOut').textContent = tier;

  if(ast3d){
    ast3d.asteroidMat.color.setHex(AST_COLOR3D[comp]);
    ast3d.size = Math.max(0.09, Math.min(0.5, 0.09 + diam/2400));
    ast3d.speed = 0.0035 + (vel/72)*0.011;
  }
}

function starStagesFor(mass){
  const isMassive8 = mass >= 8;
  const isMassive20 = mass >= 20;
  const stages = [
    {name:'Protostar', desc:'A dense clump inside a nebula collapses under gravity, heating up as it contracts toward ignition.', scale:0.35, color:0xd97706, halo:0.5, haloColor:'rgba(217,119,6,0.4)'},
    {name:'Main Sequence', desc:`At ${mass.toFixed(1)} solar masses, fusion has ignited and stabilized — this is the long, steady adulthood of the star's life.`, scale:Math.min(2.2,0.5+Math.log10(mass+1)*0.9), color: mass<0.6?0xffb35c : mass<1.5?0xfff2cc : mass<8?0xdbeafe:0x93c5fd, halo:0.9, haloColor:'rgba(251,191,36,0.4)'}
  ];
  if(isMassive8){
    stages.push({name:'Red / Blue Supergiant', desc:'Core fuel dwindles and the star swells to an enormous supergiant, fusing progressively heavier elements in its core.', scale:3.2, color:0xef4444, halo:1.6, haloColor:'rgba(239,68,68,0.4)'});
    stages.push({name:'Supernova', desc:'The core collapses catastrophically and rebounds in a titanic explosion, briefly outshining its entire galaxy.', scale:4.2, color:0xffffff, halo:3.2, haloColor:'rgba(255,244,214,0.9)', flash:true});
    if(isMassive20){
      stages.push({name:'Black Hole', desc:'The crushed remnant is so massive that its gravity overwhelms everything — not even light can escape past its event horizon.', scale:0.28, color:0x000000, halo:1.1, haloColor:'rgba(139,92,246,0.55)', isBH:true});
    } else {
      stages.push({name:'Neutron Star', desc:'What remains is an ultra-dense neutron star — often spinning rapidly as a pulsar, sweeping beams of radiation through space.', scale:0.22, color:0x93c5fd, halo:0.6, haloColor:'rgba(147,197,253,0.6)'});
    }
  } else {
    stages.push({name:'Red Giant', desc:'Running low on core hydrogen, the star swells dramatically, its outer layers cooling to a deep red-orange glow.', scale:2.6, color:0xf97316, halo:1.3, haloColor:'rgba(249,115,22,0.4)'});
    stages.push({name:'Planetary Nebula', desc:'The star gently sheds its outer layers into space, forming a glowing shell of gas around its exposed core.', scale:2.2, color:0x67e8f9, halo:2.6, haloColor:'rgba(103,232,249,0.35)', shell:true});
    stages.push({name:'White Dwarf', desc:'What remains is a small, extremely dense, slowly cooling stellar core — roughly Earth-sized but packing as much mass as a star.', scale:0.24, color:0xffffff, halo:0.7, haloColor:'rgba(255,255,255,0.6)'});
  }
  return stages;
}
function starLifespanGyr(mass){ return 10/Math.pow(Math.max(mass,0.08), 2.5); }

function updateTime(){
  const v = parseFloat(document.getElementById('timeDistSlider').value)/1000; // 0..1
  const minExp = 1, maxExp = 10.14; // 10 ly .. ~13.8 billion ly
  const exp = minExp + v*(maxExp-minExp);
  const ly = Math.pow(10, exp);

  let lyText;
  if(ly < 1e3) lyText = Math.round(ly)+' ly';
  else if(ly < 1e6) lyText = (ly/1e3).toFixed(1)+' thousand ly';
  else if(ly < 1e9) lyText = (ly/1e6).toFixed(1)+' million ly';
  else lyText = (ly/1e9).toFixed(2)+' billion ly';
  document.getElementById('timeDistVal').textContent = lyText;
  document.getElementById('timeLookbackOut').textContent = lyText + ' ago';

  let era, desc;
  if(ly < 1e3){ era='The present, essentially'; desc="At this distance, light arrives so quickly that you're seeing nearby stars almost as they are right now."; }
  else if(ly < 1e5){ era='Recent galactic history'; desc="You're now looking at light that left its source before recorded human history began."; }
  else if(ly < 2e6){ era='Beyond the Milky Way'; desc="You've reached the edge of our galaxy and are looking toward our galactic neighbors, like Andromeda."; }
  else if(ly < 1e9){ era='Distant galaxies'; desc='This light left its galaxy while the Earth still looked very different — hundreds of millions to a billion years ago.'; }
  else if(ly < 1.3e10){ era='The early universe'; desc="You're now seeing galaxies as they were when the universe was young and still actively forming its first structures."; }
  else { era='Near the Big Bang'; desc="You've reached the edge of the observable universe — close to the Cosmic Microwave Background, the afterglow of the Big Bang itself."; }
  document.getElementById('timeEraOut').textContent = era;
  document.getElementById('timeEraDesc').innerHTML = desc;

  if(time3d){ time3d.targetZ = v*44; }
}

function initDM3D(){
  cleanupDM3D();
  const wrap = document.getElementById('dm3DWrap');
  if(!wrap || typeof THREE === 'undefined') return;
  const w = wrap.clientWidth, h = wrap.clientHeight;

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, w/h, 0.1, 100);
  camera.position.set(0,2.6,3.4);
  camera.lookAt(0,0,0);

  const group = new THREE.Group();
  scene.add(group);

  const starGeo = new THREE.BufferGeometry();
  const starCount = 160;
  const spos = new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){ const r=6+Math.random()*8; const th=Math.random()*Math.PI*2, ph=Math.random()*Math.PI; spos[i*3]=r*Math.sin(ph)*Math.cos(th); spos[i*3+1]=r*Math.sin(ph)*Math.sin(th)*0.6; spos[i*3+2]=r*Math.cos(ph); }
  starGeo.setAttribute('position', new THREE.BufferAttribute(spos,3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff,size:0.03,transparent:true,opacity:0.55})));

  // spiral galaxy disk (particle spiral)
  const armCount = 3, starsPerArm = 220;
  const galGeo = new THREE.BufferGeometry();
  const galPos = new Float32Array(armCount*starsPerArm*3);
  const galCol = new Float32Array(armCount*starsPerArm*3);
  let idx=0;
  for(let a=0;a<armCount;a++){
    const offset = (a/armCount)*Math.PI*2;
    for(let i=0;i<starsPerArm;i++){
      const t = i/starsPerArm;
      const r = 0.2 + t*2.2;
      const ang = offset + t*4.2 + (Math.random()-0.5)*0.3;
      const x = Math.cos(ang)*r + (Math.random()-0.5)*0.15;
      const z = Math.sin(ang)*r + (Math.random()-0.5)*0.15;
      const y = (Math.random()-0.5)*0.05*(1-t*0.5);
      galPos[idx*3]=x; galPos[idx*3+1]=y; galPos[idx*3+2]=z;
      const core = 1-t;
      galCol[idx*3]=0.6+core*0.4; galCol[idx*3+1]=0.55+core*0.3; galCol[idx*3+2]=0.9;
      idx++;
    }
  }
  galGeo.setAttribute('position', new THREE.BufferAttribute(galPos,3));
  galGeo.setAttribute('color', new THREE.BufferAttribute(galCol,3));
  const galMat = new THREE.PointsMaterial({size:0.045, vertexColors:true, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false});
  const galaxy = new THREE.Points(galGeo, galMat);
  group.add(galaxy);

  const bulgeTex = makeRadialTexture([[0,'rgba(255,244,214,0.95)'],[0.5,'rgba(251,191,36,0.4)'],[1,'rgba(251,191,36,0)']]);
  const bulge = new THREE.Sprite(new THREE.SpriteMaterial({map:bulgeTex, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false}));
  bulge.scale.set(0.9,0.9,1);
  group.add(bulge);

  // dark matter halo (translucent sphere, wireframe-ish)
  const haloGeo = new THREE.SphereGeometry(1, 24, 16);
  const haloMat = new THREE.MeshBasicMaterial({color:0x8b5cf6, transparent:true, opacity:0.08, wireframe:true});
  const halo = new THREE.Mesh(haloGeo, haloMat);
  group.add(halo);

  // orbit test markers at 3 radii
  const radii = [0.5, 1.3, 2.3];
  const markers = radii.map((r,i)=>{
    const geo = new THREE.SphereGeometry(0.045, 12, 12);
    const mat = new THREE.MeshBasicMaterial({color:0x22d3ee});
    const m = new THREE.Mesh(geo, mat);
    m.userData = {radius:r, angle: Math.random()*Math.PI*2};
    group.add(m);
    return m;
  });

  dm3d = {renderer, scene, camera, group, galaxy, halo, haloMat, markers, wrap, frac:0.5, dragging:false, lastX:0, raf:null};

  dm3d.onResize = ()=>{ const nw=wrap.clientWidth, nh=wrap.clientHeight; camera.aspect=nw/nh; camera.updateProjectionMatrix(); renderer.setSize(nw,nh); };
  window.addEventListener('resize', dm3d.onResize);
  dm3d.onDown = (e)=>{ dm3d.dragging=true; dm3d.lastX=e.clientX; wrap.style.cursor='grabbing'; };
  dm3d.onMove = (e)=>{ if(!dm3d.dragging) return; const dx=e.clientX-dm3d.lastX; dm3d.lastX=e.clientX; group.rotation.y += dx*0.006; };
  dm3d.onUp = ()=>{ dm3d.dragging=false; wrap.style.cursor='grab'; };
  wrap.addEventListener('pointerdown', dm3d.onDown);
  window.addEventListener('pointermove', dm3d.onMove);
  window.addEventListener('pointerup', dm3d.onUp);

  function animate(){
    dm3d.raf = requestAnimationFrame(animate);
    const frac = dm3d.frac;
    markers.forEach(m=>{
      const r = m.userData.radius;
      // Keplerian-ish decline blended toward flat based on dark matter fraction
      const keplerSpeed = 0.9/Math.sqrt(r);
      const flatSpeed = 0.55;
      const speed = keplerSpeed*(1-frac) + flatSpeed*frac;
      m.userData.angle += speed*0.02;
      m.position.set(Math.cos(m.userData.angle)*r, 0.02, Math.sin(m.userData.angle)*r);
    });
    if(!dm3d.dragging) group.rotation.y += 0.0015;
    renderer.render(scene, camera);
  }
  animate();
}
function initDMChart(){
  cleanupDMChart();
  const wrap = document.getElementById('dmChartWrap');
  if(!wrap) return;
  const canvas = document.createElement('canvas');
  wrap.appendChild(canvas);
  const dpr = Math.min(window.devicePixelRatio,2);
  function resize(){ const w=wrap.clientWidth,h=wrap.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
  resize();
  const ctx = canvas.getContext('2d');
  dmChart = {canvas, ctx, wrap, dpr, raf:null};
  dmChart.onResize = resize;
  window.addEventListener('resize', dmChart.onResize);
  function frame(){ dmChart.raf = requestAnimationFrame(frame); drawDMChart(); }

}
function drawDMChart(){
  if(!dmChart) return;
  const {ctx, canvas, dpr} = dmChart;
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.save(); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  const frac = dmChart.frac !== undefined ? dmChart.frac : 0.5;
  const pad = 14;
  const plotW = w-pad*2, plotH = h-pad*2;

  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, h-pad); ctx.lineTo(w-pad, h-pad); ctx.stroke();

  function plotCurve(fn, color){
    ctx.beginPath();
    for(let i=0;i<=60;i++){
      const x = i/60;
      const y = fn(x);
      const px = pad + x*plotW;
      const py = (h-pad) - y*plotH;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.strokeStyle = color; ctx.lineWidth=1.8; ctx.shadowColor=color; ctx.shadowBlur=5; ctx.stroke(); ctx.shadowBlur=0;
  }
  plotCurve(x=>{ const r=Math.max(x,0.08); return Math.min(1, (0.35/Math.sqrt(r))*0.9); }, 'rgba(34,211,238,0.85)');
  plotCurve(x=>{
    const r=Math.max(x,0.08);
    const kepler = Math.min(1,(0.35/Math.sqrt(r))*0.9);
    const flat = 0.72;
    return kepler*(1-frac) + flat*frac;
  }, 'rgba(232,121,249,0.9)');
  ctx.restore();
}
function updateDM(){
  const frac = parseFloat(document.getElementById('dmFracSlider').value)/100;
  document.getElementById('dmFracVal').textContent = Math.round(frac*100)+'%';
  const speed = (0.9*(1-frac) + 2.1*frac);
  document.getElementById('dmSpeedOut').textContent = speed.toFixed(2)+'× predicted';
  document.getElementById('dmShapeOut').textContent = frac>0.66 ? 'FLAT (dark matter dominant)' : frac>0.3 ? 'PARTIALLY FLATTENED' : 'DECLINING (Keplerian)';
  if(dm3d){ dm3d.frac = frac; dm3d.haloMat.opacity = 0.03 + frac*0.16; dm3d.halo.scale.setScalar(1.6+frac*1.3); }
  if(dmChart){ dmChart.frac = frac; }
}

function gsConfigForLevel(level){
  const planets = [
    {fx:0.55, fy:0.45, r:24, mass:5200, color:'#f97316', glow:'rgba(249,115,22,0.5)'},
    {fx:0.82, fy:0.2, r:13, mass:1700, color:'#38bdf8', glow:'rgba(56,189,248,0.5)'}
  ];

  if(level>=4) planets.push({fx:0.66, fy:0.72, r:11, mass:1300, color:'#34d399', glow:'rgba(52,211,153,0.5)'});
  if(level>=6) planets.push({fx:0.2, fy:0.3, r:9, mass:900, color:'#f87171', glow:'rgba(248,113,113,0.5)'});
  const targetRadius = Math.max(9, 18 - Math.floor((level-1)/2));
  const startFuel = Math.max(1, 4 - Math.floor((level-1)/2));
  return {
    planets,
    shipStart:{fx:0.08, fy:0.78},

  };

  gravSling = {

  };

  gravSling.onResize = resize;

function gsRefreshAim(){
  document.getElementById('gsAngleVal').textContent = document.getElementById('gsAngleSlider').value;
  document.getElementById('gsPowerVal').textContent = document.getElementById('gsPowerSlider').value;

function gsLaunch(){
  if(!gravSling) return;
  const w = gravSling.canvas.width/gravSling.dpr, h = gravSling.canvas.height/gravSling.dpr;
  const angle = parseFloat(document.getElementById('gsAngleSlider').value) * Math.PI/180;
  const power = parseFloat(document.getElementById('gsPowerSlider').value);
  gravSling.pos = {x: gravSling.shipStart.fx*w, y: gravSling.shipStart.fy*h};
  gravSling.vel = {x: Math.cos(angle)*power*0.55, y: Math.sin(angle)*power*0.55};
  gravSling.fuel = gravSling.startFuel;
  gravSling.trail = [];
  gravSling.phase = 'flight';
  document.getElementById('gsFuelOut').textContent = gravSling.fuel;
  document.getElementById('gsStatusOut').textContent = 'IN FLIGHT';
  document.getElementById('gsMsg').textContent = 'Flying free — boost if you need to escape a bad trajectory.';
  document.getElementById('gsLaunchBtn').disabled = true;
  document.getElementById('gsBoostBtn').disabled = false;
}
function gsBoost(){
  if(!gravSling || gravSling.phase!=='flight' || gravSling.fuel<=0) return;
  const v = gravSling.vel;
  const mag = Math.hypot(v.x,v.y) || 1;
  const boost = 1.5;
  gravSling.vel.x += (v.x/mag)*boost;
  gravSling.vel.y += (v.y/mag)*boost;
  gravSling.fuel--;
  document.getElementById('gsFuelOut').textContent = gravSling.fuel;
  if(gravSling.fuel<=0) document.getElementById('gsBoostBtn').disabled = true;
}
function gsReset(){
  if(!gravSling) return;
  gravSling.phase = 'idle';
  gravSling.trail = [];
  document.getElementById('gsLaunchBtn').disabled = false;
  document.getElementById('gsBoostBtn').disabled = true;
  document.getElementById('gsStatusOut').textContent = 'READY';
  document.getElementById('gsFuelOut').textContent = String(gravSling.startFuel);
  document.getElementById('gsMsg').textContent = 'Aim with the sliders, launch, then spend limited boosts to swing past planets and reach the glowing target ring.';
}
function gsPhysicsStep(){
  const w = gravSling.canvas.width/gravSling.dpr, h = gravSling.canvas.height/gravSling.dpr;
  const G = 0.85;
  const subSteps = 3, subDt = 0.55;
  for(let s=0;s<subSteps;s++){
    let ax=0, ay=0;
    gravSling.planets.forEach(p=>{
      const px = p.fx*w, py = p.fy*h;
      const dx = px-gravSling.pos.x, dy = py-gravSling.pos.y;
      const distSq = Math.max(dx*dx+dy*dy, 120);
      const dist = Math.sqrt(distSq);
      const force = G*p.mass/distSq;
      ax += force*(dx/dist);
      ay += force*(dy/dist);
    });
    gravSling.vel.x += ax*subDt*0.01;
    gravSling.vel.y += ay*subDt*0.01;
    gravSling.pos.x += gravSling.vel.x*subDt;
    gravSling.pos.y += gravSling.vel.y*subDt;
  }
  gravSling.trail.push({x:gravSling.pos.x, y:gravSling.pos.y});
  if(gravSling.trail.length>60) gravSling.trail.shift();

  for(const p of gravSling.planets){
    const px=p.fx*w, py=p.fy*h;
    const d = Math.hypot(px-gravSling.pos.x, py-gravSling.pos.y);
    if(d < p.r+5){ gsFinish('crashed'); return; }
  }
  const tx = gravSling.target.fx*w, ty = gravSling.target.fy*h;
  if(Math.hypot(tx-gravSling.pos.x, ty-gravSling.pos.y) < gravSling.target.r){ gsFinish('won'); return; }
  if(gravSling.pos.x<-40||gravSling.pos.x>w+40||gravSling.pos.y<-40||gravSling.pos.y>h+40){ gsFinish('lost'); return; }
}
function gsFinish(result){
  gravSling.phase = result;
  document.getElementById('gsLaunchBtn').disabled = false;
  document.getElementById('gsBoostBtn').disabled = true;
  if(result==='won'){
    const clearedLevel = gameLevel('gravitysling');
    const nextLevel = bumpGameLevel('gravitysling');
    document.getElementById('gsStatusOut').textContent = 'TARGET REACHED 🎯';
    document.getElementById('gsMsg').innerHTML = `Nailed it! You reached the target with ${gravSling.fuel} boost${gravSling.fuel===1?'':'s'} left. Reopen this game for Level ${nextLevel} — tighter target, less fuel, maybe another planet in the way.`;
    if(!state.gamesCompleted.includes('gravitysling')){
      state.gamesCompleted.push('gravitysling'); saveState();
      checkBadges();
    }
    addXP(50 + gravSling.fuel*12 + clearedLevel*6, `Gravity Sling · Level ${clearedLevel} cleared`);
  } else if(result==='crashed'){
    document.getElementById('gsStatusOut').textContent = 'CRASHED 💥';
    document.getElementById('gsMsg').textContent = 'You crashed into a planet. Adjust your angle or power and try again.';
  } else {
    document.getElementById('gsStatusOut').textContent = 'LOST IN SPACE 🌌';
    document.getElementById('gsMsg').textContent = 'Your ship drifted off into space. Try a different trajectory.';
  }
}
function gsDraw(){
  if(!gravSling) return;
  const {ctx, canvas, dpr} = gravSling;
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.save(); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  gravSling.starDots.forEach(s=>{ ctx.globalAlpha=0.5; ctx.beginPath(); ctx.arc(s.x*w, s.y*h, s.r, 0, Math.PI*2); ctx.fill(); });
  ctx.globalAlpha = 1;

  gravSling.planets.forEach(p=>{
    const px=p.fx*w, py=p.fy*h;
    const g = ctx.createRadialGradient(px,py,0,px,py,p.r*2.2);
    g.addColorStop(0,p.glow); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(px,py,p.r*2.2,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    ctx.beginPath(); ctx.arc(px,py,p.r,0,Math.PI*2); ctx.fillStyle=p.color; ctx.fill();
  });

  const tx = gravSling.target.fx*w, ty = gravSling.target.fy*h;
  const pulse = 1+Math.sin(Date.now()*0.004)*0.12;
  ctx.beginPath();
  ctx.arc(tx,ty,gravSling.target.r*pulse,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(52,211,153,0.9)';
  ctx.lineWidth = 2;
  ctx.setLineDash([4,4]);
  ctx.stroke();
  ctx.setLineDash([]);

  if(gravSling.phase==='idle'){
    const sx = gravSling.shipStart.fx*w, sy = gravSling.shipStart.fy*h;
    const angle = parseFloat(document.getElementById('gsAngleSlider')?.value||45) * Math.PI/180;
    const power = parseFloat(document.getElementById('gsPowerSlider')?.value||5);
    ctx.beginPath(); ctx.arc(sx,sy,5,0,Math.PI*2); ctx.fillStyle='#e9e7f7'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx,sy);
    ctx.lineTo(sx+Math.cos(angle)*power*6, sy+Math.sin(angle)*power*6);
    ctx.strokeStyle = 'rgba(34,211,238,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();
  } else {
    ctx.beginPath();
    gravSling.trail.forEach((t,i)=>{ if(i===0) ctx.moveTo(t.x,t.y); else ctx.lineTo(t.x,t.y); });
    ctx.strokeStyle = 'rgba(34,211,238,0.5)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    if(gravSling.phase==='flight' || gravSling.phase==='won'){
      ctx.beginPath(); ctx.arc(gravSling.pos.x, gravSling.pos.y, 5, 0, Math.PI*2);
      ctx.fillStyle = gravSling.phase==='won' ? '#34d399' : '#e9e7f7';
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
      ctx.fill(); ctx.shadowBlur=0;
    }
    if(gravSling.phase==='crashed'){
      ctx.beginPath(); ctx.arc(gravSling.pos.x, gravSling.pos.y, 12, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(248,113,113,0.7)'; ctx.fill();
    }
  }
  ctx.restore();
}

const FORGE_TIERS = [

function forgeTierFor(mass){ return FORGE_TIERS.find(t=>mass<t.maxMass) || FORGE_TIERS[FORGE_TIERS.length-1]; }

function forgeStar(){

function initForge3D(){
  cleanupForge3D();
  const wrap = document.getElementById('forge3DWrap');
  if(!wrap || typeof THREE === 'undefined') return;
  const w = wrap.clientWidth, h = wrap.clientHeight;

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, w/h, 0.1, 100);
  camera.position.set(0,0.3,5.4);
  camera.lookAt(0,0,0);

  const group = new THREE.Group();
  scene.add(group);

  const starGeo = new THREE.BufferGeometry();
  const starCount = 180;
  const spos = new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){ const r=8+Math.random()*10; const th=Math.random()*Math.PI*2, ph=Math.random()*Math.PI; spos[i*3]=r*Math.sin(ph)*Math.cos(th); spos[i*3+1]=r*Math.sin(ph)*Math.sin(th)*0.6; spos[i*3+2]=r*Math.cos(ph); }
  starGeo.setAttribute('position', new THREE.BufferAttribute(spos,3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff,size:0.03,transparent:true,opacity:0.55})));

  // nebula cloud particles (the raw material to forge from)
  const nebCount = 260;
  const nebGeo = new THREE.BufferGeometry();
  const nebPos = new Float32Array(nebCount*3);
  const nebHome = [];
  for(let i=0;i<nebCount;i++){
    const r = 1.4+Math.random()*1.6;
    const th = Math.random()*Math.PI*2, ph = Math.random()*Math.PI;
    const x=r*Math.sin(ph)*Math.cos(th), y=r*Math.sin(ph)*Math.sin(th), z=r*Math.cos(ph);
    nebPos[i*3]=x; nebPos[i*3+1]=y; nebPos[i*3+2]=z;
    nebHome.push({x,y,z});
  }
  nebGeo.setAttribute('position', new THREE.BufferAttribute(nebPos,3));
  const nebMat = new THREE.PointsMaterial({color:0x8b5cf6, size:0.05, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false});
  const nebula = new THREE.Points(nebGeo, nebMat);
  group.add(nebula);

  const haloTex = makeRadialTexture([[0,'rgba(251,191,36,0.8)'],[0.5,'rgba(251,191,36,0.3)'],[1,'rgba(251,191,36,0)']]);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false}));
  halo.scale.set(0.1,0.1,1);
  group.add(halo);

  const bodyGeo = new THREE.SphereGeometry(0.6, 32, 32);
  const bodyMat = new THREE.MeshBasicMaterial({color:0xfff2cc, transparent:true, opacity:0});
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.scale.setScalar(0.001);
  group.add(body);

  const ambient = new THREE.AmbientLight(0x40405a, 1);
  scene.add(ambient);

  forge3d = {
    renderer, scene, camera, group, nebula, nebGeo, nebHome, halo, body, bodyMat, wrap,
    phase:'idle', collapseT:0, previewColor:0xfff2cc, previewScale:0.7, pendingColor:0xfff2cc, pendingScale:0.7,
    curScale:0.001, curColor: new THREE.Color(0xfff2cc), dragging:false, lastX:0, raf:null
  };
  forge3d.onResize = ()=>{ const nw=wrap.clientWidth, nh=wrap.clientHeight; camera.aspect=nw/nh; camera.updateProjectionMatrix(); renderer.setSize(nw,nh); };
  window.addEventListener('resize', forge3d.onResize);
  forge3d.onDown = (e)=>{ forge3d.dragging=true; forge3d.lastX=e.clientX; wrap.style.cursor='grabbing'; };
  forge3d.onMove = (e)=>{ if(!forge3d.dragging) return; const dx=e.clientX-forge3d.lastX; forge3d.lastX=e.clientX; group.rotation.y += dx*0.006; };
  forge3d.onUp = ()=>{ forge3d.dragging=false; wrap.style.cursor='grab'; };
  wrap.addEventListener('pointerdown', forge3d.onDown);
  window.addEventListener('pointermove', forge3d.onMove);
  window.addEventListener('pointerup', forge3d.onUp);

  function animate(){
    forge3d.raf = requestAnimationFrame(animate);
    const posAttr = forge3d.nebGeo.attributes.position;

    if(forge3d.phase === 'collapsing'){
      forge3d.collapseT += 0.018;
      const t = Math.min(1, forge3d.collapseT);
      for(let i=0;i<nebHome.length;i++){
        const home = nebHome[i];
        posAttr.setXYZ(i, home.x*(1-t), home.y*(1-t), home.z*(1-t));
      }
      posAttr.needsUpdate = true;
      nebMat.opacity = 0.55*(1-t);
      forge3d.curScale += (forge3d.pendingScale*t - forge3d.curScale)*0.15;
      forge3d.curColor.lerp(new THREE.Color(forge3d.pendingColor), 0.12);
      body.material.opacity = t;
      body.scale.setScalar(Math.max(0.001, forge3d.curScale));
      halo.scale.set(Math.max(0.1, forge3d.curScale*3), Math.max(0.1, forge3d.curScale*3), 1);
      if(t>=1){
        forge3d.phase = 'formed';
        forge3d.previewColor = forge3d.pendingColor;
        forge3d.previewScale = forge3d.pendingScale;
      }
    } else if(forge3d.phase === 'formed' || forge3d.phase === 'idle'){
      const targetScale = forge3d.previewScale;
      forge3d.curScale += (targetScale - forge3d.curScale)*0.08;
      forge3d.curColor.lerp(new THREE.Color(forge3d.previewColor), 0.08);
      body.material.opacity += (1-body.material.opacity)*0.08;
      body.scale.setScalar(Math.max(0.001, forge3d.curScale));
      halo.scale.set(Math.max(0.1, forge3d.curScale*3), Math.max(0.1, forge3d.curScale*3), 1);
      if(forge3d.phase==='idle'){
        for(let i=0;i<nebHome.length;i++){ posAttr.setXYZ(i, nebHome[i].x, nebHome[i].y, nebHome[i].z); }
        posAttr.needsUpdate = true;
        nebMat.opacity += (0.55-nebMat.opacity)*0.05;
      }
    }
    body.material.color.copy(forge3d.curColor);
    if(!forge3d.dragging) group.rotation.y += 0.0016;
    renderer.render(scene, camera);
  }
  animate();
}

let satGame = null;
const SAT_HAZARDS = [

function cleanupSatGame(){

  `);

function satStart(){
  if(!satGame) return;
  satGame.health = 100; satGame.round = 0; satGame.active = true;
  document.getElementById('satHealthOut').textContent = '100%';
  document.getElementById('satRoundOut').textContent = `0 / ${satGame.rounds}`;
  document.getElementById('satStartBtn').style.display = 'none';
  satNextHazard();
}
function satNextHazard(){
  if(!satGame || !satGame.active) return;
  if(satGame.round >= satGame.rounds){ satFinish(true); return; }
  satGame.round++;
  document.getElementById('satRoundOut').textContent = `${satGame.round} / ${satGame.rounds}`;
  const hazard = SAT_HAZARDS[Math.floor(Math.random()*SAT_HAZARDS.length)];
  const actions = [
    {key:'rotate', label:'🔄 Rotate panels away'},
    {key:'shield', label:'🛡️ Raise shielding'},
    {key:'reboot', label:'🔁 Reboot systems'}
  ];
  const shuffled = actions.slice().sort(()=>Math.random()-0.5);
  const zone = document.getElementById('satHazardZone');
  zone.innerHTML = `
    <div class="glass" style="padding:16px;text-align:center;">
      <div style="font-size:36px;">${hazard.icon}</div>
      <div style="font-family:var(--font-display);font-size:14px;margin:6px 0;">${hazard.name} incoming!</div>
      <div class="profile-bar-track" style="max-width:100%;margin:10px 0;"><div class="profile-bar-fill" id="satTimerBar" style="width:100%;background:linear-gradient(90deg,var(--good),var(--gold));"></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px;">
        ${shuffled.map(a=>`<button class="btn ghost small" onclick="satAnswer('${a.key}','${hazard.action}')">${a.label}</button>`).join('')}
      </div>
    </div>`;
  const duration = Math.max(1200, 3000 - (satGame.level-1)*220);
  const startTime = performance.now();
  function tick(){
    if(!satGame || !satGame.active) return;
    const elapsed = performance.now()-startTime;
    const pct = Math.max(0, 1-elapsed/duration);
    const bar = document.getElementById('satTimerBar');
    if(bar) bar.style.width = (pct*100)+'%';
    if(pct<=0){ satAnswer(null, hazard.action); return; }
    satGame.raf = requestAnimationFrame(tick);
  }
  satGame.raf = requestAnimationFrame(tick);
}
function satAnswer(chosen, correct){
  if(!satGame || !satGame.active) return;
  cancelAnimationFrame(satGame.raf);
  const zone = document.getElementById('satHazardZone');
  const ok = chosen === correct;
  const dmg = Math.min(30, 18 + (satGame.level-1)*1.5);
  if(!ok){ satGame.health -= dmg; }
  document.getElementById('satHealthOut').textContent = Math.max(0,Math.round(satGame.health))+'%';
  zone.innerHTML = `<div class="mystery-feedback" style="text-align:center;border-color:${ok?'rgba(52,211,153,0.35)':'rgba(248,113,113,0.35)'};background:${ok?'rgba(52,211,153,0.08)':'rgba(248,113,113,0.08)'};">
    ${ok ? '✅ Handled it — systems nominal.' : (chosen===null ? '⏱️ Too slow — took damage.' : '❌ Wrong response — took damage.')}
  </div>`;
  if(satGame.health <= 0){ setTimeout(()=>satFinish(false), 900); return; }
  satGame.hazardTimeout = setTimeout(satNextHazard, 1100);
}
function satFinish(survived){
  if(!satGame) return;
  satGame.active = false;
  const zone = document.getElementById('satHazardZone');
  if(survived){
    const clearedLevel = satGame.level;
    const nextLevel = bumpGameLevel('satellite');
    zone.innerHTML = `<div class="mystery-feedback" style="text-align:center;border-color:rgba(52,211,153,0.35);background:rgba(52,211,153,0.08);"><strong style="color:var(--good)">🛰️ Mission complete!</strong> Your satellite survived all ${satGame.rounds} hazards with ${Math.max(0,Math.round(satGame.health))}% health remaining. Reopen for Level ${nextLevel} — more hazards, faster reactions needed.</div>`;
    if(!state.gamesCompleted.includes('satellite')){
      state.gamesCompleted.push('satellite'); saveState();
      checkBadges();
    }
    addXP(45 + Math.round(satGame.health*0.35) + clearedLevel*5, `Satellite Survival · Level ${clearedLevel} cleared`);
  } else {
    zone.innerHTML = `<div class="mystery-feedback" style="text-align:center;border-color:rgba(248,113,113,0.35);background:rgba(248,113,113,0.08);"><strong style="color:var(--danger)">🛰️ Satellite lost.</strong> It took too much damage. Try reacting faster next time!</div>`;
  }
  document.getElementById('satStartBtn').style.display = 'inline-flex';
  document.getElementById('satStartBtn').textContent = '🔁 Try Again';
}

function initSolarBuild(level, minRequired){

  resize();
  const ctx = canvas.getContext('2d');
  solarBuild = {canvas, ctx, wrap, dpr, planets:[], running:false, unstable:false, level: level||1, minRequired: minRequired||3, raf:null};

function sbRefresh(){ document.getElementById('sbDistVal').textContent = (parseFloat(document.getElementById('sbDistSlider').value)/10).toFixed(1); }
function sbAddPlanet(){
  if(!solarBuild || solarBuild.planets.length>=5 || solarBuild.running) return;
  const slider = document.getElementById('sbDistSlider');
  const auVal = parseFloat(slider.value)/10;
  const maxAU = parseFloat(slider.max)/10;
  const w = solarBuild.canvas.width/solarBuild.dpr, h = solarBuild.canvas.height/solarBuild.dpr;
  const cx = w/2, cy = h/2;
  const pxRadius = (auVal/maxAU) * (Math.min(w,h)*0.44) + 14;
  const angle = Math.random()*Math.PI*2;
  const colors = ['#f97316','#38bdf8','#a78bfa','#34d399','#f87171'];
  solarBuild.planets.push({
    au:auVal, angle, r:pxRadius, x:cx+Math.cos(angle)*pxRadius, y:cy+Math.sin(angle)*pxRadius,
    vx:0, vy:0, color:colors[solarBuild.planets.length%colors.length], mass: 6+Math.random()*4, radius:5
  });
  document.getElementById('sbCountOut').textContent = `${solarBuild.planets.length} / 5`;
}
function sbClear(){
  if(!solarBuild) return;
  solarBuild.planets = []; solarBuild.running=false; solarBuild.unstable=false;
  document.getElementById('sbCountOut').textContent = '0 / 5';
  document.getElementById('sbStatusOut').textContent = 'DESIGNING';
}
function sbRunSimulation(){
  if(!solarBuild || solarBuild.planets.length<2) { showToast('Add at least 2 planets first'); return; }
  const w = solarBuild.canvas.width/solarBuild.dpr, h = solarBuild.canvas.height/solarBuild.dpr;
  const cx=w/2, cy=h/2;
  const G = 0.28;
  solarBuild.planets.forEach(p=>{
    const dx = p.x-cx, dy = p.y-cy;
    const dist = Math.hypot(dx,dy)||1;
    const speed = Math.sqrt(G*1800/dist);
    p.vx = -dy/dist*speed; p.vy = dx/dist*speed;
  });
  solarBuild.running = true;
  solarBuild.unstable = false;
  solarBuild.simTime = 0;
  document.getElementById('sbStatusOut').textContent = 'SIMULATING…';
}
function sbPhysicsStep(){
  const w = solarBuild.canvas.width/solarBuild.dpr, h = solarBuild.canvas.height/solarBuild.dpr;
  const cx=w/2, cy=h/2;
  const G = 0.28, sunMass=1800;
  const dt = 0.9;
  solarBuild.planets.forEach(p=>{
    let ax=0, ay=0;
    const dxSun=cx-p.x, dySun=cy-p.y;
    const dSun = Math.max(Math.hypot(dxSun,dySun),8);
    const fSun = G*sunMass/(dSun*dSun);
    ax += fSun*(dxSun/dSun); ay += fSun*(dySun/dSun);
    solarBuild.planets.forEach(o=>{
      if(o===p) return;
      const dx=o.x-p.x, dy=o.y-p.y;
      const d = Math.max(Math.hypot(dx,dy),6);
      const f = G*o.mass/(d*d);
      ax += f*(dx/d); ay += f*(dy/d);
    });
    p.vx += ax*dt*0.02; p.vy += ay*dt*0.02;
  });
  solarBuild.planets.forEach(p=>{ p.x += p.vx*dt; p.y += p.vy*dt; });

  for(let i=0;i<solarBuild.planets.length;i++){
    for(let j=i+1;j<solarBuild.planets.length;j++){
      const a=solarBuild.planets[i], b=solarBuild.planets[j];
      if(Math.hypot(a.x-b.x,a.y-b.y) < a.radius+b.radius+3){ solarBuild.unstable=true; }
    }
  }
  solarBuild.planets.forEach(p=>{
    if(Math.hypot(p.x-cx,p.y-cy) > Math.max(w,h)){ solarBuild.unstable=true; }
  });

  solarBuild.simTime += dt;
  if(solarBuild.simTime > 700){
    solarBuild.running = false;
    sbEvaluate();
  }
  if(solarBuild.unstable && solarBuild.simTime > 60){
    solarBuild.running = false;
    sbEvaluate();
  }
}
function sbEvaluate(){
  document.getElementById('sbStatusOut').textContent = solarBuild.unstable ? 'UNSTABLE ⚠️' : 'STABLE ✅';
  const minRequired = solarBuild.minRequired || 3;
  if(!solarBuild.unstable && solarBuild.planets.length>=minRequired){
    const clearedLevel = solarBuild.level;
    const nextLevel = bumpGameLevel('solarbuilder');
    if(!state.gamesCompleted.includes('solarbuilder')){
      state.gamesCompleted.push('solarbuilder'); saveState();
      checkBadges();
    }
    addXP(60 + solarBuild.planets.length*10 + clearedLevel*6, `Solar System · Level ${clearedLevel} cleared`);
    showToast(`Stable! Reopen for Level ${nextLevel} — an even tighter orbital range.`);
  } else if(solarBuild.unstable){
    showToast('Your system became unstable — try spacing planets farther apart.');
  } else {
    showToast(`Stable, but you need at least ${minRequired} planets to clear this level.`);
  }
}
function sbDraw(){
  if(!solarBuild) return;
  const {ctx, canvas, dpr} = solarBuild;
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.save(); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2;

  if(solarBuild.running) sbPhysicsStep();

  const sunGrad = ctx.createRadialGradient(cx,cy,0,cx,cy,26);
  sunGrad.addColorStop(0,'rgba(255,244,214,1)'); sunGrad.addColorStop(1,'rgba(251,191,36,0)');
  ctx.beginPath(); ctx.arc(cx,cy,26,0,Math.PI*2); ctx.fillStyle=sunGrad; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,9,0,Math.PI*2); ctx.fillStyle='#fff4d6'; ctx.fill();

  if(!solarBuild.running){
    solarBuild.planets.forEach(p=>{
      ctx.beginPath(); ctx.arc(cx,cy,p.r,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=1; ctx.stroke();
    });
  }
  solarBuild.planets.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
    ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=6; ctx.fill(); ctx.shadowBlur=0;
  });
  ctx.restore();
}

let signalGame = null;
function cleanupSignalGame(){
  if(!signalGame) return;
  cancelAnimationFrame(signalGame.raf);
  signalGame = null;
}
const SIGNAL_TYPES = [
  {key:'noise', label:'Random Noise', explain:'Pure background noise — no repeating structure at all.'},
  {key:'pulsar', label:'Pulsar', explain:'Sharp, perfectly regular pulses — the signature of a rapidly spinning neutron star.'},
  {key:'frb', label:'Fast Radio Burst', explain:'A single, intense, extremely brief burst with no repetition — classic FRB behavior.'},
  {key:'transit', label:'Exoplanet Transit', explain:'Smooth, periodic dips in brightness — a planet passing in front of its star.'}
];
function openSignalHunter(){
  signalGame = {round:0, totalRounds:6, score:0};
  openModal(`
    <div class="eyebrow">Experience · Live Game</div>
    <h2>📡 Signal Hunter</h2>
    <div class="m-sub">Classify each mysterious signal before time runs out.</div>
    <div class="sim-canvas-wrap" id="sigCanvasWrap" style="height:150px;"></div>
    <div class="sim-readout">
      <div class="r-box"><div class="k">SIGNAL</div><div class="v" id="sigRoundOut">0 / 6</div></div>

    </div>

    <div id="sigFeedback" style="margin-top:12px;"></div>
  `);
  initSignalCanvas();

function initSignalCanvas(){
  const wrap = document.getElementById('sigCanvasWrap');
  if(!wrap) return;
  const canvas = document.createElement('canvas');
  wrap.appendChild(canvas);
  const dpr = Math.min(window.devicePixelRatio,2);
  function resize(){ const w=wrap.clientWidth,h=wrap.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
  resize();
  const ctx = canvas.getContext('2d');
  signalGame.canvas = canvas; signalGame.ctx = ctx; signalGame.dpr = dpr; signalGame.wrap = wrap;
  function frame(){ signalGame.raf = requestAnimationFrame(frame); sigDraw(); }
  frame();
}
function generateSignalData(type){
  const N = 200;
  const data = [];
  if(type==='noise'){
    for(let i=0;i<N;i++) data.push(Math.random());
  } else if(type==='pulsar'){
    const period = 18+Math.floor(Math.random()*8);
    for(let i=0;i<N;i++) data.push((i%period < 3) ? 0.9+Math.random()*0.1 : 0.1+Math.random()*0.08);
  } else if(type==='frb'){
    const burstAt = 60+Math.floor(Math.random()*90);
    for(let i=0;i<N;i++) data.push((i>=burstAt && i<burstAt+4) ? 0.95 : 0.08+Math.random()*0.06);
  } else {
    const period = 50+Math.floor(Math.random()*30);
    for(let i=0;i<N;i++){
      const phase = (i%period)/period;
      const dist = Math.min(phase, 1-phase);
      const dip = dist<0.06 ? (0.5*(1+Math.cos(dist/0.06*Math.PI)))*0.4 : 0;
      data.push(0.75-dip+Math.random()*0.03);
    }
  }
  return data;
}
function sigNextRound(){
  if(!signalGame) return;
  signalGame.round++;
  document.getElementById('sigRoundOut').textContent = `${signalGame.round} / ${signalGame.totalRounds}`;
  document.getElementById('sigFeedback').innerHTML = '';
  if(signalGame.round > signalGame.totalRounds){ sigFinish(); return; }
  const type = SIGNAL_TYPES[Math.floor(Math.random()*SIGNAL_TYPES.length)];
  signalGame.currentType = type.key;
  signalGame.data = generateSignalData(type.key);
  const shuffled = SIGNAL_TYPES.slice().sort(()=>Math.random()-0.5);
  document.getElementById('sigButtons').innerHTML = shuffled.map(t=>`<button class="btn ghost small" onclick="sigAnswer('${t.key}')">${t.label}</button>`).join('');
}
function sigAnswer(chosen){
  if(!signalGame) return;
  document.querySelectorAll('#sigButtons button').forEach(b=>b.disabled=true);
  const correct = SIGNAL_TYPES.find(t=>t.key===signalGame.currentType);
  const ok = chosen === signalGame.currentType;
  if(ok) signalGame.score++;
  document.getElementById('sigScoreOut').textContent = signalGame.score;
  document.getElementById('sigFeedback').innerHTML = `
    <div class="mystery-feedback" style="border-color:${ok?'rgba(52,211,153,0.35)':'rgba(248,113,113,0.35)'};background:${ok?'rgba(52,211,153,0.08)':'rgba(248,113,113,0.08)'};">
      <strong style="color:${ok?'var(--good)':'var(--danger)'}">${ok?'✅ Correct':'❌ Not quite — it was '+correct.label}.</strong> ${correct.explain}
    </div>
    <button class="btn small" style="margin-top:10px;" onclick="sigNextRound()">${signalGame.round>=signalGame.totalRounds?'See Results →':'Next Signal →'}</button>`;
}
function sigFinish(){
  const pct = Math.round(signalGame.score/signalGame.totalRounds*100);
  document.getElementById('sigButtons').innerHTML = '';
  document.getElementById('sigFeedback').innerHTML = `<div class="mystery-feedback" style="text-align:center;"><strong style="color:var(--cyan)">Hunt complete!</strong> You classified ${signalGame.score}/${signalGame.totalRounds} signals correctly (${pct}%).</div>`;
  const already = state.gamesCompleted.includes('signalhunter');
  if(!already && signalGame.score >= 4){
    state.gamesCompleted.push('signalhunter'); saveState();
    addXP(30 + signalGame.score*10, 'Signal Hunter complete');
    checkBadges();
  } else if(already){
    showToast('Nice hunt! (already completed — no extra XP)');
  } else {
    showToast('Score at least 4/6 correct to log this mission — try again!');
  }
}
function sigDraw(){
  if(!signalGame || !signalGame.ctx) return;
  const {ctx, canvas, dpr, data} = signalGame;
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.save(); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.beginPath(); ctx.moveTo(0,h*0.5); ctx.lineTo(w,h*0.5); ctx.stroke();
  if(data){
    ctx.beginPath();
    data.forEach((v,i)=>{
      const x = (i/data.length)*w;
      const y = h - v*h*0.85 - h*0.05;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.strokeStyle = '#22d3ee'; ctx.lineWidth=1.5; ctx.shadowColor='#22d3ee'; ctx.shadowBlur=5; ctx.stroke(); ctx.shadowBlur=0;
  }
  ctx.restore();
}

function initMarsCanvas(){
  const wrap = document.getElementById('marsCanvasWrap');
  if(!wrap) return;
  const canvas = document.createElement('canvas');
  wrap.appendChild(canvas);
  const dpr = Math.min(window.devicePixelRatio,2);
  function resize(){ const w=wrap.clientWidth,h=wrap.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
  resize();
  window._marsCanvas = {canvas, ctx:canvas.getContext('2d'), dpr, wrap, progress:0};
  marsDrawTrajectory(0);
}
function marsDrawTrajectory(progress){
  const m = window._marsCanvas;
  if(!m) return;
  const {ctx, canvas, dpr} = m;
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.save(); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  const earthX=w*0.15, earthY=h*0.7, marsX=w*0.85, marsY=h*0.3;
  ctx.beginPath(); ctx.arc(earthX,earthY,10,0,Math.PI*2); ctx.fillStyle='#3b82f6'; ctx.fill();
  ctx.beginPath(); ctx.arc(marsX,marsY,8,0,Math.PI*2); ctx.fillStyle='#ef4444'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(earthX,earthY);
  ctx.quadraticCurveTo(w*0.5, h*1.05, marsX, marsY);
  ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.setLineDash([4,4]); ctx.lineWidth=1.5; ctx.stroke(); ctx.setLineDash([]);
  const t = progress;
  const qx = (1-t)*(1-t)*earthX + 2*(1-t)*t*(w*0.5) + t*t*marsX;
  const qy = (1-t)*(1-t)*earthY + 2*(1-t)*t*(h*1.05) + t*t*marsY;
  ctx.beginPath(); ctx.arc(qx,qy,5,0,Math.PI*2); ctx.fillStyle='#fbbf24'; ctx.shadowColor='#fbbf24'; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
  ctx.restore();
}
function marsCompute(){
  const windowAlign = parseFloat(document.getElementById('marsWindowSlider').value);
  const fuel = parseFloat(document.getElementById('marsFuelSlider').value);
  const payload = parseFloat(document.getElementById('marsPayloadSlider').value);
  const traj = document.getElementById('marsTrajSelect').value;
  const baseDays = {direct:180, assist:260, lowenergy:340}[traj];
  const transitDays = Math.round(baseDays - (fuel-50)*0.4);
  const fuelMargin = Math.max(0, Math.min(100, fuel - payload*0.6));
  const radiationRisk = Math.min(100, transitDays*0.22);
  const score = Math.round(windowAlign*0.35 + fuelMargin*0.25 + payload*0.2 + (100-radiationRisk)*0.2);
  return {windowAlign, fuel, payload, traj, transitDays, fuelMargin, radiationRisk, score: Math.max(0,Math.min(100,score))};
}
function marsUpdate(){
  document.getElementById('marsWindowVal').textContent = document.getElementById('marsWindowSlider').value;
  document.getElementById('marsFuelVal').textContent = document.getElementById('marsFuelSlider').value;
  document.getElementById('marsPayloadVal').textContent = document.getElementById('marsPayloadSlider').value;
  const r = marsCompute();
  document.getElementById('marsTimeOut').textContent = r.transitDays+' days';
  document.getElementById('marsMarginOut').textContent = Math.round(r.fuelMargin)+'%';
  document.getElementById('marsRiskOut').textContent = Math.round(r.radiationRisk)+'%';
  document.getElementById('marsScoreOut').textContent = r.score+'/100';
  if(window._marsCanvas) marsDrawTrajectory(0);
}
function marsLaunch(){
  const r = marsCompute();
  let tier, msg;
  if(r.score<40){ tier='MISSION FAILURE'; msg='The mission profile was too risky — insufficient fuel margin or a poor launch window doomed the trip.'; }
  else if(r.score<65){ tier='PARTIAL SUCCESS'; msg='The spacecraft reached Mars, but with a rougher journey than planned. Some science objectives were compromised.'; }
  else if(r.score<85){ tier='FULL SUCCESS'; msg='A well-planned mission — solid fuel margins, reasonable transit time, and strong science return.'; }
  else { tier='PERFECT MISSION'; msg='An outstanding mission profile — optimal launch window, healthy fuel margins, and manageable radiation exposure.'; }

  document.getElementById('marsOutcome').innerHTML = `<strong style="color:${r.score>=65?'var(--good)':r.score>=40?'var(--gold)':'var(--danger)'}">${tier}</strong> — ${msg}`;

  let progress = 0;
  const anim = setInterval(()=>{
    progress += 0.04;
    if(progress>=1){ progress=1; clearInterval(anim); }
    marsDrawTrajectory(progress);
  }, 30);

  const xpAward = Math.round(r.score*0.9);
  const already = state.gamesCompleted.includes('mars');
  if(r.score>=65 && !already){
    state.gamesCompleted.push('mars'); saveState();
    addXP(xpAward, `Mars Mission — ${tier}`);
    checkBadges();
  } else if(r.score>=65){
    showToast('Great mission! (already completed — no extra XP)');
  } else {
    addXP(Math.round(xpAward*0.4), 'Mars Mission attempt');
  }
}
