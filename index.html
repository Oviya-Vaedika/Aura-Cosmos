     quiz:[
       {q:"What is a red giant?", options:["A newborn star","A star swelling up as it runs low on core fuel","A collapsed stellar core","A type of black hole"], correct:1, explain:"As core fuel dwindles, the star's outer layers expand and cool, glowing red."},
       {q:"What's the key difference between a red giant and a red supergiant?", options:["There is no difference","A supergiant comes from a far more massive star and swells even bigger","Red giants are hotter","Supergiants are always blue"], correct:1, explain:"Supergiants come from much more massive stars and grow to even greater sizes."}
     ]},
    {title:"Planetary nebulae", teach:{title:"A star's final glow", text:"A Sun-like star eventually sheds its outer layers into space, forming a glowing shell of gas called a planetary nebula — despite the name, it has nothing to do with actual planets."},
     quiz:[
       {q:"What is a planetary nebula, despite its name?", options:["A cluster of newborn planets","A glowing shell of gas shed by a dying Sun-like star","A type of exoplanet","A young star-forming region"], correct:1, explain:"Despite the name, it's the shed outer layers of a dying star, unrelated to planets."},
       {q:"Does a planetary nebula have anything to do with planets?", options:["Yes, it's made of planets","No, it's just a misleading historical name for a gas shell","Yes, it always contains one planet","It's a cluster of dwarf planets"], correct:1, explain:"Early astronomers thought they looked like planets through small telescopes — the name stuck."}
     ]},
    {title:"White dwarfs", teach:{title:"White dwarfs: the leftover core", text:"What's left behind after a planetary nebula fades is a white dwarf — a small, extremely dense, slowly cooling stellar core, roughly Earth-sized but packing about the Sun's worth of mass."},
     quiz:[
       {q:"What remains after a Sun-like star sheds its outer layers?", options:["A black hole","A white dwarf","A neutron star","A red giant"], correct:1, explain:"The exposed core left behind becomes a slowly cooling white dwarf."},
       {q:"How does a white dwarf compare in size to Earth?", options:["Much larger, like the Sun","Roughly similar in size","Much smaller than the Moon","It has no defined size"], correct:1, explain:"A white dwarf packs a Sun's worth of mass into a volume close to Earth's size."}
     ]},
    {title:"Supernovae", teach:{title:"Supernovae: violent endings", text:"Much more massive stars don't fade quietly — they explode as supernovae, briefly outshining entire galaxies. The explosion scatters heavy elements into space, seeding future stars and planets."},
     quiz:[
       {q:"Roughly how massive must a star be (compared to the Sun) to eventually explode as a supernova?", options:["Any mass at all","About half the Sun's mass","Roughly 8 times the Sun's mass or more","Exactly the Sun's mass"], correct:2, explain:"Only sufficiently massive stars build up the conditions needed for a supernova."},
       {q:"What do supernova explosions scatter into space?", options:["Only light, no matter","Heavy elements that seed future stars and planets","Pure hydrogen only","Nothing — they implode silently"], correct:1, explain:"Supernovae forge and scatter heavy elements — the raw material for future stars and planets."}
     ]},
    {title:"Neutron stars & pulsars", teach:{title:"Neutron stars and pulsars", text:"After a supernova, a very dense stellar corpse can remain: a neutron star. Some spin rapidly and sweep beams of radiation past us like a lighthouse — these are called pulsars."},
     quiz:[
       {q:"What is a pulsar?", options:["A type of planet","A rapidly spinning neutron star","A dying red giant","A newly formed nebula"], correct:1, explain:"Pulsars are neutron stars that spin rapidly, sweeping beams of radiation past us."},
       {q:"How dense is a typical neutron star?", options:["About as dense as water","So dense a teaspoon would weigh billions of tons","Roughly as dense as rock","Similar density to a gas giant"], correct:1, explain:"Neutron stars are astonishingly dense, packing a huge mass into a tiny volume."}
     ]},
    {title:"Black holes", teach:{title:"Black holes", text:"If the leftover core after a supernova is massive enough, it can collapse completely into a black hole — a region where gravity is so strong that not even light can escape."},
     quiz:[
       {q:"What kind of star can collapse into a black hole?", options:["Any star","Only red dwarfs","Very massive stars after a supernova","Only binary stars"], correct:2, explain:"Only stars with enough leftover mass after a supernova collapse into a black hole."},
       {q:"What is unique about a black hole's gravity?", options:["It's weaker than a planet's","It's so strong that not even light can escape","It only affects large objects","It doesn't actually pull on anything"], correct:1, explain:"A black hole's gravity is so extreme that nothing, not even light, can escape past its horizon."}
     ]}
  ]},
  {title:"Galaxies", subLevels:[
    {title:"The Milky Way", teach:{title:"Our home galaxy", text:"The Milky Way is our home galaxy, a barred spiral containing over 100 billion stars. Our solar system sits out in one of its spiral arms, far from the crowded galactic center."},
     quiz:[
       {q:"What type of galaxy is the Milky Way?", options:["Elliptical","Irregular","Barred spiral","Ring galaxy"], correct:2, explain:"The Milky Way is a barred spiral galaxy with curving arms and a central bar of stars."},
       {q:"Roughly how many stars does the Milky Way contain?", options:["A few thousand","About a million","100 billion or more","Exactly 8"], correct:2, explain:"Our galaxy contains on the order of 100 billion stars or more."}
     ]},
    {title:"Galaxy types", teach:{title:"Shapes of galaxies", text:"Galaxies broadly come in three shapes: spiral (with graceful curving arms, like the Milky Way), elliptical (rounder, football-shaped collections of older stars), and irregular (no defined shape, often disturbed by collisions)."},
     quiz:[
       {q:"What shape describes an elliptical galaxy?", options:["Curving spiral arms","A rounder, football-like shape","No defined shape at all","A thin ring"], correct:1, explain:"Elliptical galaxies are smooth, rounded collections of mostly older stars."},
       {q:"Which galaxy shape typically has curving arms?", options:["Elliptical","Spiral","Irregular","None of them"], correct:1, explain:"Spiral galaxies, like the Milky Way, have graceful curving arms."}
     ]},
    {title:"Galaxy formation", teach:{title:"How galaxies form and grow", text:"Galaxies formed as gravity pulled together huge clouds of gas and dark matter in the early universe. They continue growing over billions of years, often by merging with neighboring galaxies."},
     quiz:[
       {q:"How do galaxies often continue to grow over billions of years?", options:["By shrinking their stars","By merging with neighboring galaxies","By losing all their gas","They never change"], correct:1, explain:"Galactic mergers and collisions are a major way galaxies grow and evolve."},
       {q:"What two ingredients did gravity pull together to form early galaxies?", options:["Gas and dark matter","Only stars","Only planets","Only black holes"], correct:0, explain:"Early galaxies formed as gravity gathered gas and dark matter together."}
     ]},
    {title:"Clusters & collisions", teach:{title:"Galaxy clusters and collisions", text:"Galaxies aren't alone in space — they gather into huge clusters bound by gravity. Sometimes entire galaxies collide and merge over millions of years, reshaping both in the process."},
     quiz:[
       {q:"What commonly happens when two galaxies pass close to each other over millions of years?", options:["They always destroy each other instantly","They may collide and merge, reshaping both","They repel each other permanently","Nothing — galaxies can't interact"], correct:1, explain:"Gravity can draw galaxies together into slow, dramatic mergers."},
       {q:"What holds galaxy clusters together?", options:["Magnetism","Gravity","Solar wind","Nothing, they just happen to be nearby"], correct:1, explain:"Gravity binds galaxies into huge clusters spanning millions of light-years."}
     ]},
    {title:"Supermassive black holes", teach:{title:"Supermassive black holes", text:"Most large galaxies, including the Milky Way, harbor a supermassive black hole at their center — millions to billions of times the Sun's mass, quietly anchoring the galaxy's core."},
     quiz:[
       {q:"Where is a supermassive black hole usually found in a large galaxy?", options:["Scattered throughout the disk","At the very center","Only in the outer halo","They don't exist"], correct:1, explain:"Supermassive black holes sit at the centers of most large galaxies."},
       {q:"What evidence points to a supermassive black hole's presence?", options:["Direct photos only","Stars and gas orbiting rapidly around an invisible mass","Random guessing","Its bright visible surface"], correct:1, explain:"Fast-orbiting stars/gas around an unseen central mass is strong evidence."}
     ]},
    {title:"Active galaxies & quasars", teach:{title:"Active galaxies and quasars", text:"When a supermassive black hole actively pulls in huge amounts of gas, the surrounding disk can glow so brightly it outshines the entire galaxy — this extreme phenomenon is called a quasar."},
     quiz:[
       {q:"What powers a quasar?", options:["A supermassive black hole actively accreting matter","A cluster of supernovae","Nuclear fusion in a single star","Dark matter collisions"], correct:0, explain:"Gas spiraling into a feeding supermassive black hole can outshine an entire galaxy."},
       {q:"Why can a quasar outshine its entire host galaxy?", options:["It has more stars than the galaxy","Actively feeding matter around the black hole glows intensely bright","It's actually much bigger than the galaxy","It reflects sunlight"], correct:1, explain:"The intense glow comes from matter heating up as it spirals into the black hole."}
     ]}
  ]},
  {title:"Observational Astronomy", subLevels:[
    {title:"Telescopes", teach:{title:"Telescopes: bigger is better", text:"Telescopes collect light — the bigger the mirror or lens, the more light they gather, and the fainter and farther objects they can reveal."},
     quiz:[
       {q:"Why is a bigger telescope mirror generally better?", options:["It looks more impressive only","It gathers more light, revealing fainter and more distant objects","It makes objects move faster","It has no real benefit"], correct:1, explain:"More collected light means fainter, more distant objects become visible."},
       {q:"What is the main job of a telescope?", options:["To create light","To collect and focus light","To block light","To generate gravity"], correct:1, explain:"A telescope's core purpose is gathering and focusing light for us to study."}
     ]},
    {title:"Radio astronomy", teach:{title:"Beyond visible light", text:"Radio astronomy uses giant dish antennas to detect radio waves from space, revealing things invisible light can't show, like cold gas clouds and pulsars."},
     quiz:[
       {q:"Why might astronomers use a radio telescope instead of an optical one?", options:["Radio telescopes are always cheaper","To detect things invisible in ordinary light, like cold gas clouds or pulsars","Radio telescopes see in color better","There is no real difference"], correct:1, explain:"Radio waves reveal phenomena that emit little or no visible light."},
       {q:"What shape are most radio telescopes built as?", options:["Flat panels","Large dish antennas","Thin tubes","Cube-shaped boxes"], correct:1, explain:"Large dish antennas are the classic shape for collecting faint radio waves."}
     ]},
    {title:"Space telescopes", teach:{title:"Escaping the atmosphere", text:"Space telescopes orbit above Earth's atmosphere, avoiding the blurring and distortion that ground telescopes have to fight through, resulting in remarkably sharp images."},
     quiz:[
       {q:"Why do astronomers build telescopes in space?", options:["To make them cheaper","To avoid the blurring effect of Earth's atmosphere","Because space telescopes are easier to repair","To increase gravity's pull"], correct:1, explain:"Earth's atmosphere distorts starlight; space telescopes get a clean, sharp view."},
       {q:"What's a key disadvantage ground-based telescopes have that space telescopes avoid?", options:["Cost","Atmospheric blurring and distortion","Too much light","They can't see stars"], correct:1, explain:"The atmosphere blurs and distorts incoming light before it reaches ground telescopes."}
     ]},
    {title:"Spectroscopy", teach:{title:"Reading starlight", text:"Spreading a star's light into a rainbow — a spectrum — reveals dark lines that act like a chemical fingerprint, showing what elements it contains and how fast it's moving toward or away from us."},
     quiz:[
       {q:"What does spreading a star's light into a spectrum reveal?", options:["Its exact age","Its chemical composition and motion","Its exact mass","Its magnetic field strength"], correct:1, explain:"Dark absorption lines act as a chemical fingerprint and reveal motion via shifting."},
       {q:"What do the dark lines in a star's spectrum represent?", options:["Random noise","A chemical fingerprint of the star's composition","Camera errors","The star's exact age"], correct:1, explain:"Each element absorbs light at specific wavelengths, creating a unique pattern of lines."}
     ]},
    {title:"Brightness & magnitude", teach:{title:"How bright is 'bright'?", text:"Astronomers measure brightness using magnitude — confusingly, lower numbers mean brighter objects. A star's true brightness also depends on how far away it is."},
     quiz:[
       {q:"In the magnitude scale, which star is brighter?", options:["A star with magnitude 2","A star with magnitude 8","They're equally bright","Magnitude doesn't relate to brightness"], correct:0, explain:"Lower magnitude numbers mean brighter objects — it can feel backwards at first."},
       {q:"Does a star's apparent brightness from Earth depend only on how much light it emits?", options:["Yes, only that","No — distance matters too","No, only its color matters","No, only its size matters"], correct:1, explain:"A star's apparent brightness depends on both its true output and its distance from us."}
     ]},
    {title:"Parallax", teach:{title:"Measuring distance with parallax", text:"Parallax measures a star's distance by how much it appears to shift against background stars as Earth orbits the Sun — nearby stars shift more than distant ones."},
     quiz:[
       {q:"Parallax is used to measure a star's...", options:["Temperature","Distance","Mass","Color"], correct:1, explain:"The star's apparent shift against background stars reveals how far away it is."},
       {q:"Which star would show a larger parallax shift?", options:["A more distant star","A closer star","Both shift equally","Parallax doesn't depend on distance"], correct:1, explain:"Closer stars appear to shift more against the background as Earth orbits the Sun."}
     ]},
    {title:"Redshift & Hubble's law", teach:{title:"Measuring cosmic expansion", text:"Redshift shows a galaxy's light stretching toward red as it moves away from us. Hubble's law connects that redshift to distance, revealing that the universe is expanding."},
     quiz:[
       {q:"Hubble's law relates a galaxy's redshift to its...", options:["Age","Mass","Distance","Brightness"], correct:2, explain:"Hubble's law shows more distant galaxies have greater redshift, revealing expansion."},
       {q:"What does a large redshift generally suggest about a galaxy?", options:["It is moving toward us fast","It is moving away and likely far away","It has stopped moving","It's very close to us"], correct:1, explain:"Larger redshift generally corresponds to a galaxy receding faster and being more distant."}
     ]}
  ]},
  {title:"Exoplanets", subLevels:[
    {title:"Transit method", teach:{title:"Catching a planet's shadow", text:"When a planet passes in front of its star from our point of view, it blocks a tiny bit of starlight. Astronomers detect this faint, repeating dip in brightness — the transit method has found the most exoplanets so far."},
     quiz:[
       {q:"The transit method detects exoplanets by observing...", options:["Gravitational waves","A dip in starlight brightness","Radio signals","Direct photographs"], correct:1, explain:"A planet passing in front of its star blocks a tiny, repeating amount of light."},
       {q:"Which exoplanet detection method has found the most confirmed planets so far?", options:["Direct imaging","The transit method","Microlensing","Radio detection"], correct:1, explain:"Surveying many stars at once has made the transit method the most productive technique."}
     ]},
    {title:"Radial velocity", teach:{title:"The wobbling star", text:"A planet's gravity gives its star a tiny tug back, causing the star to wobble slightly. Astronomers detect this as a small shift in the star's light — the radial velocity method."},
     quiz:[
       {q:"What causes a star to 'wobble' in the radial velocity method?", options:["Solar flares","The gravitational tug of an orbiting planet","Nearby supernovae","Magnetic storms"], correct:1, explain:"A planet's gravity tugs back on its star, causing a small detectable wobble."},
       {q:"What does the radial velocity method actually detect?", options:["A dip in brightness","A slight wobble or shift in the star's light","A direct photo of the planet","Radio signals"], correct:1, explain:"The method measures tiny shifts in starlight caused by the star's wobble."}
     ]},
    {title:"Direct imaging", teach:{title:"Seeing a planet directly", text:"Direct imaging means literally photographing an exoplanet — extremely hard, since a star is billions of times brighter than the tiny planet next to it."},
     quiz:[
       {q:"Why is direct imaging of exoplanets so difficult?", options:["Planets don't reflect light","The star is billions of times brighter than the planet","Planets move too fast to photograph","Telescopes can't focus that far"], correct:1, explain:"The star's glare overwhelms the much fainter light of the planet."},
       {q:"Direct imaging works best for which kind of exoplanets?", options:["Small planets close to a bright star","Large planets far from their star","Planets with no atmosphere","Planets that don't reflect light"], correct:1, explain:"Large, well-separated planets are easier to distinguish from their star's glare."}
     ]},
    {title:"Microlensing", teach:{title:"Gravity as a magnifying glass", text:"When a foreground star passes in front of a background star, its gravity bends and magnifies the background star's light. A planet orbiting that foreground star can leave its own small blip in that magnification."},
     quiz:[
       {q:"What best describes microlensing as an exoplanet detection method?", options:["Photographing a planet directly","Using a foreground star's gravity to briefly magnify a background star's light, revealing a planet","Listening for radio signals","Measuring a planet's temperature directly"], correct:1, explain:"Microlensing uses gravity's light-bending effect as a natural magnifying glass."},
       {q:"What natural phenomenon does microlensing rely on?", options:["Starlight reflection","Gravity bending and magnifying light","Radio wave interference","Atmospheric refraction on Earth"], correct:1, explain:"Gravity itself bends light, an effect predicted by general relativity."}
     ]},
    {title:"Habitable zones", teach:{title:"Could it host life?", text:"The habitable zone is the range of distances from a star where temperatures could allow liquid water to exist on a planet's surface — not too hot, not too cold."},
     quiz:[
       {q:"What defines a star's 'habitable zone'?", options:["Where asteroids are common","Where liquid water could exist on a planet's surface","Where planets form fastest","Where magnetic fields are strongest"], correct:1, explain:"It's the distance range from a star where temperatures allow liquid water."},
       {q:"Why does the habitable zone matter for the search for life?", options:["It has nothing to do with life","Liquid water is considered important for life as we know it","It only affects a planet's color","It determines a planet's size"], correct:1, explain:"Liquid water is a key ingredient scientists look for when assessing habitability."}
     ]},
    {title:"Atmospheres & biosignatures", teach:{title:"Chemical clues to life", text:"Biosignatures are chemical clues in a planet's atmosphere, like certain gas combinations, that might hint at biological activity happening on its surface."},
     quiz:[
       {q:"What are biosignatures?", options:["Fossils found on Earth","Chemical clues in an atmosphere that might hint at life","A type of telescope","A star's magnetic signature"], correct:1, explain:"Certain atmospheric gas combinations could be produced by living processes."},
       {q:"What kind of clue is a biosignature?", options:["A visual photo of aliens","A chemical signal in a planet's atmosphere","A radio message","A gravitational wave"], correct:1, explain:"Biosignatures are indirect chemical evidence, not direct visual proof."}
     ]}
  ]},
  {title:"Extreme Astrophysics", subLevels:[
    {title:"Spacetime & relativity", teach:{title:"Gravity is curved spacetime", text:"Einstein's general relativity reframed gravity: instead of a force pulling objects together, massive objects actually bend the fabric of space and time around them, and other objects simply follow that curve."},
     quiz:[
       {q:"General relativity describes gravity as...", options:["A force between two masses only","The curvature of spacetime","A type of electromagnetic wave","An illusion caused by acceleration"], correct:1, explain:"Mass bends spacetime, and objects follow that curve — that's gravity, in Einstein's view."},
       {q:"According to general relativity, what do objects do near a massive body?", options:["They ignore it completely","They follow the curve that mass creates in spacetime","They repel it","They stop moving entirely"], correct:1, explain:"Objects simply follow the curved paths that mass creates in spacetime."}
     ]},
    {title:"Time dilation", teach:{title:"Time isn't fixed everywhere", text:"Near very strong gravity, like close to a black hole, time itself runs slower compared to somewhere with weaker gravity. This effect, called time dilation, has been measured and confirmed — GPS satellites even correct for it."},
     quiz:[
       {q:"What happens to time near very strong gravity?", options:["It speeds up","It runs slower compared to weaker gravity","It stops being measurable","It reverses"], correct:1, explain:"Strong gravity causes time dilation, slowing time relative to a distant observer."},
       {q:"What real-world technology has to correct for time dilation to work accurately?", options:["Radio telescopes","GPS satellites","Solar panels","Weather balloons"], correct:1, explain:"GPS satellites experience different gravity and speed than Earth's surface, requiring relativistic corrections."}
     ]},
    {title:"Event horizons", teach:{title:"The point of no return", text:"A black hole's event horizon is the boundary beyond which nothing, not even light, can escape its gravity. It's not a physical surface — it's a mathematical point of no return."},
     quiz:[
       {q:"What is a black hole's event horizon?", options:["Its visible surface","The boundary beyond which nothing can escape","A ring of orbiting planets","Its magnetic field edge"], correct:1, explain:"Past the event horizon, escape becomes impossible, even for light."},
       {q:"Can light escape from beyond a black hole's event horizon?", options:["Yes, easily","No, nothing can escape past it","Only very fast light can","Only during an eclipse"], correct:1, explain:"The event horizon marks the point where escape becomes physically impossible."}
     ]},
    {title:"Accretion disks", teach:{title:"Swirling into the abyss", text:"Matter falling toward a black hole doesn't fall straight in — it spirals into a superheated, glowing accretion disk first, colliding and compressing until it radiates enormous amounts of energy."},
     quiz:[
       {q:"What is an accretion disk?", options:["A ring of ice around a planet","Superheated matter spiraling into a black hole","A type of space telescope","A cluster of stars"], correct:1, explain:"Infalling matter spirals inward, heating up and glowing before crossing the horizon."},
       {q:"Why does an accretion disk glow so brightly?", options:["It reflects starlight","Infalling matter compresses and collides, heating up intensely","It's made of glowing paint","Black holes emit visible light directly"], correct:1, explain:"Friction and compression in the spiraling disk heat matter to extreme temperatures."}
     ]},
    {title:"Gravitational waves", teach:{title:"Ripples in spacetime", text:"When extremely massive objects like neutron stars merge, they send ripples through spacetime itself, called gravitational waves — first directly detected in 2015, a century after Einstein predicted them."},
     quiz:[
       {q:"What do merging neutron stars produce that we can detect on Earth?", options:["Gravitational waves","Visible light only","Radio silence","Cosmic rays exclusively"], correct:0, explain:"Extreme mergers ripple spacetime itself, producing detectable gravitational waves."},
       {q:"When were gravitational waves first directly detected?", options:["1915, by Einstein himself","2015, using highly sensitive detectors","1969, during the Moon landing","They still haven't been detected"], correct:1, explain:"Gravitational waves were first directly detected in 2015, a century after being predicted."}
     ]},
    {title:"Neutron-star mergers", teach:{title:"When neutron stars collide", text:"When two neutron stars spiral together and collide, the collision can forge heavy elements like gold and platinum, and release a burst of gravitational waves and light that astronomers can observe together."},
     quiz:[
       {q:"What can a neutron-star merger help forge?", options:["Only hydrogen","Heavy elements like gold and platinum","Only helium","Nothing physical, only light"], correct:1, explain:"The extreme collision conditions can forge heavy elements like gold and platinum."},
       {q:"Besides gravitational waves, what else can astronomers observe from a neutron-star merger?", options:["Nothing else, it's invisible","A burst of light across the spectrum","Only radio silence","A solar flare"], correct:1, explain:"Neutron-star mergers also emit light, letting astronomers study the event two ways at once."}
     ]}
  ]},
  {title:"Cosmic Mysteries", subLevels:[
    {title:"Dark matter", teach:{title:"The invisible majority", text:"Dark matter doesn't emit, absorb, or reflect light — we can't see it directly. But its gravity affects how galaxies rotate and how galaxy clusters hold together, revealing there's far more mass out there than we can see."},
     quiz:[
       {q:"What evidence suggests dark matter exists?", options:["Direct photographs of dark matter","Unexpected galaxy rotation speeds","Radio signals from empty space","Its bright glow"], correct:1, explain:"Galaxies rotate as if they contain far more mass than we can see."},
       {q:"Can astronomers see dark matter directly with a telescope?", options:["Yes, easily","No — it's inferred from its gravitational effects","Yes, but only with radio telescopes","Yes, it glows faintly"], correct:1, explain:"Dark matter is invisible; its presence is inferred only from its gravity."}
     ]},
    {title:"Dark energy", teach:{title:"An even stranger mystery", text:"Dark energy is a mysterious property of space itself that appears to be pushing the universe's expansion to accelerate. We don't fully understand what it is, only that its effects are measurable and enormous."},
     quiz:[
       {q:"What does dark energy appear to be doing to the universe?", options:["Slowing its expansion","Accelerating its expansion","Holding galaxies together","Nothing measurable"], correct:1, explain:"Dark energy's mysterious push seems to be speeding up cosmic expansion."},
       {q:"Roughly what share of the universe's total energy is dark energy thought to make up?", options:["About 5%","About 27%","About 68%","About 100%"], correct:2, explain:"Dark energy is estimated to make up roughly 68% of the universe's total energy content."}
     ]},
    {title:"Cosmic expansion", teach:{title:"The universe is stretching", text:"Cosmic expansion means space itself is stretching over time, carrying galaxies farther apart. It's not that galaxies are flying through space — the space between them is growing."},
     quiz:[
       {q:"When the universe expands, what is actually happening?", options:["Galaxies fly through fixed space","The space between galaxies is stretching","The universe is shrinking","Only light is expanding"], correct:1, explain:"Space itself stretches, carrying galaxies apart rather than moving through static space."},
       {q:"True or false: galaxies are flying through a fixed, unchanging space.", options:["True","False — space itself is stretching","Only true for nearby galaxies","Only true in the early universe"], correct:1, explain:"The stretching of space, not motion through it, drives cosmic expansion."}
     ]},
    {title:"Cosmic microwave background", teach:{title:"An echo from the beginning", text:"The Cosmic Microwave Background (CMB) is the faint afterglow of the Big Bang, filling the entire sky and still reaching us today — a snapshot of the universe when it was only 380,000 years old."},
     quiz:[
       {q:"The Cosmic Microwave Background is...", options:["Radiation from modern stars","The afterglow of the Big Bang","A type of dark matter","Light from black holes"], correct:1, explain:"It's the leftover glow from when the universe first became transparent to light."},
       {q:"How old was the universe when the light we see as the CMB was released?", options:["13.8 billion years","About 380,000 years","1 second","1 million years"], correct:1, explain:"The CMB was released once the universe cooled enough for light to travel freely, at about 380,000 years old."}
     ]},
    {title:"Large-scale structure", teach:{title:"Structure on the biggest scales", text:"On the largest scales, galaxies aren't scattered randomly — they form a cosmic web of filaments and clusters, with huge empty voids stretching in between."},
     quiz:[
       {q:"What large-scale pattern do galaxies form across the universe?", options:["A perfectly even grid","A cosmic web of filaments, clusters and voids","A single flat disk","No pattern at all"], correct:1, explain:"Gravity has sculpted matter into a web-like structure with vast empty voids."},
       {q:"What are the huge empty regions between filaments of galaxies called?", options:["Nebulae","Voids","Accretion disks","Event horizons"], correct:1, explain:"Cosmic voids are enormous, largely empty regions between filaments of galaxies."}
     ]},
    {title:"Antimatter", teach:{title:"Matter's mysterious twin", text:"Matter and its opposite, antimatter, should have been created in exactly equal amounts at the Big Bang. But the universe today is made almost entirely of matter — one of physics' biggest unsolved mysteries."},
     quiz:[
       {q:"What should have been created in equal amounts to matter at the Big Bang, according to theory?", options:["Dark energy","Antimatter","Neutron stars","Photons only"], correct:1, explain:"Theory predicts equal matter and antimatter, but matter dominates the observed universe."},
       {q:"What happens when matter and antimatter meet?", options:["Nothing happens","They annihilate each other, releasing energy","They merge into a black hole permanently","They form a new star"], correct:1, explain:"Matter and antimatter annihilate on contact, converting mass into energy."}
     ]}
  ]},
  {title:"Cosmology", subLevels:[
    {title:"The Big Bang", teach:{title:"How it all began", text:"About 13.8 billion years ago, the entire observable universe was compressed into an incredibly hot, dense state, and it has been expanding and cooling ever since. It wasn't an explosion in space — it was the beginning of space itself."},
     quiz:[
       {q:"Approximately how old is the universe?", options:["4.5 billion years","13.8 billion years","100 million years","1 trillion years"], correct:1, explain:"Multiple independent measurements converge on about 13.8 billion years."},
       {q:"Was the Big Bang an explosion happening inside pre-existing space?", options:["Yes, exactly that","No, it was the beginning of space and time themselves","Yes, but only a small explosion","No one knows"], correct:1, explain:"The Big Bang marks the start of space and time, not an explosion within it."}
     ]},
    {title:"Cosmic inflation", teach:{title:"A sudden growth spurt", text:"Cosmic inflation describes a mind-bendingly brief moment, a tiny fraction of a second after the Big Bang, when the universe expanded exponentially fast, smoothing it out and setting the stage for everything after."},
     quiz:[
       {q:"What does cosmic inflation describe?", options:["The universe's current slow cooling","A brief period of exponential expansion just after the Big Bang","The formation of black holes","Star death"], correct:1, explain:"Inflation was an extremely fast, brief burst of expansion right after the Big Bang."},
       {q:"How long after the Big Bang is inflation thought to have occurred?", options:["Billions of years later","A tiny fraction of a second after","Exactly one year after","It's still happening now everywhere"], correct:1, explain:"Inflation happened in an almost unimaginably brief instant right after the Big Bang."}
     ]},
    {title:"Early universe", teach:{title:"The universe's awkward early years", text:"For its first 380,000 years, the universe was too hot and dense for atoms to form — just a hot fog of particles and radiation. Once it cooled enough, atoms formed and light could finally travel freely."},
     quiz:[
       {q:"Why couldn't atoms form in the universe's first 380,000 years?", options:["There was no matter yet","It was too hot and dense","Gravity didn't exist yet","Light didn't exist yet"], correct:1, explain:"Extreme heat and density kept particles from binding into stable atoms."},
       {q:"What became possible once the early universe cooled enough for atoms to form?", options:["Light could finally travel freely","Gravity started working for the first time","Time began","Nothing changed"], correct:0, explain:"Once atoms formed, light was no longer constantly scattered and could travel freely."}
     ]},
    {title:"First stars & galaxies", teach:{title:"The first stars and galaxies", text:"It took a few hundred million years of gravity slowly gathering gas together before the very first stars and galaxies ignited, ending the universe's 'dark ages' and lighting up the cosmos for the first time."},
     quiz:[
       {q:"What ended the universe's 'dark ages'?", options:["The Big Bang itself","The formation of the first stars and galaxies","The release of the CMB","Cosmic inflation"], correct:1, explain:"The first stars igniting finally lit up the universe after a long dark stretch."},
       {q:"What does the term 'cosmic dark ages' refer to?", options:["The present day","The stretch of time before the first stars formed","The universe's final fate","A period with too much light"], correct:1, explain:"Before the first stars formed, the universe had no starlight yet."}
     ]},
    {title:"Cosmic timeline", teach:{title:"Piecing together the timeline", text:"Combining the Big Bang, inflation, the early hot universe, the first stars, and galaxy formation gives astronomers a full cosmic timeline stretching 13.8 billion years from the beginning to today."},
     quiz:[
       {q:"What does the 'cosmic timeline' attempt to piece together?", options:["Only the future of the universe","The full history of the universe from the Big Bang to today","Only Earth's history","Only our solar system's history"], correct:1, explain:"The cosmic timeline maps out the universe's entire history in order."},
       {q:"Roughly how many years does the cosmic timeline span?", options:["1 million years","13.8 billion years","100 years","4.5 billion years"], correct:1, explain:"The timeline stretches across the universe's full 13.8-billion-year history."}
     ]},
    {title:"Fate of the universe", teach:{title:"Where is it all headed?", text:"The universe's ultimate fate depends on the balance between matter, expansion, and dark energy. Current evidence points toward a future of ongoing, accelerating expansion — with galaxies drifting ever farther apart."},
     quiz:[
       {q:"Based on current evidence, what is the universe's expansion doing?", options:["Slowing to a stop","Reversing into a contraction","Continuing and accelerating","Staying perfectly constant"], correct:2, explain:"Observations suggest dark energy is driving continued, accelerating expansion."},
       {q:"What two main factors determine the universe's ultimate fate?", options:["Only the color of galaxies","The balance between matter/expansion and dark energy","The number of black holes only","The temperature of the Sun"], correct:1, explain:"How matter, expansion, and dark energy balance out determines where the universe is headed."}
     ]}
  ]},
  {title:"Astrophysics Lab", subLevels:[
    {title:"Reading spectra", teach:{title:"Spectra tell a story", text:"A spectrum's pattern of dark lines reveals a star or galaxy's composition, temperature, and motion. Shifted lines (redshift or blueshift) reveal whether something is moving away from or toward us."},
     quiz:[
       {q:"Spectral lines shifted toward red (redshifted) generally indicate an object is...", options:["Moving toward us","Moving away from us","Not moving","Getting brighter"], correct:1, explain:"Redshift stretches light toward longer wavelengths as an object recedes from us."},
       {q:"If a star's spectral lines show no shift at all, what does that suggest?", options:["It is moving away rapidly","It is moving toward us rapidly","It has little to no motion toward or away from us","It has no composition"], correct:2, explain:"An unshifted spectrum suggests little relative motion along our line of sight."}
     ]},
    {title:"Orbital calculations", teach:{title:"Calculating orbits", text:"Using gravity and Kepler's laws, astronomers can calculate a planet or star's orbital period, speed, and distance just from careful observations of its motion over time."},
     quiz:[
       {q:"What can astronomers calculate using Kepler's laws and careful observation?", options:["A star's exact color only","A planet or star's orbital period, speed and distance","Only a planet's temperature","Nothing useful"], correct:1, explain:"Kepler's laws let astronomers derive orbital period, speed and distance from observed motion."},
       {q:"What generally happens to an orbiting object's speed as it gets closer to the object it orbits?", options:["It slows down","It speeds up","It stays exactly constant","It stops entirely"], correct:1, explain:"Gravity pulls harder at closer range, accelerating the orbiting object."}
     ]},
    {title:"Stellar calculations", teach:{title:"Calculating a star's properties", text:"By combining a star's brightness, distance, and spectrum, astronomers can calculate its true luminosity, temperature, and even its approximate age and future evolution."},
     quiz:[
       {q:"What three key measurements help astronomers calculate a star's properties?", options:["Color, sound, and shape","Brightness, distance, and spectrum","Only its name","Only its magnetic field"], correct:1, explain:"Combining these three measurements reveals a star's true physical properties."},
       {q:"What can knowing a star's mass and current phase help predict?", options:["Nothing useful","Its likely future evolution and eventual fate","Its favorite constellation","Its exact birthday"], correct:1, explain:"Mass and evolutionary phase are the key inputs for predicting a star's future."}
     ]},
    {title:"Exoplanet data", teach:{title:"Reading a transit light curve", text:"A dip in a star's brightness over time — a light curve — can reveal an orbiting exoplanet: its depth hints at the planet's size, and how often it repeats reveals its orbital period."},
     quiz:[
       {q:"In a transit light curve, what does the depth of the dip mainly tell you?", options:["The planet's distance from Earth","The planet's approximate size","The planet's atmosphere composition","The star's age"], correct:1, explain:"A bigger planet blocks more starlight, producing a deeper dip."},
       {q:"What does the repeating interval between dips in a light curve reveal?", options:["The planet's color","The planet's orbital period","The star's exact mass","The planet's atmosphere"], correct:1, explain:"The spacing between successive dips reveals the planet's orbital period."}
     ]},
    {title:"Galaxy rotation curves", teach:{title:"Curves that reveal invisible mass", text:"Plotting how fast stars orbit at different distances from a galaxy's center produces a rotation curve. If it stays flat instead of dropping off at large radii, that's strong evidence for unseen mass — dark matter."},
     quiz:[
       {q:"A flat (non-declining) galaxy rotation curve at large radii is evidence for...", options:["A shrinking galaxy","Dark matter","No gravity at the edges","A collapsing star"], correct:1, explain:"Stars orbiting faster than visible mass predicts points to unseen dark matter."},
       {q:"What would a normal rotation curve do at large radii if only visible matter were present?", options:["Stay perfectly flat","Decline, since less visible mass is out there","Increase sharply","Reverse direction"], correct:1, explain:"Without dark matter, rotation speed should drop off with distance from the galaxy's center."}
     ]},
    {title:"Hypothesis testing", teach:{title:"Thinking like a scientist", text:"Good hypothesis testing means proposing an explanation, then checking it carefully against the data — and being willing to revise or reject it if the evidence doesn't fit. That mindset is the real engine of scientific progress."},
     quiz:[
       {q:"What is the core idea behind good hypothesis testing?", options:["Only accept data that confirms your idea","Propose an explanation, then check it against evidence and revise if needed","Avoid making any predictions","Rely only on intuition"], correct:1, explain:"Science progresses by testing ideas against evidence and adjusting when they don't fit."},
       {q:"What should a scientist do if new data contradicts their hypothesis?", options:["Ignore the new data","Hide the data from others","Reconsider and potentially revise the hypothesis","Assume the data must be fake"], correct:2, explain:"Good science means updating hypotheses to fit evidence, not forcing evidence to fit a hypothesis."}
     ]}
  ]}
,
  {title:"Space Missions & Exploration", subLevels:[
    {title:"Robotic Explorers", teach:{title:"Robots go first", text:"Before humans ever travel somewhere new in space, robotic probes and rovers usually go first. They can survive extreme conditions, travel for decades, and don't need food, air, or a way home — making them ideal scouts for the solar system."},
     quiz:[
       {q:"Why do robotic probes typically explore before humans?", options:["They are more curious than humans","They can survive extreme conditions and don't need to return home","They are cheaper to build than any other spacecraft","Robots are required by international law"], correct:1, explain:"Robotic probes can endure harsh environments and one-way trips that would be far riskier for humans."},
       {q:"Which of these is an example of a robotic rover?", options:["Apollo 11", "Curiosity", "The International Space Station", "Hubble Space Telescope"], correct:1, explain:"Curiosity is a robotic rover that has been exploring the surface of Mars since 2012."},
       {q:"What is one major advantage robotic missions have over crewed missions?", options:["They can think creatively like humans","They don't require life support systems", "They always cost more", "They can only orbit, never land"], correct:1, explain:"Without needing air, food, or water, robotic missions can be lighter, cheaper, and go farther."}
     ]},
    {title:"Human Spaceflight", teach:{title:"Sending people to space", text:"Human spaceflight requires solving enormous challenges: life support, radiation shielding, food and water, and a safe return to Earth. From the first orbital flights to the Moon landings to today's International Space Station, keeping astronauts alive and productive in space remains one of engineering's toughest tests."},
     quiz:[
       {q:"What is one major challenge unique to human spaceflight (compared to robotic missions)?", options:["Needing to carry life support systems", "Needing electricity", "Needing to reach orbit", "Needing radio communication"], correct:0, explain:"Astronauts need air, food, water, and protection — none of which robotic probes require."},
       {q:"Which mission first landed humans on the Moon?", options:["Apollo 8", "Apollo 11", "Gemini 4", "Voyager 1"], correct:1, explain:"Apollo 11 landed the first humans on the Moon in July 1969."},
       {q:"What is the International Space Station (ISS) primarily used for?", options:["Launching satellites only", "A permanently crewed research laboratory in orbit", "Refueling deep space probes", "Housing space tourists exclusively"], correct:1, explain:"The ISS is a continuously staffed orbital laboratory for scientific research in microgravity."}
     ]},
    {title:"Space Telescopes in Depth", teach:{title:"Eyes above the atmosphere", text:"Space telescopes like Hubble and the James Webb Space Telescope orbit above Earth's distorting atmosphere, capturing extraordinarily sharp images across different wavelengths of light — visible, infrared, and beyond — revealing details ground telescopes simply cannot see."},
     quiz:[
       {q:"What key advantage do space telescopes have over ground-based telescopes?", options:["They are always bigger", "They avoid atmospheric distortion", "They are cheaper to build", "They can be repaired more easily"], correct:1, explain:"Being above the atmosphere avoids the blurring effect that limits ground-based telescopes."},
       {q:"What type of light does the James Webb Space Telescope primarily observe?", options:["X-rays", "Infrared light", "Radio waves", "Gamma rays"], correct:1, explain:"JWST is optimized to observe infrared light, letting it see through dust and detect very distant, redshifted objects."},
       {q:"Why is infrared observation especially useful for studying the early universe?", options:["Infrared light travels faster than visible light", "Light from very distant objects gets redshifted into infrared wavelengths", "Infrared light is brighter than visible light", "Only infrared light exists in deep space"], correct:1, explain:"As the universe expands, light from distant galaxies stretches toward longer, infrared wavelengths."}
     ]},
    {title:"Mars Exploration", teach:{title:"Humanity's fascination with Mars", text:"Mars has been visited by more robotic missions than any other planet besides Earth. Orbiters, landers, and rovers have mapped its surface, studied its thin atmosphere, and searched for signs that the Red Planet once had — or still has — the right conditions for life."},
     quiz:[
       {q:"Why has Mars received so much exploration attention?", options:["It has an identical atmosphere to Earth", "Evidence suggests it may have once had liquid water and conditions for life", "It is the closest planet to the Sun", "It has no gravity, making landing easy"], correct:1, explain:"Signs of ancient rivers and lakebeds make Mars a prime target in the search for past habitability."},
       {q:"What do Mars rovers primarily search for evidence of?", options:["Active volcanoes", "Past or present conditions suitable for life", "Alien cities", "Magnetic pole reversals"], correct:1, explain:"Rovers analyze rocks and soil for clues about water history and potential past habitability."},
       {q:"What is a major challenge for future human missions to Mars?", options:["Mars has too much gravity to land on", "The long transit time and radiation exposure", "Mars is too close to the Sun", "Mars has no solid surface"], correct:1, explain:"A Mars trip takes months each way, exposing astronauts to significant radiation and other risks."}
     ]},
    {title:"The Outer Solar System Missions", teach:{title:"Voyagers to the edge", text:"Missions like Voyager 1 and 2, Cassini, New Horizons, and Juno have journeyed to the outer solar system, revealing detailed views of the gas giants, their moons, and even Pluto — some of these spacecraft have now left the solar system entirely."},
     quiz:[
       {q:"What did the Voyager missions achieve that few other spacecraft have?", options:["They landed on Jupiter", "They traveled beyond the solar system into interstellar space", "They orbited the Sun faster than light", "They returned samples from Saturn's rings"], correct:1, explain:"Voyager 1 and 2 are now in interstellar space, farther from Earth than any other human-made object."},
       {q:"Which mission gave humanity its first close-up images of Pluto?", options:["Cassini", "New Horizons", "Juno", "Voyager 2"], correct:1, explain:"New Horizons flew past Pluto in 2015, capturing the first detailed images of its surface."},
       {q:"What did the Cassini mission study in detail?", options:["Mars' polar ice caps", "Saturn and its moons and rings", "The Sun's corona", "Earth's magnetosphere"], correct:1, explain:"Cassini spent over a decade orbiting Saturn, studying its rings, atmosphere, and moons like Titan and Enceladus."}
     ]},
    {title:"The Future of Space Exploration", teach:{title:"What comes next", text:"Future space exploration plans include returning humans to the Moon, eventually sending crewed missions to Mars, building larger space telescopes, and increasingly relying on private companies working alongside space agencies to push exploration further and more often."},
     quiz:[
       {q:"What is a defining trend in modern space exploration?", options:["Only government agencies are involved", "Private companies increasingly partner with space agencies", "All missions are now fully robotic", "Space exploration has stopped growing"], correct:1, explain:"Commercial companies now play a major role alongside traditional space agencies in launches and exploration."},
       {q:"What is one motivation for returning humans to the Moon in coming years?", options:["To abandon Mars exploration entirely", "To test technologies and strategies useful for future Mars missions", "Because the Moon has never been visited before", "To replace all robotic missions"], correct:1, explain:"The Moon serves as a practical testing ground for technology and techniques needed for deeper space missions."},
       {q:"Why might larger, more advanced space telescopes be built in the future?", options:["To replace the need for rockets", "To see fainter, more distant objects and gather more detailed data", "Because current telescopes are too small to see the Moon", "To communicate directly with other star systems"], correct:1, explain:"Bigger, more sensitive telescopes let astronomers observe fainter and more distant cosmic objects."}
     ]}
  ]},
  {title:"Astrobiology & the Search for Life", subLevels:[
    {title:"What Makes a Planet Habitable", teach:{title:"Ingredients for life as we know it", text:"A habitable planet generally needs liquid water, a stable energy source, the right temperature range, and a suitable atmosphere. These conditions depend on a planet's distance from its star, its size, and its composition."},
     quiz:[
       {q:"Which factor is generally considered essential for habitability as we understand it?", options:["A thick layer of clouds", "The presence of liquid water", "A large number of moons", "Strong volcanic activity"], correct:1, explain:"Liquid water is considered a key ingredient for life as we currently understand it."},
       {q:"What role does a planet's distance from its star play in habitability?", options:["It has no effect on habitability", "It helps determine surface temperature and whether water can stay liquid", "It only affects the planet's color", "It determines the planet's mass"], correct:1, explain:"A planet's orbital distance strongly influences whether it's warm enough — but not too warm — for liquid water."},
       {q:"Why is a stable atmosphere important for habitability?", options:["It has no real importance", "It can help regulate temperature and protect the surface from harmful radiation", "It only matters for gas giants", "It prevents a planet from having gravity"], correct:1, explain:"A stable atmosphere helps moderate temperature and can shield the surface from radiation."}
     ]},
    {title:"Extremophiles on Earth", teach:{title:"Life in the harshest places", text:"Extremophiles are organisms on Earth that thrive in conditions once thought impossible for life — deep-sea hydrothermal vents, acidic hot springs, and even inside solid rock. They expand scientists' ideas about where life might exist elsewhere in the universe."},
     quiz:[
       {q:"What are extremophiles?", options:["Organisms that can only survive in mild, Earth-like conditions", "Organisms that thrive in extreme environments", "A type of exoplanet", "A category of space telescope"], correct:1, explain:"Extremophiles survive and even thrive in conditions like extreme heat, cold, acidity, or pressure."},
       {q:"Why are extremophiles important to astrobiology?", options:["They prove aliens exist", "They expand our understanding of where life might survive elsewhere", "They are found only on Mars", "They disprove the need for liquid water"], correct:1, explain:"By showing life can survive in extreme conditions, extremophiles broaden the search for life beyond Earth."},
       {q:"Where might extremophile-like organisms be searched for elsewhere in the solar system?", options:["Only on planets identical to Earth", "In extreme environments like subsurface oceans on icy moons", "Only in the asteroid belt", "Only inside the Sun"], correct:1, explain:"Hidden oceans beneath icy moons could offer extreme but potentially life-supporting conditions."}
     ]},
    {title:"Ocean Worlds", teach:{title:"Hidden oceans beyond Earth", text:"Some moons in our solar system, like Europa (orbiting Jupiter) and Enceladus and Titan (orbiting Saturn), are thought to hide vast liquid oceans beneath icy surfaces — making them some of the most exciting targets in the search for life."},
     quiz:[
       {q:"What is believed to lie beneath the icy surface of Europa?", options:["A solid metal core with no water", "A vast liquid ocean", "An empty cavity", "A thick layer of gas"], correct:1, explain:"Europa is thought to hide a large liquid water ocean beneath its icy crust."},
       {q:"Which moon of Saturn is known for geysers erupting from its icy surface?", options:["Titan", "Enceladus", "Mimas", "Io"], correct:1, explain:"Enceladus shoots plumes of water vapor and ice particles from its south pole, hinting at a subsurface ocean."},
       {q:"What makes Titan unique among the solar system's moons?", options:["It has lakes and rivers made of liquid methane", "It has no atmosphere at all", "It is the only moon closer to the Sun than Mercury", "It orbits the Sun independently of Saturn"], correct:0, explain:"Titan has a thick atmosphere and stable liquid methane/ethane lakes on its surface — a unique feature among moons."}
     ]},
    {title:"SETI & the Search for Signals", teach:{title:"Listening for a message", text:"SETI, the Search for Extraterrestrial Intelligence, uses radio telescopes to scan the sky for signals that might indicate an intelligent civilization elsewhere. So far, no confirmed signal has been found, but the search continues to expand with more sensitive instruments."},
     quiz:[
       {q:"What does SETI primarily search for?", options:["Fossils on Mars", "Radio signals that might indicate intelligent life elsewhere", "New exoplanets using the transit method", "Gravitational waves"], correct:1, explain:"SETI scans radio frequencies, hoping to detect a signal produced by an intelligent civilization."},
       {q:"Has SETI confirmed detection of an extraterrestrial signal so far?", options:["Yes, multiple confirmed signals", "No confirmed signal has been found yet", "Yes, but only from within our solar system", "SETI does not actually search for signals"], correct:1, explain:"Despite decades of searching, no confirmed extraterrestrial signal has been detected."},
       {q:"Why might searching for radio signals be a reasonable strategy in the search for intelligent life?", options:["Radio waves travel through space and can carry information over vast distances", "Radio waves are the only type of wave that exists", "All civilizations are assumed to use radio only", "Radio waves are visible to the naked eye"], correct:0, explain:"Radio waves can travel efficiently across interstellar distances, making them a practical signal to search for."}
     ]},
    {title:"The Drake Equation", teach:{title:"Estimating our cosmic company", text:"The Drake Equation is a famous formula that estimates the number of potentially communicating civilizations in our galaxy, by multiplying factors like the rate of star formation, the fraction of stars with planets, and the likelihood life develops intelligence and communicates."},
     quiz:[
       {q:"What is the general purpose of the Drake Equation?", options:["To calculate the exact age of the universe", "To estimate the number of communicating civilizations that might exist in our galaxy", "To measure a star's exact distance", "To calculate a planet's orbital period"], correct:1, explain:"The Drake Equation combines several factors to estimate how many civilizations might be detectable."},
       {q:"Is the Drake Equation considered a precise scientific measurement?", options:["Yes, its result is exact and proven", "No, it's a framework for organizing assumptions, with highly uncertain inputs", "Yes, because it uses only observed data", "No, it has been disproven entirely"], correct:1, explain:"Many of its factors remain highly uncertain, making it more a thought framework than a precise calculation."},
       {q:"Which of these is a factor typically included in the Drake Equation?", options:["The exact mass of every star", "The fraction of planets that could support life", "The color of a galaxy", "The temperature of the CMB"], correct:1, explain:"The equation includes factors like the fraction of planets capable of supporting life."}
     ]},
    {title:"Fermi Paradox", teach:{title:"Where is everybody?", text:"The Fermi Paradox highlights a strange tension: given the vast number of stars and potentially habitable planets in the galaxy, why haven't we found any clear evidence of other intelligent civilizations? Scientists have proposed many possible explanations, but no one knows for certain."},
     quiz:[
       {q:"What core question does the Fermi Paradox raise?", options:["Why the universe is expanding", "Why we haven't detected evidence of other intelligent civilizations, despite the odds suggesting they should exist", "Why stars form in clusters", "Why Mars has no atmosphere"], correct:1, explain:"Given the galaxy's vast scale, the paradox questions why intelligent life seems apparently absent or undetected."},
       {q:"Has the Fermi Paradox been definitively resolved?", options:["Yes, scientists agree on one explanation", "No, it remains an open and debated question", "Yes, because aliens have been found", "No, because the question doesn't make sense"], correct:1, explain:"Many hypotheses exist, but no single explanation has been confirmed."},
       {q:"Which of these is a commonly proposed possible explanation for the Fermi Paradox?", options:["Intelligent civilizations may be extremely rare or short-lived", "The speed of light doesn't apply in other galaxies", "Aliens are hiding on Earth's Moon", "Stars cannot host planets"], correct:0, explain:"One hypothesis suggests advanced civilizations may be rare, short-lived, or otherwise hard to detect."}
     ]}
  ]},
  {title:"Amateur Astronomy & Sky Watching", subLevels:[
    {title:"Naked-Eye Astronomy", teach:{title:"What you can see without any equipment", text:"You don't need a telescope to start exploring the night sky. With just your eyes, you can spot bright planets, prominent constellations, meteor showers, and even the faint glow of the Milky Way from a dark enough location."},
     quiz:[
       {q:"What can typically be observed with just the naked eye on a clear night?", options:["Detailed surface features of Mars", "Bright planets, constellations, and the Milky Way's glow", "Individual exoplanets", "The rings of Saturn in detail"], correct:1, explain:"Naked-eye astronomy reveals plenty — from bright planets to constellations to the Milky Way in dark skies."},
       {q:"Why is a dark location helpful for naked-eye stargazing?", options:["It has no real effect on visibility", "Reduced light pollution makes faint objects like the Milky Way visible", "Darkness makes stars physically brighter", "It only matters for using telescopes"], correct:1, explain:"Less light pollution allows your eyes to pick up much fainter light from stars and the Milky Way."},
       {q:"Which of these is typically visible to the naked eye?", options:["Individual craters on the Moon's surface", "Bright planets like Venus and Jupiter", "Distant galaxies in fine detail", "Exoplanet transits"], correct:1, explain:"Bright planets like Venus and Jupiter are often visible as steady, bright points of light without any equipment."}
     ]},
    {title:"Using a Telescope", teach:{title:"Getting started with a telescope", text:"A telescope collects and focuses light, letting you see fainter and more detailed views of the Moon, planets, star clusters, and galaxies. Learning to align, focus, and steadily track objects makes a huge difference in what you can observe."},
     quiz:[
       {q:"What is the main function of a telescope?", options:["To create new stars", "To collect and focus light for clearer, more detailed viewing", "To block out light pollution", "To generate its own light source"], correct:1, explain:"A telescope's job is to gather more light and focus it clearly, revealing more detail than the naked eye can see."},
       {q:"Why is properly aligning a telescope important?", options:["It has no real effect on viewing", "It helps you accurately locate and track objects in the sky", "It only matters for photography", "It changes the color of what you see"], correct:1, explain:"Good alignment makes it much easier to find and follow objects as Earth's rotation shifts the sky."},
       {q:"What might beginner stargazers observe well with a basic telescope?", options:["Individual exoplanets in other star systems", "The Moon's craters and bright planets like Jupiter and Saturn", "The exact composition of distant stars", "Black holes directly"], correct:1, explain:"Even modest telescopes reveal wonderful detail on the Moon and bright planets like Jupiter and Saturn."}
     ]},
    {title:"Constellations & Star Charts", teach:{title:"Finding your way among the stars", text:"Constellations are patterns of stars that ancient cultures used to navigate the sky and tell stories. Star charts and apps help modern stargazers locate constellations, planets, and other objects based on their location, date, and time."},
     quiz:[
       {q:"What is a constellation?", options:["A single very bright star", "A recognized pattern of stars in the sky", "A type of telescope", "A distant galaxy"], correct:1, explain:"Constellations are patterns of stars that have been recognized and named across cultures and history."},
       {q:"What can a star chart help you do?", options:["Predict the weather", "Locate stars, constellations, and planets visible from your location and time", "Measure the exact temperature of stars", "Calculate a planet's mass"], correct:1, explain:"Star charts (or apps) map the sky based on your location and time to help you find objects."},
       {q:"Why do constellations look different depending on where you are on Earth?", options:["They don't — they look the same everywhere", "Your position and latitude affect which parts of the sky are visible", "Constellations physically move location", "Only professional astronomers can see constellations"], correct:1, explain:"Your latitude and the time of year determine which stars and constellations are visible above the horizon."}
     ]},
    {title:"Meteor Showers", teach:{title:"Watching shooting stars", text:"Meteor showers happen when Earth passes through the debris trail left behind by a comet. As tiny particles burn up in our atmosphere, they create bright, brief streaks of light — often most visible after midnight, away from city lights."},
     quiz:[
       {q:"What typically causes a meteor shower?", options:["A comet colliding with a planet", "Earth passing through debris left behind by a comet", "A distant supernova explosion", "The Moon's gravitational pull"], correct:1, explain:"Meteor showers occur when Earth's orbit carries it through a stream of comet debris."},
       {q:"What causes the bright streak of light seen during a meteor?", options:["The particle exploding in deep space", "Tiny particles burning up as they enter Earth's atmosphere", "Reflected sunlight off a planet", "A satellite passing overhead"], correct:1, explain:"Friction with the atmosphere heats and vaporizes small particles, creating the visible streak."},
       {q:"When are meteor showers often best viewed?", options:["During the day", "After midnight, away from city lights", "Only during a full moon", "Only from the International Space Station"], correct:1, explain:"Darker skies after midnight, away from light pollution, make it easier to spot fainter meteors."}
     ]},
    {title:"Astrophotography Basics", teach:{title:"Capturing the night sky", text:"Astrophotography involves capturing images of stars, planets, and deep-sky objects — often requiring long exposure times to gather enough faint light, along with a stable mount to avoid blurring from Earth's rotation."},
     quiz:[
       {q:"Why do astrophotographers often use long exposure times?", options:["To capture more color detail only", "To gather enough faint light from dim objects", "Because short exposures aren't allowed", "To make the camera lighter"], correct:1, explain:"Long exposures let a camera collect more of the faint light coming from distant objects."},
       {q:"Why is a stable, tracking mount important for astrophotography?", options:["It has no real importance", "It compensates for Earth's rotation, preventing blurry star trails during long exposures", "It only matters for daytime photography", "It changes the color of stars"], correct:1, explain:"Without tracking Earth's rotation, long exposures would blur stars into trails instead of sharp points."},
       {q:"What might a beginner astrophotographer typically start by photographing?", options:["Distant galaxies in immense detail", "The Moon and bright planets", "Black holes directly", "Individual exoplanets"], correct:1, explain:"The Moon and bright planets are relatively easy, rewarding subjects for those just starting out."}
     ]},
    {title:"Light Pollution", teach:{title:"The challenge of city skies", text:"Light pollution from artificial lighting washes out faint stars and the Milky Way, making it much harder to stargaze from cities. Traveling to darker rural areas, or seeking out designated dark-sky locations, dramatically improves what you can see."},
     quiz:[
       {q:"What is light pollution?", options:["Pollution caused by sunlight", "Excess artificial light that obscures the night sky", "A type of space debris", "Radiation from distant stars"], correct:1, explain:"Artificial lighting brightens the night sky, washing out fainter stars and objects."},
       {q:"Why is stargazing generally easier in rural areas compared to cities?", options:["Rural areas have less artificial light, allowing fainter objects to be seen", "Stars are physically closer to rural areas", "Cities have fewer stars overhead", "Rural areas have stronger gravity"], correct:0, explain:"Reduced artificial lighting in rural areas lets your eyes pick up much fainter starlight."},
       {q:"What is a 'dark-sky location'?", options:["A place with no stars visible", "A designated area with minimal light pollution, ideal for stargazing", "Any location during a new moon", "A region with no atmosphere"], correct:1, explain:"Dark-sky locations are protected or remote areas chosen specifically for minimal light pollution."}
     ]}
  ]}
];

routes.learn = function(){
  markVisited('learn');
  const done = state.learnCompleted;
  let nodesHtml = LEARN_LEVELS.map((lvl, i)=>{
    const isDone = done.includes(i);
    const isUnlocked = i===0 || done.includes(i-1) || isDone;

/* =========================================================
   Cosmic Map — visual journey through the Learn path
   ========================================================= */
const MAP_LEVEL_ICONS = ['🌌','☀️','🌍','⭐','💫','🌀','🔭','🪐','🕳️','🌑','💥','🧪','🚀','🧬','✨'];

routes.map = function(){
  const totalSubs = LEARN_LEVELS.reduce((s,l)=>s+l.subLevels.length,0);
  const doneSubs = LEARN_LEVELS.reduce((s,l,i)=>s+(state.subProgress[i]||[]).length,0);
  const overallPct = totalSubs ? Math.round(doneSubs/totalSubs*100) : 0;

  const nodeCount = LEARN_LEVELS.length;
  const nodes = LEARN_LEVELS.map((lvl,i)=>{
    const done = (state.subProgress[i]||[]).length;
    const total = lvl.subLevels.length;
    const completed = state.learnCompleted.includes(i);
    const unlocked = i===0 || state.learnCompleted.includes(i-1) || completed;
    return {i, title:lvl.title, done, total, completed, unlocked};
  });

  // current = first unlocked-but-not-completed level; if all done, park ship at the last node
  let currentIndex = nodes.findIndex(n=>n.unlocked && !n.completed);
  if(currentIndex===-1) currentIndex = nodeCount-1;

  const gapY = 148, topPad = 70, botPad = 90;
  const totalH = topPad + (nodeCount-1)*gapY + botPad;
  const xWave = [18,50,82,50];
  const pos = nodes.map((n,i)=>({x:xWave[i%4], y:topPad+i*gapY}));

  let segmentsSvg = '';
  for(let i=0;i<nodeCount-1;i++){
    const a=pos[i], b=pos[i+1];
    const dy=(b.y-a.y)/2;
    const traveled = nodes[i].completed;
    segmentsSvg += `<path d="M ${a.x} ${a.y} C ${a.x} ${a.y+dy}, ${b.x} ${b.y-dy}, ${b.x} ${b.y}"
      fill="none" stroke="${traveled?'url(#mapPathGrad)':'rgba(255,255,255,0.10)'}" stroke-width="0.9"
      stroke-dasharray="${traveled?'none':'2.2,2.2'}" />`;
  }

  const nodesHtml = nodes.map((n,i)=>{
    const p = pos[i];
    const cls = n.completed ? 'discovered' : (i===currentIndex ? 'current' : (n.unlocked ? 'unlocked' : 'locked'));
    const pct = n.total ? (n.done/n.total) : 0;
    const circumference = 2*Math.PI*30;
    const dashoffset = circumference*(1-pct);
    const icon = n.completed ? '✓' : (n.unlocked ? MAP_LEVEL_ICONS[i%MAP_LEVEL_ICONS.length] : '🔒');
    return `
    <div class="map-node ${cls}" style="left:${p.x}%;top:${p.y}px;" onclick="${n.unlocked?`renderLevelDetail(${i})`:`showToast('Complete earlier levels to unlock this waypoint')`}">
      <div class="map-planet-ring">
        <svg width="66" height="66" viewBox="0 0 66 66">
          <circle class="ring-track" cx="33" cy="33" r="30" fill="none" stroke-width="3"/>
          <circle class="ring-prog" cx="33" cy="33" r="30" fill="none" stroke-width="3"
            stroke-dasharray="${circumference}" stroke-dashoffset="${dashoffset}"/>
        </svg>
        <div class="map-planet">${icon}</div>
      </div>
      <div class="m-label">LV${i+1} · ${n.title}</div>
      <div class="m-sub">${n.done}/${n.total} topics</div>
    </div>`;
  }).join('');

  const shipPos = pos[currentIndex];
  const shipHtml = `
    <div class="map-ship" style="left:${shipPos.x}%;top:${shipPos.y}px;">🛸</div>
    <div class="map-ship-label" style="left:${shipPos.x}%;top:${shipPos.y-46}px;">YOU ARE HERE</div>
  `;

  document.getElementById('view').innerHTML = `
  <div class="wrap fade-in">
    <div class="section-header">
      <div>
        <button class="btn ghost small" onclick="go('learn')" style="margin-bottom:14px;">← Back to Learn</button>
        <div class="eyebrow">Cosmic Map</div>
        <h1 class="page-title">Your Learning Journey</h1>
        <p class="page-sub">Every completed topic lights up a waypoint on the map. Your spacecraft marks exactly where your journey through the cosmos stands right now.</p>
      </div>
    </div>

    <div class="map-stat-row">
      <div class="glass"><div class="num">LV.${getLevel()}</div><div class="lbl">PLAYER LEVEL</div></div>
      <div class="glass"><div class="num">${state.xp}</div><div class="lbl">TOTAL XP</div></div>
      <div class="glass"><div class="num">${doneSubs}/${totalSubs}</div><div class="lbl">TOPICS DISCOVERED</div></div>
      <div class="glass"><div class="num">${overallPct}%</div><div class="lbl">JOURNEY COMPLETE</div></div>
    </div>

    <div class="cosmic-map-wrap" style="height:${totalH}px;">
      <svg class="cosmic-map-svg" viewBox="0 0 100 ${totalH}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="mapPathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#22d3ee"/>
          </linearGradient>
          <linearGradient id="mapRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
        ${segmentsSvg}
      </svg>
      ${nodesHtml}
      ${shipHtml}
    </div>

    <div class="map-legend">
      <span><span class="swatch" style="background:linear-gradient(135deg,var(--good),#0ea5e9);"></span>Discovered</span>
      <span><span class="swatch" style="background:linear-gradient(135deg,var(--violet),var(--cyan));"></span>Current waypoint</span>
      <span><span class="swatch" style="background:var(--panel-solid);border:1px solid var(--border-bright);"></span>Unlocked</span>
      <span><span class="swatch" style="background:rgba(255,255,255,0.05);border:1px dashed var(--border);"></span>Locked</span>
    </div>
  </div>`;
};

/* ---- Teaching + quiz flow for one topic (sub-level) ---- */
function openSubLesson(i, si){
  window._teachCtx = {i, si};
  renderTeachStep();
}
function renderTeachStep(){
  const {i, si} = window._teachCtx;
  const lvl = LEARN_LEVELS[i];
  const sub = lvl.subLevels[si];
  const isDone = (state.subProgress[i]||[]).includes(si);
  openModal(`
    <div class="eyebrow">LEVEL ${i+1} · TOPIC ${si+1} OF ${lvl.subLevels.length}</div>
    <h2>${sub.teach.title}</h2>
    <div class="m-sub">${lvl.title} · ${sub.title}</div>
    <div class="m-body fade-in">${sub.teach.text}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;">
      ${isDone ? `<span style="color:var(--good);font-size:13px;font-weight:600;">✓ Topic already completed</span>` :
      `<button class="btn" onclick="startQuiz()">Start Quick Check · ${sub.quiz.length} Questions →</button>`}
    </div>
  `);
}

function startQuiz(){
  window._quizState = {index:0, correct:0};
  renderQuizStep();
}
function renderQuizStep(){
  const {i, si} = window._teachCtx;
  const sub = LEARN_LEVELS[i].subLevels[si];
  const qs = window._quizState;
  const q = sub.quiz[qs.index];
  const scoreDots = sub.quiz.map((_,d)=>`<span style="width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;background:${d<qs.index?'var(--good)':(d===qs.index?'var(--cyan)':'rgba(255,255,255,0.15)')};"></span>`).join('');
  openModal(`
    <div class="eyebrow">LEVEL ${i+1} · ${sub.title} · Q${qs.index+1} OF ${sub.quiz.length}</div>
    <h2>${sub.title}</h2>
    <div style="margin-bottom:14px;">${scoreDots}</div>
    <div class="quiz-q fade-in">
      <p>${q.q}</p>
      ${q.options.map((opt,oi)=>`<button class="quiz-opt" id="qo${oi}" onclick="answerQuiz(${oi})">${opt}</button>`).join('')}
    </div>
    <div id="quizExplain"></div>
  `);
}
function answerQuiz(oi){
  const {i, si} = window._teachCtx;
  const sub = LEARN_LEVELS[i].subLevels[si];
  const qs = window._quizState;
  const q = sub.quiz[qs.index];
  q.options.forEach((opt,o2)=>{
    const el = document.getElementById('qo'+o2);
    el.onclick = null;
    if(o2===q.correct) el.classList.add('correct');
    else if(o2===oi) el.classList.add('wrong');
  });
  const isCorrect = oi===q.correct;
  if(isCorrect) qs.correct++;
  const isLastQ = qs.index+1 >= sub.quiz.length;
  document.getElementById('quizExplain').innerHTML = `
    <div class="mystery-feedback fade-in" style="margin-top:14px;border-color:${isCorrect?'rgba(52,211,153,0.35)':'rgba(248,113,113,0.35)'};background:${isCorrect?'rgba(52,211,153,0.08)':'rgba(248,113,113,0.08)'};">
      <strong style="color:${isCorrect?'var(--good)':'var(--danger)'}">${isCorrect?'✅ Correct.':'❌ Not quite.'}</strong> ${q.explain||''}
    </div>
    <button class="btn small" style="margin-top:14px;" onclick="advanceQuiz()">${isLastQ ? 'See results →' : 'Next question →'}</button>
  `;
}
function advanceQuiz(){
  const {i, si} = window._teachCtx;
  const sub = LEARN_LEVELS[i].subLevels[si];
  const qs = window._quizState;
  qs.index++;
  if(qs.index < sub.quiz.length){ renderQuizStep(); }
  else { finishQuiz(); }
}
function finishQuiz(){
  const {i, si} = window._teachCtx;
  const sub = LEARN_LEVELS[i].subLevels[si];
  const qs = window._quizState;
  const pct = Math.round(qs.correct/sub.quiz.length*100);
  const already = (state.subProgress[i]||[]).includes(si);
  openModal(`
    <div class="eyebrow">${sub.title} · RESULTS</div>
    <h2>${pct>=80?'🌟 Excellent work!':pct>=50?'👍 Good progress!':'🔁 Worth a revisit'}</h2>
    <div class="m-sub">${LEARN_LEVELS[i].title}</div>
    <div class="m-body">You got <strong style="color:var(--cyan)">${qs.correct} / ${sub.quiz.length}</strong> correct (${pct}%).</div>
    <button class="btn" onclick="finalizeSub()">${already? 'Continue' : 'Claim XP & Continue'} →</button>
  `);
}
function finalizeSub(){
  const {i, si} = window._teachCtx;
  const lvl = LEARN_LEVELS[i];
  const sub = lvl.subLevels[si];
  const qs = window._quizState;
  if(!state.subProgress[i]) state.subProgress[i] = [];
  const alreadyDone = state.subProgress[i].includes(si);
  if(!alreadyDone){
    state.subProgress[i].push(si);
    saveState();
    addXP(15 + qs.correct*8, `${sub.title}`);
    if(state.subProgress[i].length >= lvl.subLevels.length && !state.learnCompleted.includes(i)){
      state.learnCompleted.push(i);
      saveState();
      setTimeout(()=>addXP(60, `${lvl.title} level complete`), 500);
    }
  }
  closeModal();
  renderLevelDetail(i);
}
