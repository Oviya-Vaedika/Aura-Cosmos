  }
  resize();
  const ctx = canvas.getContext('2d');

  orbitRush = {
    canvas, ctx, wrap, dpr,
    running:false, gameOver:true, t:0, distance:0, score:0, combo:1, comboTimer:0,
    ship:{x:0.5, y:0.75, vx:0, vy:0, hull:100, fuel:100, shieldCharges:3, shieldActive:false, shieldCooldown:0, invuln:0},
    asteroids:[], planets:[], particles:[], stars:[],
    spawnTimer:0, planetTimer:2.5,
    keys:{}, boostHeld:false, shieldHeld:false,
    pointerActive:false, pointerTarget:null,
    inputMode: isTouchPrimary() ? 'mobile' : 'desktop',
    raf:null
  };
  for(let i=0;i<80;i++){
    orbitRush.stars.push({x:Math.random(), y:Math.random(), r:Math.random()*1.3+0.3, s:Math.random()*0.4+0.15});
  }

  orbitRush.onResize = resize;
  window.addEventListener('resize', orbitRush.onResize);

  orbitRush.onKeyDown = (e)=>{
    orbitRush.keys[e.key.toLowerCase()] = true;
    if(e.code==='Space'){ orbitRush.boostHeld = true; e.preventDefault(); }
    if(e.key==='Shift'){ orbitRush.shieldHeld = true; }
  };
  orbitRush.onKeyUp = (e)=>{
    orbitRush.keys[e.key.toLowerCase()] = false;
    if(e.code==='Space') orbitRush.boostHeld = false;
    if(e.key==='Shift') orbitRush.shieldHeld = false;
  };
  window.addEventListener('keydown', orbitRush.onKeyDown);
  window.addEventListener('keyup', orbitRush.onKeyUp);

  function localPoint(e){
    const rect = wrap.getBoundingClientRect();
    return {x:(e.clientX-rect.left)/rect.width, y:(e.clientY-rect.top)/rect.height};
  }
  orbitRush.onPointerDown = (e)=>{
    if(e.target.closest && e.target.closest('.orbit-btn')) return;
    orbitRush.pointerActive = true;
    orbitRush.pointerTarget = localPoint(e);
  };
  orbitRush.onPointerMove = (e)=>{
    if(!orbitRush.pointerActive) return;
    orbitRush.pointerTarget = localPoint(e);
  };
  orbitRush.onPointerUp = ()=>{ orbitRush.pointerActive = false; };
  wrap.addEventListener('pointerdown', orbitRush.onPointerDown);
  wrap.addEventListener('pointermove', orbitRush.onPointerMove);
  wrap.addEventListener('pointerup', orbitRush.onPointerUp);
  wrap.addEventListener('pointercancel', orbitRush.onPointerUp);

  const boostBtn = document.getElementById('orBoostBtn');
  const shieldBtn = document.getElementById('orShieldBtn');
  const setBoost = (v)=>{ orbitRush.boostHeld = v; boostBtn.classList.toggle('active', v); };
  const setShield = (v)=>{ orbitRush.shieldHeld = v; shieldBtn.classList.toggle('active', v); };
  ['pointerdown'].forEach(ev=>{
    boostBtn.addEventListener(ev, (e)=>{ e.preventDefault(); e.stopPropagation(); setBoost(true); });
    shieldBtn.addEventListener(ev, (e)=>{ e.preventDefault(); e.stopPropagation(); setShield(true); });
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
    boostBtn.addEventListener(ev, ()=>setBoost(false));
    shieldBtn.addEventListener(ev, ()=>setShield(false));
  });

  showOrbitIntro();

  function frame(ts){
    orbitRush.raf = requestAnimationFrame(frame);
    orStep(ts);
    orDraw();
  }
  orbitRush.raf = requestAnimationFrame(frame);
}

function showOrbitIntro(){
  const wrap = document.getElementById('orbitWrap');
  const overlay = document.createElement('div');
  overlay.className = 'orbit-overlay';
  overlay.id = 'orbitOverlay';
  overlay.innerHTML = `
    <h3>🛸 Ready to launch?</h3>
    <p>Dodge asteroids, slingshot around planets for bonus speed, and manage limited fuel and shields. Difficulty climbs the longer you survive.</p>
    <button class="btn" onclick="startOrbitRush()">🚀 Launch</button>
  `;
  wrap.appendChild(overlay);
}

function startOrbitRush(){
  if(!orbitRush) return;
  const overlay = document.getElementById('orbitOverlay');
  if(overlay) overlay.remove();
  Object.assign(orbitRush, {
    running:true, gameOver:false, t:0, distance:0, score:0, combo:1, comboTimer:0,
    ship:{x:0.5, y:0.75, vx:0, vy:0, hull:100, fuel:100, shieldCharges:3, shieldActive:false, shieldCooldown:0, invuln:1.2},
    asteroids:[], planets:[], particles:[], spawnTimer:0, planetTimer:2.5,
    inputMode: isTouchPrimary() ? 'mobile' : 'desktop'
  });
}

function orDifficulty(){
  // scales smoothly with survival time (seconds)
  const t = orbitRush.t;
  return {
    spawnInterval: Math.max(0.28, 1.05 - t*0.006),
    asteroidSpeed: 0.16 + Math.min(0.22, t*0.0022),
    asteroidSizeVariance: Math.min(1, 0.4 + t*0.01)
  };
}

function orStep(ts){
  if(!orbitRush) return;
  const dt = Math.min(0.05, orbitRush._lastTs ? (ts-orbitRush._lastTs)/1000 : 0.016);
  orbitRush._lastTs = ts;
  if(!orbitRush.running) return;

  const o = orbitRush;
  o.t += dt;
  o.distance += dt * (40 + o.combo*4);
  o.comboTimer -= dt;
  if(o.comboTimer<=0 && o.combo>1){ o.combo = Math.max(1, o.combo-1); o.comboTimer = 3; }

  const ship = o.ship;
  const accel = 1.7;
  let ax=0, ay=0;

  if(o.inputMode==='desktop' || (!o.pointerActive)){
    if(o.keys['arrowleft']||o.keys['a']) ax -= 1;
    if(o.keys['arrowright']||o.keys['d']) ax += 1;
    if(o.keys['arrowup']||o.keys['w']) ay -= 1;
    if(o.keys['arrowdown']||o.keys['s']) ay += 1;
    ship.vx += ax*accel*dt;
    ship.vy += ay*accel*dt;
    ship.vx *= 0.92; ship.vy *= 0.92;
  }
  if(o.pointerActive && o.pointerTarget){
    ship.x += (o.pointerTarget.x - ship.x) * Math.min(1, dt*8);
    ship.y += (o.pointerTarget.y - ship.y) * Math.min(1, dt*8);
    ship.vx *= 0.8; ship.vy *= 0.8;
  } else {
    ship.x += ship.vx*dt;
    ship.y += ship.vy*dt;
  }

  // boost
  if(o.boostHeld && ship.fuel>0){
    const boostDir = (o.pointerActive && o.pointerTarget) ? {x:(o.pointerTarget.x-ship.x), y:(o.pointerTarget.y-ship.y)} : {x:ax, y:ay-0.6};
    const mag = Math.hypot(boostDir.x, boostDir.y)||1;
    ship.x += (boostDir.x/mag) * 0.55 * dt;
    ship.y += (boostDir.y/mag) * 0.55 * dt;
    ship.fuel = Math.max(0, ship.fuel - dt*38);
  } else {
    ship.fuel = Math.min(100, ship.fuel + dt*9);
  }

  // shield
  if(o.shieldHeld && ship.shieldCharges>0 && ship.shieldCooldown<=0){
    ship.shieldActive = true;
  } else if(!o.shieldHeld){
    ship.shieldActive = false;
  }
  if(ship.shieldCooldown>0) ship.shieldCooldown -= dt;

  ship.x = Math.max(0.04, Math.min(0.96, ship.x));
  ship.y = Math.max(0.08, Math.min(0.94, ship.y));
  ship.invuln = Math.max(0, ship.invuln-dt);

  // spawn asteroids
  const diff = orDifficulty();
  o.spawnTimer -= dt;
  if(o.spawnTimer<=0){
    o.spawnTimer = diff.spawnInterval;
    const size = 0.025 + Math.random()*0.05*diff.asteroidSizeVariance;
    o.asteroids.push({
      x: Math.random()*0.9+0.05, y:-0.06, size,
      vx:(Math.random()-0.5)*0.05, vy: diff.asteroidSpeed*(0.8+Math.random()*0.5),
      rot:Math.random()*Math.PI*2, rotSpeed:(Math.random()-0.5)*2, grazed:false
    });
  }
  // spawn planets occasionally
  o.planetTimer -= dt;
  if(o.planetTimer<=0){
    o.planetTimer = 7 + Math.random()*5;
    const side = Math.random()<0.5 ? 0.15 : 0.85;
    o.planets.push({
      x: side + (Math.random()-0.5)*0.08, y:-0.1, size:0.06+Math.random()*0.03,
      vy: 0.09, color: ['#f97316','#38bdf8','#a78bfa','#34d399'][Math.floor(Math.random()*4)],
      pulled:false
    });
  }

  // update asteroids
  o.asteroids.forEach(a=>{
    a.x += a.vx*dt; a.y += a.vy*dt; a.rot += a.rotSpeed*dt;
  });
  o.asteroids = o.asteroids.filter(a=>a.y < 1.15);

  // update planets + gravity pull on ship
  o.planets.forEach(p=>{
    p.y += p.vy*dt;
    const dx = p.x-ship.x, dy = p.y-ship.y;
    const dist = Math.hypot(dx,dy);
    const influenceR = p.size*3.2;
    if(dist < influenceR && dist > p.size*0.9){
      const pull = 0.9*(1-dist/influenceR);
      ship.vx += (dx/dist)*pull*dt;
      ship.vy += (dy/dist)*pull*dt;
      if(!p.pulled && dist < p.size*1.6){
        p.pulled = true;
        orAddScore(60);
        bumpCombo();
      }
    } else if(dist >= influenceR){
      p.pulled = false;
    }
    if(dist < p.size+0.02 && ship.invuln<=0){
      orTakeHit(p.size*260);
    }
  });
  o.planets = o.planets.filter(p=>p.y < 1.2);

  // collisions with asteroids + near-miss combo
  o.asteroids.forEach(a=>{
    const dist = Math.hypot(a.x-ship.x, a.y-ship.y);
    if(dist < a.size+0.028 && ship.invuln<=0){
      orTakeHit(18 + a.size*220);
      a.y = 2; // remove
    } else if(!a.grazed && dist < a.size+0.09){
      a.grazed = true;
      orAddScore(8);
      bumpCombo();
    }
  });

  // particles (boost trail)
  if(o.boostHeld && ship.fuel>0 && Math.random()<0.6){
    o.particles.push({x:ship.x, y:ship.y+0.02, life:0.4, vy:0.3+Math.random()*0.2, vx:(Math.random()-0.5)*0.1});
  }
  o.particles.forEach(pt=>{ pt.life -= dt; pt.x += pt.vx*dt; pt.y += pt.vy*dt; });
  o.particles = o.particles.filter(pt=>pt.life>0);

  // passive score for distance
  o.score = Math.round(o.distance * o.combo * 0.4);

  updateOrbitHud();

  if(ship.hull<=0){
    orEndGame();
  }
}

function bumpCombo(){
  const o = orbitRush;
  o.combo = Math.min(8, o.combo+1);
  o.comboTimer = 3;
  const el = document.getElementById('orComboOut');
  if(el){ el.textContent = `COMBO ×${o.combo}`; el.classList.add('show'); }
}
function orAddScore(pts){
  orbitRush.score += pts;
}
function orTakeHit(dmg){
  const o = orbitRush, ship = o.ship;
  if(ship.shieldActive && ship.shieldCharges>0){
    ship.shieldCharges--;
    ship.shieldActive = false;
    ship.shieldCooldown = 4;
    ship.invuln = 0.6;
    o.combo = 1;
    spawnHitParticles(ship.x, ship.y, '#22d3ee');
    return;
  }
  ship.hull = Math.max(0, ship.hull - dmg);
  ship.invuln = 1.0;
  o.combo = 1;
  spawnHitParticles(ship.x, ship.y, '#f87171');
}
function spawnHitParticles(x,y,color){
  for(let i=0;i<10;i++){
    orbitRush.particles.push({x, y, life:0.5, vy:(Math.random()-0.5)*0.6, vx:(Math.random()-0.5)*0.6, color});
  }
}
function updateOrbitHud(){
  const o = orbitRush;
  const hullEl = document.getElementById('orHullOut');
  const fuelEl = document.getElementById('orFuelOut');
  const shieldEl = document.getElementById('orShieldOut');
  const scoreEl = document.getElementById('orScoreOut');
  if(hullEl) hullEl.textContent = Math.round(o.ship.hull)+'%';
  if(fuelEl) fuelEl.textContent = Math.round(o.ship.fuel)+'%';
  if(shieldEl) shieldEl.textContent = '●'.repeat(o.ship.shieldCharges)+'○'.repeat(3-o.ship.shieldCharges);
  if(scoreEl) scoreEl.textContent = o.score;
}

function orEndGame(){
  const o = orbitRush;
  if(!o || o.gameOver) return;
  o.running = false;
  o.gameOver = true;

  const mode = o.inputMode;
  const scores = state.orbitRushHighScores || {desktop:0, mobile:0};
  const prevBest = scores[mode] || 0;
  const isNewBest = o.score > prevBest;
  if(isNewBest){ scores[mode] = o.score; state.orbitRushHighScores = scores; saveState(); }

  bumpGameLevel('orbitrush');
  if(!state.gamesCompleted.includes('orbitrush')){
    state.gamesCompleted.push('orbitrush'); saveState();
    checkBadges();
  }
  const xpEarned = Math.min(220, 20 + Math.round(o.score/12) + (isNewBest?40:0));
  addXP(xpEarned, isNewBest ? 'Orbit Rush — new high score!' : 'Orbit Rush run complete');

  const wrap = document.getElementById('orbitWrap');
  if(!wrap) return;
  const overlay = document.createElement('div');
  overlay.className = 'orbit-overlay';
  overlay.innerHTML = `
    <h3>${isNewBest ? '🏆 New High Score!' : '💥 Run Complete'}</h3>
    <div class="orbit-scoreboard">
      <div><div class="n">${o.score}</div><div class="l">SCORE</div></div>
      <div><div class="n">×${o.combo}</div><div class="l">FINAL COMBO</div></div>
      <div><div class="n">${Math.round(o.distance)}</div><div class="l">DISTANCE</div></div>
    </div>
    <p>Best on ${mode==='mobile'?'mobile':'desktop'}: ${scores[mode]}. Runs get harder the longer you survive — see how far you can push it.</p>
    <button class="btn" id="orbitReplayBtn">🔁 Fly Again</button>
  `;
  wrap.appendChild(overlay);
  document.getElementById('orbitReplayBtn').addEventListener('click', ()=>{
    overlay.remove();
    startOrbitRush();
  });
}

function orDraw(){
  if(!orbitRush) return;
  const {ctx, canvas, dpr} = orbitRush;
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.save(); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);

  // starfield drifting
  orbitRush.stars.forEach(s=>{
    s.y += s.s*0.002;
    if(s.y>1) s.y=0;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x*w, s.y*h, s.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // planets
  orbitRush.planets.forEach(p=>{
    const px=p.x*w, py=p.y*h, pr=p.size*Math.min(w,h);
    const g = ctx.createRadialGradient(px,py,0,px,py,pr*2.4);
    g.addColorStop(0, p.color+'55'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(px,py,pr*2.4,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.fillStyle=p.color; ctx.fill();
  });

  // asteroids
  orbitRush.asteroids.forEach(a=>{
    const ax=a.x*w, ay=a.y*h, ar=a.size*Math.min(w,h);
    ctx.save();
    ctx.translate(ax,ay); ctx.rotate(a.rot);
    ctx.beginPath();
    for(let i=0;i<7;i++){
      const ang = (i/7)*Math.PI*2;
      const rad = ar*(0.75+Math.sin(i*3.1+a.rot)*0.2);
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle = '#8d6a4d';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
  });

  // particles
  orbitRush.particles.forEach(pt=>{
    ctx.globalAlpha = Math.max(0, pt.life*1.6);
    ctx.beginPath();
    ctx.arc(pt.x*w, pt.y*h, 3, 0, Math.PI*2);
    ctx.fillStyle = pt.color || '#fbbf24';
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // ship
  const ship = orbitRush.ship;
  const sx = ship.x*w, sy = ship.y*h;
  const blink = ship.invuln>0 && Math.floor(orbitRush.t*12)%2===0;
  if(!blink){
    if(ship.shieldActive){
      ctx.beginPath(); ctx.arc(sx,sy,16,0,Math.PI*2);
      ctx.strokeStyle='rgba(34,211,238,0.8)'; ctx.lineWidth=2;
      ctx.shadowColor='rgba(34,211,238,0.8)'; ctx.shadowBlur=10;
      ctx.stroke(); ctx.shadowBlur=0;
    }
    ctx.save();
    ctx.translate(sx,sy);
    const angle = Math.atan2(ship.vy, ship.vx||0.001);
    ctx.rotate((orbitRush.pointerActive||Math.hypot(ship.vx,ship.vy)>0.02) ? angle+Math.PI/2 : 0);
    ctx.beginPath();
    ctx.moveTo(0,-11); ctx.lineTo(8,9); ctx.lineTo(0,4); ctx.lineTo(-8,9);
    ctx.closePath();
    ctx.fillStyle = '#e9e7f7';
    ctx.shadowColor = 'rgba(139,92,246,0.8)'; ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  ctx.restore();
}

(function(){
  const canvas = document.getElementById('starcanvas');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const count = Math.floor((canvas.width*canvas.height)/9000);
    stars = Array.from({length:count}, ()=>({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*1.3+0.2,
      s: Math.random()*0.02+0.005,
      p: Math.random()*Math.PI*2
    }));
  }
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars.forEach(st=>{
      st.p += st.s;
      const alpha = 0.35 + Math.sin(st.p)*0.35;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0,alpha)})`;
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', resize);
  resize(); tick();
})();

  panel.classList.toggle('open');
  if(panel.classList.contains('open') && aiHistory.length===0){
    addAIMessage('ai', `Hey, I'm Dubis 👋 — think of me as your friend on this cosmic journey. Ask me anything, or say "give me a challenge" and I'll test you at your current level (${LEVEL_NAMES[getLevel()-1]}).`);
  }
}
function addAIMessage(role, text){
  const host = document.getElementById('aiMsgs');
  const div = document.createElement('div');
  div.className = `ai-msg ${role}`;
  div.textContent = text;
  host.appendChild(div);
  host.scrollTop = host.scrollHeight;
}
async function sendAI(){
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if(!text) return;
  addAIMessage('user', text);
  input.value='';
  const host = document.getElementById('aiMsgs');
  const typingDiv = document.createElement('div');
  typingDiv.className='ai-msg ai';
  typingDiv.innerHTML = `<span class="typing-dots"><span></span><span></span><span></span></span>`;
  host.appendChild(typingDiv);
  host.scrollTop = host.scrollHeight;

  const reply = await callScientist(text);
  typingDiv.remove();
  addAIMessage('ai', reply);
}

function buildAppKnowledge(){
  const learnList = LEARN_LEVELS.map((l,i)=>`${i+1}. ${l.title} — topics: ${l.subLevels.map(s=>s.title).join(', ')}`).join('\n');
  const exploreList = EXPLORE_MODULES.map(m=>`${m.name} (${m.ready?'live':'coming soon'}): ${m.desc}`).join('\n');
  const gamesList = GAMES.map(g=>`${g.name} (${g.ready?'live':'coming soon'}): ${g.desc}`).join('\n');
  return `AURA COSMOS APP STRUCTURE (use this to give specific, accurate recommendations by name — never invent content that isn't listed here):

LEARN PATH — 12 levels, each broken into topic-sized sub-lessons with their own quiz:
${learnList}

EXPLORE MODULES (interactive simulations):
${exploreList}

ARCADE GAMES (Experience section):
${gamesList}`;
}
function buildUserContext(){
  const completedTitles = state.learnCompleted.map(i=>LEARN_LEVELS[i]?.title).filter(Boolean);
  const discoveries = state.exploreDiscoveries.map(id=>EXPLORE_MODULES.find(m=>m.id===id)?.name || id);
  const gamesDone = state.gamesCompleted.map(id=>GAMES.find(g=>g.id===id)?.name || id);
  const badgesEarned = state.badges.map(id=>BADGES.find(b=>b.id===id)?.name || id);
  return `LEARNER STATUS: Level ${getLevel()} (${LEVEL_NAMES[getLevel()-1]}), ${state.xp} XP, ${state.streak}-day streak.
Completed Learn levels: ${completedTitles.length ? completedTitles.join(', ') : 'none yet'}.
Explore discoveries logged: ${discoveries.length ? discoveries.join(', ') : 'none yet'}.
Arcade games completed: ${gamesDone.length ? gamesDone.join(', ') : 'none yet'}.
Badges earned: ${badgesEarned.length ? badgesEarned.join(', ') : 'none yet'}.
Currently viewing: the ${currentRoute} section of the app.`;
}

function buildReferenceFacts(){
  return `QUICK-REFERENCE FACTS (use these for accuracy — cite naturally, don't just list them):
- Speed of light: ~299,792 km/s. 1 light-year ≈ 9.46 trillion km. 1 AU ≈ 149.6 million km. 1 parsec ≈ 3.26 light-years.
- Sun: G-type main-sequence star, ~4.6 billion years old, surface temp ~5,778 K, core temp ~15 million K, converts ~600 million tons of hydrogen to helium per second.
- Age of the universe: ~13.8 billion years (Planck mission data). Observable universe radius: ~46.5 billion light-years (due to expansion).
- Milky Way: barred spiral, ~100,000-120,000 ly across, ~100-400 billion stars, Sun orbits at ~220 km/s taking ~230 million years per orbit ("galactic year").
- Nearest star system: Alpha Centauri (~4.24 ly, Proxima Centauri closest component). Andromeda Galaxy: ~2.5 million ly away, on a collision course with the Milky Way in ~4-5 billion years.
- Key missions: Hubble (launched 1990), JWST (launched Dec 2021, L2 orbit, infrared), Voyager 1 & 2 (launched 1977, now in interstellar space), Kepler (2009-2018, found 2,600+ confirmed exoplanets), TESS (2018-ongoing), Parker Solar Probe (2018, closest-ever approach to the Sun), New Horizons (Pluto flyby 2015), Cassini (Saturn, 2004-2017), LIGO (first gravitational wave detection 2015, announced 2016).
- Black holes: Event Horizon Telescope produced the first-ever black hole image in 2019 (M87*), and the Milky Way's own Sgr A* in 2022. Stellar-mass black holes form from stars roughly 20+ solar masses; supermassive ones (millions-billions of solar masses) sit at galaxy centers.
- Exoplanets: 5,000+ confirmed as of the mid-2020s, mostly via the transit method (Kepler/TESS) and radial velocity. TRAPPIST-1 has 7 roughly Earth-sized planets, several in the habitable zone.
- Solar system: 8 planets, 5 recognized dwarf planets (Pluto, Eris, Haumea, Makemake, Ceres). Jupiter is the largest planet (~11× Earth's diameter); Mercury is smallest and closest to the Sun.
- Universe composition (Planck data): ~5% ordinary matter, ~27% dark matter, ~68% dark energy.`;
}
function buildExpertiseDomains(){
  return `EXPERTISE DOMAINS you should draw on naturally depending on what's asked: solar system & planetary science; stars, stellar evolution & stellar death; galaxies & large-scale structure; cosmology (Big Bang, inflation, CMB, dark matter/energy, fate of the universe); relativity & extreme astrophysics (black holes, neutron stars, gravitational waves); exoplanets & the search for life; observational techniques & telescopes; the history of astronomy and key discoveries/discoverers; space missions and space exploration, past and present; and basic orbital mechanics and the physics used in the app's simulations (e.g. escape velocity, Kepler's laws, impact energy, transit depth). If asked something outside astronomy/space entirely, you can still help briefly and warmly, but gently steer back toward the learner's cosmic journey when natural.`;
}

/* Dubis talks to our own backend at /api/dubis, which holds the Anthropic API key
   server-side and forwards the request — the key is never exposed to the browser. */
const DUBIS_API_ENDPOINT = '/api/dubis';
const DUBIS_TIMEOUT_MS = 25000;

async function callScientist(userText){
  const systemPrompt = `You are Dubis, the friendly AI companion of Aura Cosmos, an astrophysics learning platform. You're not a stiff lecturer — you're a warm, encouraging friend who happens to know a lot about space, learning alongside the user.

PERSONALITY: Friendly, approachable, supportive — like a knowledgeable friend, not a formal scientist. You explain concepts clearly and simply, give hints rather than immediate full answers when someone is working through a problem, ask good follow-up questions, and calibrate to the learner's current level.

KNOWLEDGE: You have deep, accurate knowledge of astrophysics, astronomy, and space science — real missions, real discoveries, real numbers, and current scientific understanding. When it makes an explanation more vivid or memorable, bring in real missions, real historical moments, or real figures — but always keep it accessible for a beginner-to-intermediate learner, and be upfront about genuine scientific uncertainty rather than overstating confidence.

${buildExpertiseDomains()}

${buildReferenceFacts()}

APP AWARENESS: You know this app inside and out (full structure below). When someone asks what to do next, what's in a section, or for a recommendation, answer specifically using real level/module/game names from the list — never invent content that isn't listed. Suggest the learner's logical next step based on their progress when it's helpful. If a simulation's readouts or a quiz question come up in conversation, feel free to explain the underlying physics in more depth than the app itself shows.

${buildAppKnowledge()}

${buildUserContext()}

STYLE: Keep replies concise by default: 2-5 sentences, unless the learner clearly wants a deeper explanation or asks a multi-part question — then take the room you need. Never use markdown formatting like asterisks or headers.`;

  aiHistory.push({role:'user', content:userText});

  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), DUBIS_TIMEOUT_MS);

  try{
    const response = await fetch(DUBIS_API_ENDPOINT, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      signal: controller.signal,
      body: JSON.stringify({
        system: systemPrompt,
        messages: aiHistory.slice(-14)
      })
    });
    clearTimeout(timeoutId);

    if(!response.ok){
      let serverMsg = '';
      try{ const errBody = await response.json(); serverMsg = errBody.error || ''; }catch(e){}
      aiHistory.pop(); // don't keep a user turn that never got a real reply
      if(response.status === 429){
        return "Dubis is getting a lot of questions right now — give it a few seconds and try again.";
      }
      if(response.status >= 500){
        return "Dubis's backend is having trouble reaching mission control right now. Please try again shortly.";
      }
      return serverMsg ? `Dubis hit a snag: ${serverMsg}` : "Something went wrong reaching Dubis — please try again.";
    }

    const data = await response.json();
    const reply = data.reply || "I couldn't quite process that — try asking again.";
    aiHistory.push({role:'assistant', content: reply});
    return reply;
  }catch(e){
    clearTimeout(timeoutId);
    aiHistory.pop();
    if(e.name === 'AbortError'){
      return "That's taking longer than expected — Dubis's connection may be slow. Please try again.";
    }
    return "Dubis's connection to the backend failed — check that the server is running and you're online, then try again.";
  }
}


function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* =========================================================
   Init
   ========================================================= */
function checkStreak(){
  const today = new Date().toDateString();
  if(state.lastVisit !== today){
    const yesterday = new Date(Date.now()-86400000).toDateString();
    state.streak = (state.lastVisit === yesterday) ? state.streak+1 : 1;
    state.lastVisit = today;
    saveState();
  }
}


/* =========================================================
   Account / Auth / Cloud Progress Sync
   ========================================================= */
const authState = { loggedIn:false, user:null, syncing:false, lastSyncedAt:null };
let cloudSyncTimer = null;
let authFormError = '';

function scheduleCloudSync(){
  if(!authState.loggedIn) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(pushCloudProgress, 1200);
}

async function initAuth(){
  try{
    const res = await fetch('/api/auth/me', {credentials:'same-origin'});
    if(res.ok){
      const data = await res.json();
      authState.loggedIn = true;
      authState.user = data.user;
      updateAccountButton();
      await pullCloudProgressWithMergeCheck();
    } else {
      updateAccountButton();
    }
  }catch(e){
    // offline or backend unreachable — app still works fully in guest/local mode
    updateAccountButton();
  }
}

function updateAccountButton(){
  const btn = document.getElementById('accountBtn');
  if(!btn) return;
  if(authState.loggedIn && authState.user){
    btn.textContent = authState.user.username.charAt(0).toUpperCase();
    btn.classList.add('signed-in');
    btn.title = authState.user.username;
  } else {
    btn.textContent = '👤';
    btn.classList.remove('signed-in');
    btn.title = 'Sign in';
  }
}

function openAccountModal(){
  if(authState.loggedIn){
    renderAccountSummary();
  } else {
    renderAuthForm('login');
  }
}

function renderAuthForm(mode){
  authFormError = '';
  openModal(`
    <div class="eyebrow">Account</div>
    <h2>${mode==='login' ? 'Welcome back' : 'Create your account'}</h2>
    <div class="m-sub">Sign in to sync your XP, levels, streaks, lessons and badges across devices.</div>
    <div class="auth-tabs">
      <button class="${mode==='login'?'active':''}" onclick="renderAuthForm('login')">Log In</button>
      <button class="${mode==='signup'?'active':''}" onclick="renderAuthForm('signup')">Sign Up</button>
    </div>
    <div class="auth-error" id="authError"></div>
    <form id="authForm" onsubmit="return false;">
      ${mode==='signup' ? `
      <div class="auth-field">
        <label>USERNAME</label>
        <input type="text" id="authUsername" autocomplete="username" placeholder="cosmic_cadet" maxlength="20">
      </div>` : ''}
      <div class="auth-field">
        <label>${mode==='login' ? 'EMAIL OR USERNAME' : 'EMAIL'}</label>
        <input type="${mode==='login'?'text':'email'}" id="authIdentifier" autocomplete="${mode==='login'?'username':'email'}" placeholder="${mode==='login'?'you@example.com':'you@example.com'}">
      </div>
      <div class="auth-field">
        <label>PASSWORD</label>
        <input type="password" id="authPassword" autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="${mode==='login'?'••••••••':'At least 8 characters'}">
      </div>
      <div class="auth-submit-row">
        <button type="submit" class="btn" id="authSubmitBtn" onclick="${mode==='login'?'submitLogin()':'submitSignup()'}">${mode==='login'?'Log In':'Create Account'} →</button>
      </div>
    </form>
    <p style="font-size:10.5px;color:var(--text-faint);margin-top:16px;line-height:1.5;">Your password is hashed and never stored in plain text. You can keep exploring without an account — progress saves locally either way.</p>
  `);
}

function showAuthError(msg){
  const el = document.getElementById('authError');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
}
function setAuthBusy(busy, label){
  const btn = document.getElementById('authSubmitBtn');
  if(!btn) return;
  btn.disabled = busy;
  if(busy) btn._label = btn.textContent, btn.textContent = label || 'Please wait…';
  else if(btn._label) btn.textContent = btn._label;
}

async function submitSignup(){
  const username = document.getElementById('authUsername').value.trim();
  const email = document.getElementById('authIdentifier').value.trim();
  const password = document.getElementById('authPassword').value;
  document.getElementById('authError').classList.remove('show');

  if(!username || !email || !password){ showAuthError('Please fill in every field.'); return; }
  setAuthBusy(true, 'Creating account…');
  try{
    const res = await fetch('/api/auth/signup', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json','X-Requested-With':'AuraCosmos'},
      body: JSON.stringify({username, email, password})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok){ setAuthBusy(false); showAuthError(data.error || 'Could not create your account.'); return; }
    authState.loggedIn = true;
    authState.user = data.user;
    updateAccountButton();
    closeModal();
    showToast(`Welcome to Aura Cosmos, ${data.user.username}! ✨`);
    // brand new account — seed the cloud with whatever local/guest progress exists
    await pushCloudProgress(true);
  }catch(e){
    setAuthBusy(false);
    showAuthError('Could not reach the server. Please check your connection and try again.');
  }
}

async function submitLogin(){
  const identifier = document.getElementById('authIdentifier').value.trim();
  const password = document.getElementById('authPassword').value;
  document.getElementById('authError').classList.remove('show');

  if(!identifier || !password){ showAuthError('Please enter your email/username and password.'); return; }
  setAuthBusy(true, 'Signing in…');
  try{
    const res = await fetch('/api/auth/login', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json','X-Requested-With':'AuraCosmos'},
      body: JSON.stringify({identifier, password})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok){ setAuthBusy(false); showAuthError(data.error || 'Could not sign you in.'); return; }
    authState.loggedIn = true;
    authState.user = data.user;
    updateAccountButton();
    closeModal();
    showToast(`Welcome back, ${data.user.username}!`);
    await pullCloudProgressWithMergeCheck();
  }catch(e){
    setAuthBusy(false);
    showAuthError('Could not reach the server. Please check your connection and try again.');
  }
}

async function logoutAccount(){
  try{
    await fetch('/api/auth/logout', {method:'POST', credentials:'same-origin', headers:{'X-Requested-With':'AuraCosmos'}});
  }catch(e){}
  authState.loggedIn = false;
  authState.user = null;
  updateAccountButton();
  closeModal();
  showToast('Signed out — your progress is still saved on this device.');
}

function renderAccountSummary(){
  const u = authState.user;
  const initial = u.username.charAt(0).toUpperCase();
  const lastSync = authState.lastSyncedAt ? new Date(authState.lastSyncedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : 'just now';
  openModal(`
    <div class="eyebrow">Account</div>
    <div class="account-summary">
      <div class="account-avatar">${initial}</div>
      <div>
        <div class="account-name">${escapeHtml(u.username)}</div>
        <div class="account-email">${escapeHtml(u.email)}</div>
      </div>
    </div>
    <div class="sync-status"><span class="sync-dot" id="syncDot"></span><span id="syncStatusText">Cloud sync active · last synced ${lastSync}</span></div>
    <div class="stat-grid">
      <div class="glass stat-box"><div class="num">${state.xp}</div><div class="lbl">TOTAL XP</div></div>
      <div class="glass stat-box"><div class="num">LV.${getLevel()}</div><div class="lbl">LEVEL</div></div>
      <div class="glass stat-box"><div class="num">${state.streak}</div><div class="lbl">DAY STREAK</div></div>
      <div class="glass stat-box"><div class="num">${state.badges.length}</div><div class="lbl">BADGES</div></div>
    </div>
    <button class="btn ghost" style="margin-top:16px;width:100%;" onclick="logoutAccount()">Log Out</button>
  `);
}

/* ---- Cloud progress sync ---- */
async function pushCloudProgress(silent){
  if(!authState.loggedIn) return;
  authState.syncing = true;
  updateSyncIndicator();
  try{
    const res = await fetch('/api/progress', {
      method:'PUT', credentials:'same-origin',
      headers:{'Content-Type':'application/json','X-Requested-With':'AuraCosmos'},
      body: JSON.stringify(state)
    });
    if(res.ok){
      authState.lastSyncedAt = Date.now();
    }
  }catch(e){
    // silent — next successful save will retry via scheduleCloudSync
  }
  authState.syncing = false;
  updateSyncIndicator();
}

async function pullCloudProgress(){
  const res = await fetch('/api/progress', {credentials:'same-origin', headers:{'X-Requested-With':'AuraCosmos'}});
  if(!res.ok) return null;
  const data = await res.json();
  return data.progress;
}

function progressHasContent(p){
  if(!p) return false;
  return (p.xp||0) > 0 || (p.learnCompleted||[]).length>0 || (p.exploreDiscoveries||[]).length>0 ||
    (p.gamesCompleted||[]).length>0 || (p.badges||[]).length>0;
}

async function pullCloudProgressWithMergeCheck(){
  const cloud = await pullCloudProgress();
  if(!cloud) return;
  const cloudHasContent = progressHasContent(cloud);
  const localHasContent = progressHasContent(state);

  if(!cloudHasContent && localHasContent){
    // fresh cloud record, meaningful local guest progress — seed the cloud with it
    await pushCloudProgress(true);
    return;
  }
  if(!cloudHasContent){
    return; // nothing to adopt either way
  }
  if(cloudHasContent && localHasContent && (state.xp||0) > (cloud.xp||0) + 20){
    // both have real, differing progress — let the person choose rather than silently discarding either
    showProgressMergeChoice(cloud);
    return;
  }
  adoptCloudProgress(cloud);
}

function adoptCloudProgress(cloud){
  state = Object.assign({}, DEFAULT_STATE, cloud);
  saveState();
  authState.lastSyncedAt = Date.now();
  updateXPUI();
  routes[currentRoute] && routes[currentRoute]();
}

function showProgressMergeChoice(cloud){
  openModal(`
    <div class="eyebrow">Sync Conflict</div>
    <h2>Two sets of progress found</h2>
    <div class="m-body">This device has unsynced local progress, and your account already has cloud progress saved. Which would you like to keep?</div>
    <div class="sim-readout" style="margin-bottom:16px;">
      <div class="r-box"><div class="k">THIS DEVICE</div><div class="v">${state.xp} XP</div></div>
      <div class="r-box"><div class="k">CLOUD ACCOUNT</div><div class="v">${cloud.xp||0} XP</div></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn" onclick="resolveMerge('local')">Keep This Device's Progress</button>
      <button class="btn ghost" onclick="resolveMerge('cloud')">Keep Cloud Progress</button>
    </div>
  `);
  window._pendingCloudProgress = cloud;
}
function resolveMerge(choice){
  if(choice==='cloud'){
    adoptCloudProgress(window._pendingCloudProgress);
  } else {
    pushCloudProgress(true);
  }
  window._pendingCloudProgress = null;
  closeModal();
}

function updateSyncIndicator(){
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncStatusText');
  if(!dot || !text) return;
  if(authState.syncing){
    dot.classList.add('syncing');
    text.textContent = 'Syncing…';
  } else {
    dot.classList.remove('syncing');
    const t = authState.lastSyncedAt ? new Date(authState.lastSyncedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : 'just now';
    text.textContent = `Cloud sync active · last synced ${t}`;
  }
}

checkStreak();
updateXPUI();
go('home');
initAuth();
</script>
