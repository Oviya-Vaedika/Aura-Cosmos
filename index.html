<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Cosmos — Explore · Experiment · Play · Discover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-void:#05050d;
  --bg-void-2:#0a0a1c;
  --panel:rgba(20,18,42,0.55);
  --panel-solid:#12112a;
  --border:rgba(139,92,246,0.28);
  --border-bright:rgba(139,92,246,0.6);
  --violet:#8b5cf6;
  --violet-bright:#a78bfa;
  --cyan:#22d3ee;
  --magenta:#e879f9;
  --gold:#fbbf24;
  --text:#e9e7f7;
  --text-dim:#9490b8;
  --text-faint:#6a6690;
  --danger:#f87171;
  --good:#34d399;
  --radius:18px;
  --radius-sm:10px;
  --font-display:'Orbitron',sans-serif;
  --font-body:'Space Grotesk',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg-void);
  color:var(--text);
  font-family:var(--font-body);
  overflow-x:hidden;
  min-height:100vh;
  position:relative;
}
::selection{background:var(--violet);color:#fff;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-bright);border-radius:4px;}

/* ---------- Starfield ---------- */
#starfield{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(139,92,246,0.18), transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 100%, rgba(34,211,238,0.10), transparent 60%),
    radial-gradient(ellipse 50% 40% at 5% 80%, rgba(232,121,249,0.08), transparent 60%),
    linear-gradient(180deg,#05050d 0%, #0a0a1c 50%, #05050d 100%);
}
#starcanvas{position:fixed;inset:0;z-index:1;pointer-events:none;}

/* ---------- App shell ---------- */
#app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;}

header.topnav{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  padding:12px 20px;
  background:rgba(6,6,16,0.72);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brand img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(139,92,246,0.6));}
.brand-text{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:2px;
  background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;}

nav.primary-links{display:flex;gap:4px;background:rgba(255,255,255,0.03);padding:4px;border-radius:999px;border:1px solid var(--border);}
nav.primary-links button{
  padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:0.5px;
  color:var(--text-dim);transition:all .25s ease;
}
nav.primary-links button.active{
  background:linear-gradient(90deg, rgba(139,92,246,0.35), rgba(34,211,238,0.25));
  color:#fff;box-shadow:0 0 16px rgba(139,92,246,0.35) inset, 0 0 12px rgba(139,92,246,0.25);
}
nav.primary-links button:hover{color:#fff;}

.xp-indicator{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 10px 4px 4px;border-radius:999px;
  background:rgba(255,255,255,0.03);border:1px solid var(--border);}
.orbit-ring{position:relative;width:34px;height:34px;flex-shrink:0;}
.orbit-ring svg{transform:rotate(-90deg);}
.orbit-ring .track{stroke:rgba(255,255,255,0.08);}
.orbit-ring .prog{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .6s ease;}
.orbit-ring .dot{fill:var(--gold);filter:drop-shadow(0 0 4px var(--gold));}
.xp-text{display:flex;flex-direction:column;line-height:1.1;}
.xp-text .lvl{font-family:var(--font-mono);font-size:10px;color:var(--gold);letter-spacing:1px;}
.xp-text .num{font-family:var(--font-mono);font-size:12px;color:var(--text);}

/* mobile nav toggle */
.hamburger{display:none;width:34px;height:34px;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;}
.hamburger span{display:block;width:16px;height:2px;background:var(--text);position:relative;}
.hamburger span::before,.hamburger span::after{content:'';position:absolute;width:16px;height:2px;background:var(--text);left:0;}
.hamburger span::before{top:-5px;}
.hamburger span::after{top:5px;}

@media (max-width:820px){
  nav.primary-links{position:fixed;top:60px;left:12px;right:12px;flex-direction:column;background:rgba(8,8,20,0.96);
    border-radius:16px;padding:10px;display:none;gap:6px;z-index:39;}
  nav.primary-links.open{display:flex;}
  nav.primary-links button{text-align:left;padding:12px 14px;}
  .hamburger{display:flex;}
  .xp-text .num{display:none;}
}

main{flex:1;position:relative;z-index:2;}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 80px;}

/* ---------- Utility ---------- */
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--cyan);}
h1.page-title{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,4vw,42px);letter-spacing:1px;margin-bottom:8px;}
p.page-sub{color:var(--text-dim);max-width:640px;font-size:14.5px;line-height:1.6;margin-bottom:28px;}

.glass{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  backdrop-filter:blur(14px);
  position:relative;
}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(135deg, rgba(139,92,246,0.4), rgba(34,211,238,0.15), transparent 60%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}

.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 22px;border-radius:999px;font-weight:600;font-size:13px;letter-spacing:0.5px;
  background:linear-gradient(90deg,var(--violet),var(--cyan));color:#0a0a14;
  transition:transform .2s ease, box-shadow .2s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,0.4);}
.btn.ghost{background:rgba(255,255,255,0.05);color:var(--text);border:1px solid var(--border-bright);}
.btn.small{padding:7px 14px;font-size:11.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}

/* ---------- HOME ---------- */
.hero{text-align:center;padding:60px 20px 30px;position:relative;}
.hero-logo-wrap{width:180px;height:180px;margin:0 auto 18px;position:relative;}
#heroCanvas{position:absolute;inset:-40px;z-index:0;}
.hero-logo-wrap img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 0 40px rgba(139,92,246,0.55)) drop-shadow(0 0 80px rgba(34,211,238,0.25));
  animation:floaty 6s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0px);}50%{transform:translateY(-10px);}}
.hero-title{font-family:var(--font-display);font-weight:900;font-size:clamp(34px,7vw,64px);letter-spacing:6px;
  background:linear-gradient(90deg,#fff 10%,var(--cyan) 40%,var(--violet-bright) 65%,var(--magenta) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 60px rgba(139,92,246,0.35);}
.hero-tag{font-family:var(--font-mono);color:var(--text-dim);letter-spacing:4px;font-size:13px;margin-top:10px;text-transform:uppercase;}
.hero-tag span{color:var(--gold);}

.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:50px;}
@media (max-width:820px){.choice-grid{grid-template-columns:1fr;}}
.choice-card{padding:30px 24px;cursor:pointer;transition:transform .3s ease, box-shadow .3s ease;overflow:hidden;}
.choice-card:hover{transform:translateY(-6px);}
.choice-card .icon{font-size:34px;margin-bottom:14px;display:block;}
.choice-card h3{font-family:var(--font-display);font-size:17px;letter-spacing:1.5px;margin-bottom:8px;}
.choice-card p{color:var(--text-dim);font-size:13px;line-height:1.5;margin-bottom:16px;}
.choice-card .go{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;display:flex;align-items:center;gap:6px;}
.choice-card.learn:hover{box-shadow:0 0 0 1px var(--violet-bright), 0 20px 50px -20px rgba(139,92,246,0.6);}
.choice-card.explore:hover{box-shadow:0 0 0 1px var(--cyan), 0 20px 50px -20px rgba(34,211,238,0.6);}
.choice-card.experience:hover{box-shadow:0 0 0 1px var(--magenta), 0 20px 50px -20px rgba(232,121,249,0.6);}
.choice-card.learn .icon{color:var(--violet-bright);}
.choice-card.explore .icon{color:var(--cyan);}
.choice-card.experience .icon{color:var(--magenta);}

.home-section{margin-top:70px;}
.home-section .head-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.mystery-card{padding:26px;display:flex;flex-direction:column;gap:14px;}
.mystery-card textarea{width:100%;min-height:80px;background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text);padding:12px;font-family:var(--font-body);font-size:13.5px;resize:vertical;}
.mystery-card textarea:focus{outline:none;border-color:var(--cyan);}
.mystery-feedback{padding:14px;border-radius:var(--radius-sm);background:rgba(34,211,238,0.06);border:1px solid rgba(34,211,238,0.25);
  font-size:13.5px;line-height:1.6;color:var(--text);white-space:pre-wrap;}

/* ---------- Section header (Learn/Explore/Experience/Profile) ---------- */
.section-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:34px;}

/* ---------- LEARN MAP ---------- */
.learn-map{position:relative;max-width:640px;margin:0 auto;padding:20px 0 40px;}
.learn-map svg.path-line{position:absolute;inset:0;width:100%;height:100%;z-index:0;}
.lesson-node{position:relative;z-index:1;display:flex;align-items:center;gap:16px;margin-bottom:8px;padding:14px 18px;
  border-radius:999px;cursor:pointer;transition:all .25s ease;}
.lesson-node:nth-child(odd){margin-left:0;}
.lesson-node:nth-child(even){margin-left:auto;flex-direction:row-reverse;text-align:right;}
@media(max-width:600px){.lesson-node,.lesson-node:nth-child(even){margin-left:0;flex-direction:row;text-align:left;}}
.lesson-node .node-circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:15px;flex-shrink:0;border:2px solid var(--border-bright);
  background:var(--panel-solid);position:relative;}
.lesson-node.completed .node-circle{background:linear-gradient(135deg,var(--good),#0ea5e9);border-color:transparent;color:#04160f;}
.lesson-node.unlocked .node-circle{background:linear-gradient(135deg,var(--violet),var(--cyan));border-color:transparent;color:#0a0a14;
  box-shadow:0 0 22px rgba(139,92,246,0.5);}
.lesson-node.locked{opacity:.42;cursor:not-allowed;}
.lesson-node.locked .node-circle{color:var(--text-faint);}
.lesson-node .node-info h4{font-family:var(--font-display);font-size:13.5px;letter-spacing:0.5px;margin-bottom:3px;}
.lesson-node .node-info p{font-size:11.5px;color:var(--text-dim);}
.lesson-node:not(.locked):hover{background:rgba(255,255,255,0.04);}

/* ---------- Cards grids (explore/experience) ---------- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
.module-card{padding:22px;cursor:pointer;transition:transform .25s ease;}
.module-card:hover{transform:translateY(-4px);}
.module-card .m-icon{font-size:28px;}
.module-card h3{font-family:var(--font-display);font-size:14.5px;letter-spacing:0.5px;margin:12px 0 6px;}
.module-card p{font-size:12.5px;color:var(--text-dim);line-height:1.5;min-height:36px;}
.module-card .tag{display:inline-block;margin-top:12px;font-family:var(--font-mono);font-size:10px;letter-spacing:1px;
  padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-dim);}
.module-card .tag.ready{color:var(--good);border-color:rgba(52,211,153,0.4);}
.module-card .tag.soon{color:var(--gold);border-color:rgba(251,191,36,0.4);}

/* ---------- Profile ---------- */
.profile-hero{display:flex;gap:22px;align-items:center;padding:28px;flex-wrap:wrap;}
.profile-avatar{width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--cyan));
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:26px;font-weight:700;flex-shrink:0;
  box-shadow:0 0 30px rgba(139,92,246,0.4);}
.profile-hero .pname{font-family:var(--font-display);font-size:19px;letter-spacing:1px;}
.profile-hero .plevel{font-family:var(--font-mono);color:var(--gold);font-size:12.5px;margin-top:4px;}
.profile-bar-track{width:100%;height:8px;border-radius:999px;background:rgba(255,255,255,0.06);margin-top:10px;overflow:hidden;max-width:280px;}
.profile-bar-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:999px;transition:width .6s ease;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:26px 0;}
.stat-box{padding:18px;text-align:center;}
.stat-box .num{font-family:var(--font-mono);font-size:24px;color:var(--cyan);}
.stat-box .lbl{font-size:11px;color:var(--text-dim);margin-top:4px;letter-spacing:0.5px;}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;}
.badge{padding:18px 10px;text-align:center;transition:transform .2s ease;}
.badge.locked{opacity:.35;filter:grayscale(1);}
.badge .b-icon{font-size:30px;display:block;margin-bottom:8px;}
.badge .b-name{font-size:11px;color:var(--text-dim);line-height:1.3;}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(3,3,10,0.78);backdrop-filter:blur(6px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.modal-backdrop.open{opacity:1;pointer-events:auto;}
.modal-box{max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:28px;position:relative;
  transform:scale(.94);transition:transform .25s ease;}
.modal-backdrop.open .modal-box{transform:scale(1);}
.modal-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-dim);}
.modal-close:hover{color:#fff;background:rgba(255,255,255,0.12);}
.modal-box h2{font-family:var(--font-display);font-size:19px;letter-spacing:0.5px;margin-bottom:6px;padding-right:30px;}
.modal-box .m-sub{font-size:12px;color:var(--text-dim);font-family:var(--font-mono);margin-bottom:18px;}
.modal-box .m-body{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:20px;}
.quiz-q{margin-bottom:18px;}
.quiz-q p{font-size:13.5px;margin-bottom:10px;font-weight:600;}
.quiz-opt{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);
  margin-bottom:8px;font-size:13px;transition:all .2s ease;}
.quiz-opt:hover{border-color:var(--border-bright);background:rgba(255,255,255,0.03);}
.quiz-opt.selected{border-color:var(--cyan);background:rgba(34,211,238,0.08);}
.quiz-opt.correct{border-color:var(--good);background:rgba(52,211,153,0.12);}
.quiz-opt.wrong{border-color:var(--danger);background:rgba(248,113,113,0.12);}

/* explore module interactive panels */
.sim-controls{display:flex;flex-direction:column;gap:14px;margin:16px 0;}
.sim-controls label{font-size:11.5px;color:var(--text-dim);display:flex;justify-content:space-between;font-family:var(--font-mono);}
.sim-controls input[type=range]{width:100%;accent-color:var(--cyan);margin-top:6px;}
.sim-readout{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.sim-readout .r-box{padding:10px 12px;background:rgba(255,255,255,0.04);border-radius:var(--radius-sm);border:1px solid var(--border);}
.sim-readout .r-box .k{font-size:10px;color:var(--text-dim);font-family:var(--font-mono);}
.sim-readout .r-box .v{font-size:15px;color:var(--cyan);font-family:var(--font-mono);margin-top:2px;}
.bh-scene-wrap{width:100%;height:260px;border-radius:var(--radius-sm);background:radial-gradient(circle at 50% 45%,#0d0b1f,#020205 75%);border:1px solid var(--border);overflow:hidden;position:relative;cursor:grab;touch-action:none;}
.bh-scene-wrap:active{cursor:grabbing;}
.bh-scene-wrap canvas{display:block;}
.bh-scene-hint{position:absolute;bottom:8px;right:12px;font-family:var(--font-mono);font-size:9px;letter-spacing:1px;color:var(--text-faint);pointer-events:none;}
.sim-canvas-wrap{width:100%;height:220px;border-radius:var(--radius-sm);background:radial-gradient(circle at 50% 40%,#0d0b1f,#020205 75%);border:1px solid var(--border);overflow:hidden;position:relative;}
.sim-canvas-wrap canvas{display:block;width:100%;height:100%;}
.sim-select{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);padding:9px 12px;font-family:var(--font-body);font-size:13px;margin-top:6px;}
.sim-select:focus{outline:none;border-color:var(--cyan);}
.sim-note{font-size:10.5px;color:var(--text-faint);margin-top:10px;line-height:1.5;}

/* Orbit Rush */
.orbit-wrap{width:100%;height:340px;border-radius:var(--radius-sm);background:radial-gradient(circle at 50% 30%,#0d0b1f,#020205 75%);
  border:1px solid var(--border);overflow:hidden;position:relative;touch-action:none;user-select:none;}
.orbit-wrap canvas{display:block;width:100%;height:100%;}
.orbit-hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:2;}
.orbit-chip{font-family:var(--font-mono);font-size:10px;letter-spacing:0.5px;padding:4px 9px;border-radius:999px;
  background:rgba(6,6,16,0.72);border:1px solid var(--border);backdrop-filter:blur(6px);color:var(--text);}
.orbit-chip .lbl{color:var(--text-faint);margin-right:4px;}
.orbit-combo{position:absolute;top:8px;right:8px;font-family:var(--font-display);font-size:13px;color:var(--gold);
  text-shadow:0 0 10px rgba(251,191,36,0.7);z-index:2;pointer-events:none;opacity:0;transition:opacity .2s ease;}
.orbit-combo.show{opacity:1;}
.orbit-mobile-controls{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;
  padding:0 10px;z-index:3;pointer-events:none;}
.orbit-btn{pointer-events:auto;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:rgba(20,18,42,0.75);border:1.5px solid var(--border-bright);backdrop-filter:blur(6px);
  color:var(--text);touch-action:none;}
.orbit-btn:active, .orbit-btn.active{background:rgba(139,92,246,0.5);border-color:var(--cyan);}
.orbit-btn.shield.active{background:rgba(34,211,238,0.5);}
.orbit-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:10px;padding:20px;background:rgba(4,4,12,0.72);backdrop-filter:blur(4px);z-index:5;}
.orbit-overlay h3{font-family:var(--font-display);font-size:18px;letter-spacing:1px;}
.orbit-overlay p{font-size:12.5px;color:var(--text-dim);max-width:280px;line-height:1.6;}
.orbit-scoreboard{display:flex;gap:14px;margin-top:4px;}
.orbit-scoreboard div{text-align:center;}
.orbit-scoreboard .n{font-family:var(--font-mono);font-size:18px;color:var(--cyan);}
.orbit-scoreboard .l{font-size:9.5px;color:var(--text-faint);letter-spacing:1px;}
@media (hover:hover) and (pointer:fine){.orbit-mobile-controls{display:none;}}

/* Live Sky */
.sky-wrap{width:100%;aspect-ratio:1/1;max-height:400px;border-radius:var(--radius-sm);border:1px solid var(--border);
  overflow:hidden;position:relative;background:#03030a;touch-action:none;}
.sky-wrap canvas{display:block;width:100%;height:100%;}
.sky-permission{padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;}
.sky-permission .big-icon{font-size:38px;}
.sky-permission p{font-size:13px;color:var(--text-dim);line-height:1.6;max-width:360px;}
.sky-permission .privacy-note{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;max-width:360px;}
.sky-manual-form{display:flex;flex-direction:column;gap:8px;width:100%;max-width:280px;}
.sky-manual-form input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);padding:9px 12px;font-family:var(--font-mono);font-size:12.5px;}
.sky-manual-form input:focus{outline:none;border-color:var(--cyan);}
.sky-info-panel{position:absolute;left:8px;right:8px;bottom:8px;padding:10px 12px;border-radius:var(--radius-sm);
  background:rgba(6,6,16,0.85);border:1px solid var(--border-bright);backdrop-filter:blur(8px);z-index:4;
  font-size:12px;line-height:1.5;transform:translateY(8px);opacity:0;pointer-events:none;transition:all .2s ease;}
.sky-info-panel.show{transform:translateY(0);opacity:1;pointer-events:auto;}
.sky-info-panel .name{font-family:var(--font-display);font-size:13px;color:var(--cyan);margin-bottom:2px;}
.sky-info-panel .meta{color:var(--text-dim);font-family:var(--font-mono);font-size:10.5px;}
.sky-hud-top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;z-index:3;pointer-events:none;}
.sky-chip{font-family:var(--font-mono);font-size:10px;padding:4px 9px;border-radius:999px;background:rgba(6,6,16,0.72);
  border:1px solid var(--border);color:var(--text-dim);backdrop-filter:blur(6px);}
.sky-time-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
.sky-time-row input[type=range]{flex:1;accent-color:var(--cyan);}
.sky-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:10.5px;color:var(--text-dim);font-family:var(--font-mono);}
.sky-legend span{display:inline-flex;align-items:center;gap:4px;}
.sky-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* Account / Auth */
.account-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,0.05);border:1px solid var(--border);font-size:14px;flex-shrink:0;cursor:pointer;
  font-family:var(--font-display);font-weight:700;color:var(--text-dim);}
.account-btn.signed-in{background:linear-gradient(135deg,var(--violet),var(--cyan));color:#0a0a14;border-color:transparent;}
.auth-tabs{display:flex;gap:4px;background:rgba(255,255,255,0.03);padding:4px;border-radius:999px;border:1px solid var(--border);margin-bottom:18px;}
.auth-tabs button{flex:1;padding:8px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--text-dim);}
.auth-tabs button.active{background:linear-gradient(90deg,rgba(139,92,246,0.35),rgba(34,211,238,0.25));color:#fff;}
.auth-field{margin-bottom:12px;}
.auth-field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;font-family:var(--font-mono);letter-spacing:0.5px;}
.auth-field input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);padding:10px 12px;font-family:var(--font-body);font-size:13.5px;}
.auth-field input:focus{outline:none;border-color:var(--cyan);}
.auth-error{padding:10px 12px;border-radius:var(--radius-sm);background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);
  color:var(--danger);font-size:12.5px;margin-bottom:12px;display:none;}
.auth-error.show{display:block;}
.auth-submit-row{display:flex;align-items:center;gap:12px;margin-top:6px;}
.account-summary{display:flex;align-items:center;gap:14px;padding:6px 0 18px;}
.account-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--cyan));
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:18px;font-weight:700;color:#0a0a14;flex-shrink:0;}
.account-name{font-family:var(--font-display);font-size:15px;letter-spacing:0.5px;}
.account-email{font-size:11.5px;color:var(--text-dim);font-family:var(--font-mono);margin-top:2px;}
.sync-status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-dim);margin:14px 0;font-family:var(--font-mono);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 6px var(--good);flex-shrink:0;}
.sync-dot.syncing{background:var(--gold);box-shadow:0 0 6px var(--gold);animation:blink 1s infinite;}
.guest-sync-prompt{padding:16px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;}
.guest-sync-prompt p{font-size:12.5px;color:var(--text-dim);line-height:1.5;max-width:340px;margin:0;}

/* Cosmic Map */
.map-stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.map-stat-row .glass{padding:12px 18px;text-align:center;flex:1;min-width:110px;}
.map-stat-row .glass .num{font-family:var(--font-mono);font-size:19px;color:var(--cyan);}
.map-stat-row .glass .lbl{font-size:9.5px;color:var(--text-dim);margin-top:3px;letter-spacing:0.5px;}
.cosmic-map-wrap{position:relative;width:100%;margin-top:10px;}
.cosmic-map-svg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;overflow:visible;}
.map-node{position:absolute;transform:translate(-50%,-50%);z-index:2;display:flex;flex-direction:column;
  align-items:center;gap:7px;width:104px;text-align:center;cursor:pointer;}
.map-node.locked{cursor:not-allowed;}
.map-planet-ring{position:relative;width:66px;height:66px;}
.map-planet-ring svg{position:absolute;inset:0;transform:rotate(-90deg);}
.map-planet-ring .ring-track{stroke:rgba(255,255,255,0.08);}
.map-planet-ring .ring-prog{stroke:url(#mapRingGrad);stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
.map-planet{position:absolute;top:5px;left:5px;width:56px;height:56px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--border-bright);
  background:var(--panel-solid);transition:transform .2s ease;}
.map-node:hover:not(.locked) .map-planet{transform:scale(1.08);}
.map-node.locked .map-planet{background:rgba(255,255,255,0.02);border-style:dashed;border-color:var(--border);filter:grayscale(1);opacity:0.55;}
.map-node.discovered .map-planet{background:linear-gradient(135deg,var(--good),#0ea5e9);border-color:transparent;box-shadow:0 0 18px rgba(52,211,153,0.5);}
.map-node.current .map-planet{background:linear-gradient(135deg,var(--violet),var(--cyan));border-color:transparent;
  box-shadow:0 0 26px rgba(139,92,246,0.7);animation:mapPulse 2.2s ease-in-out infinite;}
.map-node.unlocked .map-planet{background:var(--panel-solid);border-color:var(--border-bright);}
.map-node .m-label{font-family:var(--font-display);font-size:11px;letter-spacing:0.4px;color:var(--text);line-height:1.3;}
.map-node .m-sub{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);}
.map-ship{position:absolute;font-size:26px;z-index:3;transform:translate(-50%,-135%);pointer-events:none;
  animation:shipFloat 3s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(139,92,246,0.85));}
.map-ship-label{position:absolute;transform:translate(-50%,0);z-index:3;font-family:var(--font-mono);font-size:9px;
  letter-spacing:1px;color:var(--cyan);text-shadow:0 0 6px rgba(34,211,238,0.7);white-space:nowrap;pointer-events:none;}
@keyframes shipFloat{0%,100%{transform:translate(-50%,-140%) rotate(-5deg);}50%{transform:translate(-50%,-125%) rotate(5deg);}}
@keyframes mapPulse{0%,100%{box-shadow:0 0 22px rgba(139,92,246,0.65);}50%{box-shadow:0 0 38px rgba(34,211,238,0.85);}}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10.5px;color:var(--text-dim);font-family:var(--font-mono);
  margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.map-legend span{display:inline-flex;align-items:center;gap:6px;}
.map-legend .swatch{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0;}

/* ---------- Toast ---------- */
#toastHost{position:fixed;top:70px;right:16px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{padding:14px 18px;border-radius:var(--radius-sm);min-width:220px;
  background:linear-gradient(90deg, rgba(139,92,246,0.9), rgba(34,211,238,0.85));color:#07070f;
  font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.4);
  animation:toastIn .3s ease, toastOut .3s ease 2.7s forwards;}
@keyframes toastIn{from{transform:translateX(40px);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes toastOut{to{transform:translateX(40px);opacity:0;}}

/* ---------- Dubis (AI companion) ---------- */
#aiFab{position:fixed;bottom:22px;right:22px;z-index:90;width:58px;height:58px;border-radius:50%;
  background:linear-gradient(135deg,var(--violet),var(--cyan));display:flex;align-items:center;justify-content:center;
  font-size:24px;box-shadow:0 8px 30px rgba(139,92,246,0.5);transition:transform .2s ease;}
#aiFab:hover{transform:scale(1.08);}
#aiPanel{position:fixed;bottom:92px;right:22px;z-index:91;width:min(360px,92vw);height:min(500px,70vh);
  display:flex;flex-direction:column;overflow:hidden;transform:translateY(20px) scale(.96);opacity:0;pointer-events:none;transition:all .25s ease;}
#aiPanel.open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto;}
.ai-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.ai-head .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);}
.ai-head h4{font-family:var(--font-display);font-size:12.5px;letter-spacing:1px;}
.ai-head p{font-size:10px;color:var(--text-dim);}
.ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;}
.ai-msg{font-size:12.5px;line-height:1.6;padding:10px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;}
.ai-msg.ai{background:rgba(139,92,246,0.14);border:1px solid rgba(139,92,246,0.25);align-self:flex-start;}
.ai-msg.user{background:rgba(34,211,238,0.12);border:1px solid rgba(34,211,238,0.25);align-self:flex-end;}
.ai-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);}
.ai-input-row input{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:999px;
  padding:9px 14px;color:var(--text);font-size:12.5px;font-family:var(--font-body);}
.ai-input-row input:focus{outline:none;border-color:var(--cyan);}
.ai-input-row button{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--cyan));
  color:#0a0a14;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.typing-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text-dim);margin-right:3px;animation:blink 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

.fade-in{animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

footer.foot{text-align:center;padding:26px;color:var(--text-faint);font-size:11px;font-family:var(--font-mono);letter-spacing:1px;position:relative;z-index:2;}
</style>
</head>

/* ---------- State ---------- */
const DEFAULT_STATE = {
  xp: 0,
  streak: 1,
  lastVisit: null,
  learnCompleted: [],      // indices of completed learn levels
  subProgress: {},         // {levelIndex: [completed sub-topic indices]}
  forgedStars: [],         // star classification ids forged in Star Forge
  gameLevels: {},          // {gameId: difficulty level reached} — drives escalating replay difficulty
  orbitRushHighScores: {desktop:0, mobile:0}, // best Orbit Rush score, tracked per input type
  exploreDiscoveries: [],  // ids of explore modules engaged
  gamesCompleted: [],
  badges: [],
  visitedSections: []
};
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem('auraCosmosState');
    if(raw) return Object.assign({}, DEFAULT_STATE, JSON.parse(raw));
  }catch(e){}
  return Object.assign({}, DEFAULT_STATE);
}
function saveState(){
  localStorage.setItem('auraCosmosState', JSON.stringify(state));
  if(typeof scheduleCloudSync === 'function') scheduleCloudSync();
}

const XP_PER_LEVEL = 500;
const LEVEL_NAMES = ["Space Cadet","Lunar Learner","Planet Explorer","Star Scout","Cosmic Observer",
  "Mission Specialist","Cosmic Researcher","Astrophysics Explorer","Mission Scientist","Cosmic Master"];

function getLevel(){ return Math.min(10, Math.floor(state.xp / XP_PER_LEVEL) + 1); }
function xpIntoLevel(){ return state.xp - (getLevel()-1)*XP_PER_LEVEL; }
function xpForNext(){ return getLevel()>=10 ? xpIntoLevel() : XP_PER_LEVEL; }

function addXP(amount, label){
  const beforeLevel = getLevel();
  state.xp += amount;
  saveState();
  updateXPUI();
  showToast(`+${amount} XP${label? ' — '+label:''}`);
  if(getLevel() > beforeLevel){
    setTimeout(()=>showToast(`⭐ LEVEL UP! You're now ${LEVEL_NAMES[getLevel()-1]}`), 500);
  }
  checkBadges();
}

function updateXPUI(){
  const lvl = getLevel();
  document.getElementById('navLevel').textContent = `LV.${lvl} ${LEVEL_NAMES[lvl-1].toUpperCase()}`;
  document.getElementById('navXp').textContent = `${xpIntoLevel()} / ${xpForNext()} XP`;
  const pct = Math.min(1, xpIntoLevel()/xpForNext());
  const ring = document.getElementById('ringProg');
  const circumference = 2*Math.PI*14;
  ring.setAttribute('stroke-dasharray', circumference);
  ring.setAttribute('stroke-dashoffset', circumference*(1-pct));
}

function showToast(msg){
  const host = document.getElementById('toastHost');
  const t = document.createElement('div');
  t.className='toast'; t.textContent = msg;
  host.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

function markVisited(section){
  if(!state.visitedSections.includes(section)){
    state.visitedSections.push(section); saveState(); checkBadges();
  }
}

/* ---------- Badges ---------- */
const BADGES = [
  {id:'blackhole', icon:'🕳️', name:'Black Hole Survivor', check:()=>state.exploreDiscoveries.includes('blackhole')},
  {id:'exoplanet', icon:'🔭', name:'Exoplanet Hunter', check:()=>state.exploreDiscoveries.includes('exoplanet')},
  {id:'asteroid', icon:'☄️', name:'Planetary Defender', check:()=>state.exploreDiscoveries.includes('asteroid')},
  {id:'star', icon:'⭐', name:'Stellar Architect', check:()=>state.exploreDiscoveries.includes('star')},
  {id:'darkmatter', icon:'🌑', name:'Dark Matter Investigator', check:()=>state.exploreDiscoveries.includes('darkmatter')},
  {id:'mars', icon:'🚀', name:'Mars Commander', check:()=>state.gamesCompleted.includes('mars')},
  {id:'livesky', icon:'🌃', name:'Sky Watcher', check:()=>state.exploreDiscoveries.includes('livesky')},
  {id:'explorer', icon:'🌌', name:'Cosmic Explorer', check:()=>['home','learn','explore','experience'].every(s=>state.visitedSections.includes(s))},
  {id:'xp100', icon:'🌱', name:'First Steps', check:()=>state.xp>=100},
  {id:'xp500', icon:'🚀', name:'Rising Explorer', check:()=>state.xp>=500},
  {id:'xp1500', icon:'🛰️', name:'Seasoned Voyager', check:()=>state.xp>=1500},
  {id:'xp3000', icon:'🌠', name:'Cosmic Veteran', check:()=>state.xp>=3000},
  {id:'xp6000', icon:'👑', name:'Astro Legend', check:()=>state.xp>=6000},
];
function checkBadges(){
  let changed=false;
  BADGES.forEach(b=>{
    if(b.check() && !state.badges.includes(b.id)){ state.badges.push(b.id); changed=true; }

async function submitMystery(){
  const input = document.getElementById('mysteryInput');
  const feedbackBox = document.getElementById('mysteryFeedback');
  const hypothesis = input.value.trim();
  if(!hypothesis){ showToast('Write a hypothesis first'); return; }
  feedbackBox.innerHTML = `<div class="mystery-feedback"><span class="typing-dots"><span></span><span></span><span></span></span> analyzing your reasoning...</div>`;
  const scenario = DAILY_MYSTERIES[dailyMysteryIndex()];
  const reply = await callScientist(
    `You are evaluating a learner's hypothesis for a daily astronomy mystery challenge. Be encouraging but scientifically honest. Keep it to 3-4 sentences. Observation: "${scenario}" Learner's hypothesis: "${hypothesis}". Comment on what's plausible, what's missing, and give one guiding follow-up question — do not simply give away the exact textbook answer.`
  );
  feedbackBox.innerHTML = `<div class="mystery-feedback">${escapeHtml(reply)}</div>`;
  addXP(40, 'Daily Mystery');
  input.value='';
}

function initHeroScene(){
  const canvas = document.getElementById('heroCanvas');
  if(!canvas || typeof THREE === 'undefined') return;
  const w = canvas.parentElement.clientWidth + 80, h = w;
  const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0,0.6,4.2);

  const ringGeo = new THREE.TorusGeometry(1.6, 0.02, 16, 100);
  const ringMat = new THREE.MeshBasicMaterial({color:0x8b5cf6, transparent:true, opacity:0.5});
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI/2.4;
  scene.add(ring);

  const ring2 = ring.clone();
  ring2.material = new THREE.MeshBasicMaterial({color:0x22d3ee, transparent:true, opacity:0.3});
  ring2.scale.set(1.25,1.25,1.25);
  ring2.rotation.x = Math.PI/2.1;
  ring2.rotation.z = 0.4;
  scene.add(ring2);

  const starGeo = new THREE.BufferGeometry();
  const starCount = 160;
  const positions = new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){
    const r = 2.2 + Math.random()*1.6;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.random()*Math.PI;
    positions[i*3] = r*Math.sin(phi)*Math.cos(theta);
    positions[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
    positions[i*3+2] = r*Math.cos(phi);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const starMat = new THREE.PointsMaterial({color:0xffffff, size:0.02, transparent:true, opacity:0.7});
  scene.add(new THREE.Points(starGeo, starMat));

  let raf;
  function animate(){
    raf = requestAnimationFrame(animate);
    ring.rotation.z += 0.004;
    ring2.rotation.z -= 0.003;
    renderer.render(scene, camera);
  }
  animate();
  window._heroCleanup && window._heroCleanup();
  window._heroCleanup = ()=>{ cancelAnimationFrame(raf); renderer.dispose(); };
}
